[workspace]

[package]
name = "dekopon-cli-probe-provider"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dekopon-provider-sdk = { path = "../../../crates/dekopon-provider-sdk", features = ["clap"] }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Each provider example is its own workspace, so the repository's [workspace.lints] table cannot
# reach guest code. This is the reachable part of it. `unsafe_code` is deliberately absent: a
# generated `export!` expands into `unsafe extern "C"` shims at the crate root, where no
# scoped `#[allow]` can reach, so denying it here would only force a crate-wide allow.
[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
