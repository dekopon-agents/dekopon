[workspace]

[package]
name = "dekopon-jsonplaceholder-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dekopon-provider-http = { version = "0.10.0", path = "../../../crates/dekopon-provider-http" }
dekopon-provider-sdk = { version = "0.10.0", path = "../../../crates/dekopon-provider-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wit-bindgen = { version = "0.44.0", default-features = false, features = ["macros", "realloc"] }

# Each provider example is its own workspace, so the repository's [workspace.lints] table cannot
# reach guest code. This is the reachable part of it. `unsafe_code` is deliberately absent: a
# provider that generates its own bindings expands wit-bindgen's `export!` into `unsafe extern "C"`
# shims at the crate root, where no scoped `#[allow]` can reach, so denying it here would only
# force a crate-wide allow that protects nothing.
[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
