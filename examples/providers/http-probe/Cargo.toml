[workspace]

[package]
name = "dekopon-http-probe-provider"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.cargo-machete]
ignored = ["clap"]

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
dekopon-provider-sdk = { path = "../../../crates/dekopon-provider-sdk", features = ["clap"] }
clap = { version = "4.6.0", features = ["derive"] }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Each provider example is its own workspace, so the repository's [workspace.lints] table cannot
# reach guest code. This is the reachable part of it. `unsafe_code` is deliberately absent: a
# provider that generates its own bindings expands wit-bindgen's `export!` into `unsafe extern "C"`
# shims at the crate root, where no scoped `#[allow]` can reach, so denying it here would only
# force a crate-wide allow that protects nothing.
[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
