[workspace]

[package]
name = "dekopon-skylight-private-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dekopon-provider-http = { version = "0.9.0", path = "../../../crates/dekopon-provider-http" }
dekopon-provider-sdk = { version = "0.9.0", path = "../../../crates/dekopon-provider-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wit-bindgen = { version = "0.44.0", default-features = false, features = ["macros", "realloc"] }
