[workspace]

[package]
name = "dekopon-echo-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dekopon-provider-sdk = { path = "../../../crates/dekopon-provider-sdk" }
# The default feature set intentionally generates no storage bindings/imports. This provider's
# decoded component import table is the generated proof of that property.
dekopon-provider-storage = { path = "../../../crates/dekopon-provider-storage", default-features = false }
serde_json = "1.0.140"
