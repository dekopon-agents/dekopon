# Slack app manifest for the dekopond gateway.
#
# Create the app at https://api.slack.com/apps → "Create New App" → "From a manifest",
# pick the workspace, and paste this file.
#
# This classic/free-workspace profile requests the reply surface plus the explicitly configured
# tangerine-reaction activity fallback:
#
# - Socket Mode, so events arrive over an outbound WebSocket wakeup and the gateway
#   needs no public HTTP endpoint.
# - `message.im` events (requires `im:history`), so direct messages reach DM routes.
# - `app_mention` events (requires `app_mentions:read`), so channel routes fire only
#   when the bot is explicitly addressed — dekopond ignores unaddressed channel
#   traffic by design.
# - `chat:write`, so the gateway can reply.
# - `files:write`, so an explicitly image-enabled route can share its one generated PNG.
# - `reactions:write`, so `activity.mode: native` with `classicFallback: reaction`
#   can add and later remove the fixed `:tangerine:` in-flight marker. Remove this scope and leave
#   activity off when even that cosmetic message mutation is unwanted.
#
# Two tokens exist after creation, and neither lives in any Dekopon config file —
# dekopond reads both from environment variables named in its `transports` entry:
#
# 1. App-level token (`xapp-...`): "Basic Information" → "App-Level Tokens" →
#    "Generate Token and Scopes" with the `connections:write` scope. Manifests cannot
#    declare app-level tokens; this step is always manual. This token opens the
#    Socket Mode connection.
# 2. Bot token (`xoxb-...`): "Install App" → install to the workspace. This token
#    sends the configured reaction activity and replies.
#
# To extend later: seeing every message in a public channel (not just mentions) needs
# the `channels:history` scope plus the `message.channels` event; private channels
# need `groups:history` plus `message.groups`. Add them here and reinstall the app.
#
# `files:read` is what lets the gateway open an attachment. An attachment is part of
# the message that carried it — Slack just delivers it by reference rather than by
# value — and resolving that reference is how the gateway hears the whole request.
# Without the scope Slack withholds the file's id and URL, and every upload is
# reported to the model as something it cannot open.
#
# The gateway does not read a file just because one arrived. Each is named in the
# prompt as `Chat Asset #N`, and the bytes are fetched only if the model calls
# `fetch_chat_asset` with that number. Nothing else in Dekopon gains authority from
# this scope: no policy and no provider credential. `files:write` below is the separate,
# explicit presentation permission used only for generated reply images.
display_information:
  name: dekopon
  description: Your fresh and zesty agent
  background_color: "#ff6a3d"
features:
  # Without the messages tab, Slack renders "Sending messages to this app has been
  # turned off" in the DM view and the gateway's primary route is unreachable.
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: dekopon
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - files:write
      - im:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
