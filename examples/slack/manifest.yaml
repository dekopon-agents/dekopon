# Slack app manifest for the dekopon-gatewayd gateway: the Agent profile, and the default.
#
# Create the app at https://api.slack.com/apps → "Create New App" → "From a manifest", pick the
# workspace, and paste this file. To update an existing app, paste it under "App Manifest", keeping
# your own `display_information` and `bot_user` names, then Save and Reinstall; the tokens stay the
# same. It pairs with the transport's default, `experience: agent`.
#
# Agent DMs are thread-scoped and `agents.sessions.setStatus(processing)` creates Slack's native
# Working/Stop UI. After one explicitly addressed message is freshly authorized, the same
# authenticated sender may continue inside that exact thread without repeating the mention. Dekopon
# handles `agent_session_stopped` cooperatively and queues a best-effort return to `active`.
# Slack also requires the `app_home_opened` bot event whenever `agent_view` is enabled; opening App
# Home is not itself a prompt, so dekopon-gatewayd safely acknowledges and ignores that event.
#
# Slack's Agent features depend on the workspace plan and admin policy. Without them, Agent status
# returns `feature_disabled` and dekopon-gatewayd uses the fixed `:tangerine:` reaction when
# `indicators.reaction.working: auto` opts in, then nothing if reactions are unavailable. There is
# no Stop control then: Slack's is plan-gated and `indicators.cancelButton` needs
# `experience: classic`; stop words still cancel. For a Stop button on such a workspace, use
# manifest-legacy.yaml with `experience: classic`. Final replies are independent of all of these.
#
# The bot scope split is:
# - `assistant:write`: declares the installed app as an Agent.
# - `canvases:read`: lets provider-slack's `slack.canvas.read` read the one canvas pinned in its
#   provider settings.
# - `chat:write`: posts replies and manages Agent session status.
# - `reactions:write`: optional working/seen reactions; leave both off when removing it.
# - `message.im`/`im:history`: direct-message prompts.
# - `app_mention`/`app_mentions:read`: explicitly addressed channel prompts.
# - `channels:read`, `groups:read`, `im:read`, `mpim:read` let the gateway look up a
#   mention's conversation kind. If the lookup fails, an addressed message uses channel routing.
# - `message.channels`/`channels:history` and `message.groups`/`groups:history`: receive channel
#   traffic for exact freshly authorized sender/thread continuations and opted-in thread follow.
#   Other ambient messages are dropped before routing, authorization, telemetry, or inference.
# - `files:read`: lazy access to attachments the sender included.
# - `files:write`: shares the one bounded PNG an explicitly image-enabled route generated.
#
# An xapp token with app-level `connections:write` is still generated manually; app manifests do
# not declare app-level tokens. Reinstall the app whenever bot scopes change.
display_information:
  name: dekopon
  description: Your fresh and zesty agent
  background_color: "#ff6a3d"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: A fresh and zesty agent for safely completing bounded tasks.
    suggested_prompts:
      - title: Review a pull request
        message: Review this pull request and summarize the important findings.
      - title: Check an incident
        message: Help me investigate this incident and identify the next safe step.
  bot_user:
    display_name: dekopon
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - canvases:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      # Follow leaves on human thumbs-down; user lookup distinguishes bot reactors.
      - reactions:read
      - users:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - agent_session_stopped
      - app_home_opened
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
