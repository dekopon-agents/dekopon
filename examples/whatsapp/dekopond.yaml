apiVersion: dekopon.dev/dekopond/v1alpha1
catalogPath: /etc/dekopon/dekopon.yaml
broker:
  socketPath: /run/dekopon/broker.sock
transports:
  - name: support-whatsapp
    kind: whatsappCloudApi
    debounceMs: 3000 # fixed media-first collection window; 0 preserves immediate admission
    appSecretEnv: DEKOPOND_WHATSAPP_APP_SECRET
    verifyTokenEnv: DEKOPOND_WHATSAPP_VERIFY_TOKEN
    accessTokenEnv: DEKOPOND_WHATSAPP_ACCESS_TOKEN
    bind: 0.0.0.0:9080
    callbackPath: /webhooks/whatsapp
    wabaId: "REPLACE_WITH_CANONICAL_NUMERIC_WABA_ID"
    phoneNumberId: "REPLACE_WITH_CANONICAL_NUMERIC_RECEIVING_PHONE_NUMBER_ID"
    graphApiVersion: v25.0
models:
  - name: local
    kind: openaiCompatible
    endpoint: http://127.0.0.1:11434/v1
    model: REPLACE_WITH_IMAGE_CAPABLE_MODEL
    modalities: [image]
    timeoutMs: 120000
    classes: [reasoning]
routes:
  - transport: support-whatsapp
    conversation: { kind: [directMessage] }
    agent: image-editor
    # A handle-aware image provider attaches; a separately granted asset.send delivers PNG/JPEG.
