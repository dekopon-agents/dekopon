# A local-only Dekopon catalog. Credential values are never stored here.
#
# The `github.*` capability names below are illustrative. This example is catalog-only: nothing
# here loads a component or contacts a broker, so the names exist to show the shape of a narrow
# grant rather than to match a shipped manifest. The real GitHub provider uses the `gh.*` namespace
# and lives at https://github.com/dekopon-agents/dekopon-provider-gh.
apiVersion: dekopon.dev/v1alpha1
kind: Provider
metadata:
  name: github
  labels:
    environment: local
spec:
  description: GitHub provider declaration for repository and pull-request operations
  type: github
  credentialRef: github-app-default
status: Unknown
---
apiVersion: dekopon.dev/v1alpha1
kind: Capability
metadata:
  name: github.pull-request.read
spec:
  description: Read pull-request metadata, diffs, and existing reviews
  provider: github
  effect: read-only
  risk: Low
  idempotency: idempotent
  permissions:
    - operation: pull_requests:read
status: Unknown
---
apiVersion: dekopon.dev/v1alpha1
kind: Capability
metadata:
  name: github.repository.read
spec:
  description: Read repository metadata and source content
  provider: github
  effect: read-only
  risk: Low
  idempotency: idempotent
  permissions:
    - operation: contents:read
    - operation: metadata:read
status: Unknown
---
apiVersion: dekopon.dev/v1alpha1
kind: Capability
metadata:
  name: github.pull-request.comment
spec:
  description: Post a pull-request review comment as an explicit external write
  provider: github
  effect: external-write
  risk: High
  idempotency: conditional
  permissions:
    - operation: pull_requests:write
      resource: review-comments
status: Unknown
---
apiVersion: dekopon.dev/v1alpha1
kind: Agent
metadata:
  name: reviewer
  labels:
    purpose: code-review
spec:
  description: Reviews pull requests without approval authority
  enabled: true
  # Standing orders handed to the model as its system prompt. This is untrusted text: it
  # shapes how the agent answers and can never grant, widen, or assert authority.
  instructions: >-
    Read the pull request, summarize the risky changes, and leave one review comment.
    Never claim to have approved anything.
  capabilities:
    - github.pull-request.read
    - github.pull-request.comment
  providers:
    - github
  modelClass: reasoning
  policyProfile: pull-request-review
status: Ready
---
apiVersion: dekopon.dev/v1alpha1
kind: Agent
metadata:
  name: snooper
  labels:
    purpose: capability-research
spec:
  description: Finds recurring tool gaps without making external changes
  enabled: false
  capabilities:
    - github.repository.read
  providers:
    - github
  modelClass: analysis
  policyProfile: repository-read-only
status: Disabled
