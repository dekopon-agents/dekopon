# dekopon-brokerd — the only process in this example that holds any authority.
#
# It owns the socket, the policy, the constraint sets, the GitHub credential, and the audit chain.
# The gateway holds none of those; it holds a Slack token and a model endpoint.
#
# Hygiene, all checked at startup and all fatal:
#   chmod 0600 broker.yaml policies.cedar
#   chmod 0600 broker-credentials.yaml     # 0o077 — group/world *readable* is refused, not just writable
#   chmod 0700 ~/.local/run/dekopon ~/.local/state/dekopon
# Every path below that is relative is resolved against this file's own directory, so the example
# runs from a checkout without editing paths that point inside the repository. The absolute
# `/home/xavier/...` paths are the ones to change: they are runtime state, not repository content.
apiVersion: dekopon.dev/brokerd/v1alpha1

socketPath: /home/xavier/.local/run/dekopon/broker.sock
auditPath: /home/xavier/.local/state/dekopon/audit.jsonl
checkpointPath: /home/xavier/.local/state/dekopon/audit-checkpoint.json
checkpointLockPath: /home/xavier/.local/state/dekopon/audit-checkpoint.lock

brokerPrincipal: local-broker
policyRevision: rubber-stamper-2026-01

# Relative to this file's directory. Copy broker-credentials.yaml.example, fill in the PAT, and
# `chmod 600` it. Startup fails closed if it is missing, group-readable, or names no `github-pat`.
credentialsPath: broker-credentials.yaml
policiesPath: policies.cedar

providers:
  # The checked-in gh component: 19 narrow GitHub capabilities, no `gh.api.*` passthrough.
  # Must be a regular single-link file owned by this UID under owner-owned directories.
  - ../providers/gh-provider.wasm

identities:
  # 501 is the server's own UID, which is what the owner-only socket currently permits: every
  # configured peer UID must equal the broker's. Change it to your own (`id -u`). In this
  # single-UID deployment the attestor grant buys attribution and deny-by-default scoping, not
  # separation — any process under this UID can already act as this peer. A dedicated gateway UID
  # is where `via` becomes real isolation, and that deployment is committed direction.
  - uid: 501
    principal: dekopond-gateway
    actor:
      type: service
      principal: dekopond-gateway
    attestor:
      # Segment-boundary prefixes, service name first. This grant lets the gateway *name* Slack
      # subjects in this workspace; it resolves none of them to a principal.
      namespaces: [slack.t0123abcd]

identityMappings:
  # The only place a Slack user becomes a principal. An unmapped sender reaches nothing, which is
  # why the Slack app can be installed workspace-wide without widening anything.
  - subject: slack.t0123abcd.u0123abcd
    principal: cpetersen

constraintSets:
  # One entry per capability the policy may reach. A capability with no entry is denied
  # `unconstrained-capability` before Cedar is consulted, and a policy naming one refuses startup.
  #
  # Every read carries `credential: github-pat` as well: a private repository returns 404 to an
  # unauthenticated read, so a read-only capability that cannot authenticate cannot see the pull
  # request it is about to be asked to approve. The credential is destination-bound to
  # api.github.com in the credentials file and injected inside the native HTTP engine; the model,
  # the shell session, and the guest component never observe it.
  gh.content.read:
    provider: gh
    effect: read-only
    risk: Low
    idempotency: idempotent
    credential: github-pat
    constraints:
      timeoutMs: 10000
      maxOutputBytes: 262144
      http:
        allowedHosts: [api.github.com]
        allowedMethods: [GET]
        maxRequests: 1
        maxRequestBytes: 16384
        maxResponseBytes: 2097152
        allowPlaintextLoopback: false
  gh.pull-request.list:
    provider: gh
    effect: read-only
    risk: Low
    idempotency: idempotent
    credential: github-pat
    constraints:
      timeoutMs: 10000
      maxOutputBytes: 65536
      http:
        allowedHosts: [api.github.com]
        allowedMethods: [GET]
        maxRequests: 1
        maxRequestBytes: 16384
        maxResponseBytes: 524288
        allowPlaintextLoopback: false
  gh.pull-request.read:
    provider: gh
    effect: read-only
    risk: Low
    idempotency: idempotent
    credential: github-pat
    constraints:
      timeoutMs: 10000
      maxOutputBytes: 32768
      http:
        allowedHosts: [api.github.com]
        allowedMethods: [GET]
        maxRequests: 1
        maxRequestBytes: 16384
        maxResponseBytes: 262144
        allowPlaintextLoopback: false
  gh.pull-request.files:
    provider: gh
    effect: read-only
    risk: Low
    idempotency: idempotent
    credential: github-pat
    constraints:
      timeoutMs: 10000
      maxOutputBytes: 131072
      http:
        allowedHosts: [api.github.com]
        allowedMethods: [GET]
        maxRequests: 1
        maxRequestBytes: 16384
        maxResponseBytes: 1048576
        allowPlaintextLoopback: false
  gh.pull-request.approve:
    provider: gh
    effect: external-write
    risk: High
    idempotency: conditional
    credential: github-pat
    constraints:
      timeoutMs: 15000
      maxOutputBytes: 8192
      http:
        allowedHosts: [api.github.com]
        # Two calls and two methods because the write pre-reads: one GET for the pull request,
        # one POST carrying the head SHA it just observed. That pre-read is what makes the
        # capability `conditional` and what lets it refuse a draft, a closed pull request, or a
        # head that moved, before anything is written.
        allowedMethods: [GET, POST]
        maxRequests: 2
        maxRequestBytes: 16384
        maxResponseBytes: 262144
        allowPlaintextLoopback: false

# Optional. Uncomment to export broker spans; the ingest token is read from
# OTEL_EXPORTER_OTLP_HEADERS by the SDK and never appears in this file.
# telemetry:
#   endpoint: http://127.0.0.1:5080/api/default
#   transport: http
#   serviceName: dekopon-brokerd
#   exportTimeoutMs: 5000
#   telemetryPayloads: false
