services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.0@sha256:a40c420d5d25f013243dbd7e025db1e39980385dcb9e5de924ce5a6a80957527
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?set OPENOBSERVE_ROOT_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?set OPENOBSERVE_ROOT_PASSWORD}
      ZO_TELEMETRY: "false"
    ports:
      - 127.0.0.1:${OPENOBSERVE_PORT:-5080}:5080
    volumes:
      - openobserve-data:/data
    restart: unless-stopped

volumes:
  openobserve-data:
