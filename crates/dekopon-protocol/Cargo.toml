[package]
name = "dekopon-protocol"
description = "Versioned resource types shared by Dekopon clients and runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-protocol"
readme = "README.md"
keywords = ["agents", "api", "capabilities", "protocol"]
categories = ["data-structures", "encoding"]
include = ["src/**", "README.md", "Cargo.toml"]

[features]
default = []
# `JsonSchema` derives for every public type, including the types they embed. Opt-in.
schemars = ["dep:schemars", "dekopon-capability/schemars", "dekopon-core/schemars"]

[dependencies]
dekopon-capability.workspace = true
dekopon-core.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
serde_yaml.workspace = true

[lints]
workspace = true
