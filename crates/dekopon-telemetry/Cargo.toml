[package]
name = "dekopon-telemetry"
description = "Shared OTLP exporter construction and W3C trace context for Dekopon processes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-telemetry"
readme = "README.md"
keywords = ["agents", "opentelemetry", "otlp", "tracing", "observability"]
categories = ["development-tools::debugging"]
include = ["src/**", "README.md", "Cargo.toml"]

[features]
exporter = [
    "dep:async-trait",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:reqwest",
    "dep:serde",
    "dep:thiserror",
    "dep:tracing-subscriber",
]

[dependencies]
async-trait = { workspace = true, optional = true }
opentelemetry.workspace = true
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking"] }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
opentelemetry_sdk.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber.workspace = true

[package.metadata.docs.rs]
features = ["exporter"]

[lints]
workspace = true
