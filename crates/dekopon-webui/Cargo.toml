[package]
name = "dekopon-webui"
description = "Unauthenticated read-only operational web UI for the Dekopon broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-webui"
