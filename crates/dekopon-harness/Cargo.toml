[package]
name = "dekopon-harness"
description = "Unprivileged checkpointed session runtime and token accounting for Dekopon agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-harness"
readme = "README.md"
keywords = ["agents", "llm", "orchestration", "sandbox"]
categories = ["development-tools"]
include = ["src/**", "README.md", "Cargo.toml"]

[dependencies]
dekopon-broker-protocol.workspace = true
# One cancellable process node per broker-leg command word, joined before the leg answers.
dekopon-process.workspace = true
# Loaded skills: the session shows a model text `dekopon-config` already read and bounded.
dekopon-config.workspace = true
dekopon-core.workspace = true
dekopon-model.workspace = true
dekopon-shell.workspace = true
dekopon-telemetry.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
dekopon-test-support = { path = "../dekopon-test-support" }
tracing-subscriber.workspace = true
dekopon-capability.workspace = true
rustix.workspace = true
tempfile.workspace = true

[lints]
workspace = true
