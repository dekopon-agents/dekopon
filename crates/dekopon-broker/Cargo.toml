[package]
name = "dekopon-broker"
description = "Deny-by-default authorization, execution, evidence, and audit core for Dekopon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-broker"
readme = "README.md"
keywords = ["agents", "authorization", "audit", "wasm", "security"]
categories = ["authentication", "development-tools"]
include = ["src/**", "README.md", "Cargo.toml"]

[dependencies]
async-trait.workspace = true
getrandom.workspace = true
dekopon-broker-host.workspace = true
dekopon-broker-protocol.workspace = true
dekopon-capability.workspace = true
dekopon-core.workspace = true
dekopon-policy.workspace = true
dekopon-storage-host.workspace = true
serde.workspace = true
# `raw_value` lets one serialization of an audit event be spliced into both the hash material and
# the durable line, without either JSON document being assembled by hand.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
dekopon-test-support = { path = "../dekopon-test-support" }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
