[workspace]

[package]
name = "dekopon-memory-smoke-probe-provider"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clap = { version = "4.5.32", default-features = false, features = ["derive", "std"] }
dekopon-provider-sdk = { path = "../../../../dekopon-provider-sdk" }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
