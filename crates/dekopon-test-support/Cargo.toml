[package]
name = "dekopon-test-support"
description = "Shared scaffolding for Dekopon's own tests; never published and never a normal dependency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Test scaffolding, not product surface. It is reachable only as a path `[dev-dependencies]` entry,
# so it stays out of `.github/release-crates.txt`, out of every published archive, and out of the
# dependency tree CI checks for broker crates inside `dekopond`.
publish = false

[dependencies]
# The three crates whose boundaries the shared doubles stand on: the prompt loop's script runtime,
# the model client's streaming contract, and the script outcome both of them speak. Every one of
# them is already a normal dependency of `dekopond`, and this crate reaches every consumer as a
# dev-dependency only, so `cargo tree --edges normal` for `dekopond` and `dekopon-brokerd` is
# unchanged by their presence here.
dekopon-agent.workspace = true
dekopon-model.workspace = true
dekopon-shell.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
