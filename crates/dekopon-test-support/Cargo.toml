[package]
name = "dekopon-test-support"
description = "Shared scaffolding for Dekopon's own tests; never published and never a normal dependency"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Test scaffolding, not product surface. It is reachable only as a path `[dev-dependencies]` entry,
# so it stays out of `.github/release-crates.txt`, out of every published archive, and out of the
# dependency tree CI checks for broker crates inside `dekopon-gatewayd`.
publish = false

[features]
agent-runtime = ["dep:dekopon-agent"]

[[test]]
name = "chat_fixtures"
required-features = ["agent-runtime"]

[dependencies]
parking_lot.workspace = true
# Every dekopon crate here is already a normal dependency of `dekopon-gatewayd`, and this crate
# reaches every consumer as a dev-dependency only, so `cargo tree --edges normal` for
# `dekopon-gatewayd` and `dekopon-brokerd` is unchanged by their presence here.
dekopon-agent = { workspace = true, optional = true }
dekopon-broker-protocol.workspace = true
dekopon-model.workspace = true
dekopon-shell.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
