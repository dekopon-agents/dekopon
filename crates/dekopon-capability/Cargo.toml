[package]
name = "dekopon-capability"
description = "Capability metadata and authorization-state types for Dekopon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-capability"
readme = "README.md"
keywords = ["agents", "authorization", "capabilities", "security"]
categories = ["authentication", "data-structures"]
include = ["src/**", "README.md", "Cargo.toml"]

[features]
default = []
# `JsonSchema` derives for every public type, including the dekopon-core types they embed. Opt-in.
schemars = ["dep:schemars", "dekopon-core/schemars"]

[dependencies]
dekopon-core.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
