[package]
name = "dekopon-provider-sdk-testkit"
description = "Typed native and real-component provider conformance harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-provider-sdk-testkit"
readme = "README.md"
keywords = ["agents", "wasm", "components", "testing", "provider"]
categories = ["development-tools::testing", "wasm"]
include = ["src/**", "README.md", "Cargo.toml"]

[dependencies]
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
dekopon-broker-protocol.workspace = true
tempfile.workspace = true
dekopon-broker-host.workspace = true
dekopon-provider-sdk.workspace = true
dekopon-http-host.workspace = true
dekopon-capability.workspace = true
dekopon-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
parking_lot.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false }
wasmparser = { version = "=0.259.0", default-features = false, features = ["component-model"] }

[dev-dependencies]
schemars = { version = "1.2.2", features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
dekopon-test-support = { path = "../dekopon-test-support" }
tokio.workspace = true
wat = "=1.261.0"

[lints]
workspace = true
