[package]
name = "dekopon-broker-host"
description = "Broker-owned bounded asynchronous WebAssembly provider host for Dekopon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-broker-host"
readme = "README.md"
keywords = ["agents", "wasm", "components", "http", "sandbox"]
categories = ["wasm", "web-programming::http-client"]
include = ["src/**", "wit/**", "README.md", "Cargo.toml"]

[dependencies]
dekopon-capability.workspace = true
dekopon-core.workspace = true
dekopon-http-host.workspace = true
dekopon-provider-sdk.workspace = true
dekopon-storage-host.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
wasmtime = { workspace = true, features = ["async"] }

[dev-dependencies]
# Path-only, deliberately: the testkit depends on this crate, so a version requirement here would
# be a package cycle crates.io cannot order. Cargo strips a dev-dependency carrying no version at
# package time, so the cycle exists only inside the workspace.
dekopon-provider-sdk-testkit = { path = "../dekopon-provider-sdk-testkit" }
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
