[package]
name = "dekopon-run"
description = "Direct WebAssembly provider runner and unprivileged broker client for Dekopon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-run"
readme = "README.md"
keywords = ["agents", "cli", "wasm", "llm", "benchmark"]
categories = ["command-line-utilities", "wasm"]
default-run = "dekopon-run"
include = ["src/**", "tests/**", "README.md", "Cargo.toml"]

[dependencies]
clap.workspace = true
dekopon-agent.workspace = true
dekopon-broker-protocol.workspace = true
# `prompt --skill` and `session replay --skill` read skill directories with the catalog's loader;
# the runner still has no catalog concept.
dekopon-config.workspace = true
dekopon-core.workspace = true
dekopon-model.workspace = true
dekopon-provider-host.workspace = true
# The three shared store/IO defaults its --max-* flags advertise live with the host plumbing.
dekopon-provider-sdk = { workspace = true, features = ["host"] }
dekopon-process.workspace = true
dekopon-shell.workspace = true
dekopon-telemetry.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true
# The OpenObserve search client behind `session`, on the same HTTP stack the model clients use.
# RFC 3339 rendering of the timestamps `session list` reads back.
time.workspace = true
ureq.workspace = true

[dev-dependencies]
dekopon-test-support = { path = "../dekopon-test-support" }
dekopon-broker.workspace = true
dekopon-broker-host.workspace = true
dekopon-brokerd.workspace = true
dekopon-capability.workspace = true
tempfile.workspace = true

[lints]
workspace = true
