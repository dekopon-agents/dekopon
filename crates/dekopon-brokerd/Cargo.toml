[package]
name = "dekopon-brokerd"
description = "Authenticated local Unix broker service for Dekopon provider execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-brokerd"
readme = "README.md"
keywords = ["agents", "broker", "authorization", "wasm", "ipc"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "README.md", "Cargo.toml"]

[dependencies]
clap.workspace = true
dekopon-broker.workspace = true
dekopon-broker-host.workspace = true
dekopon-http-host.workspace = true
dekopon-broker-protocol.workspace = true
dekopon-capability.workspace = true
dekopon-core.workspace = true
dekopon-storage-host.workspace = true
dekopon-telemetry.workspace = true
dekopon-webui.workspace = true
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true
fs2.workspace = true
futures-util.workspace = true
http-auth.workspace = true
libc.workspace = true
reqwest.workspace = true
rustix.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
dekopon-policy.workspace = true
tempfile.workspace = true
# `start_paused` lets the shutdown-drain tests assert a 120 s grace without waiting for one.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
