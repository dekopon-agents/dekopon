[package]
name = "dekopond"
description = "Unprivileged Dekopon chat gateway daemon: transports, routing, and bounded agent sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopond"
readme = "README.md"
keywords = ["agents", "daemon", "slack", "llm", "orchestration"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "tests/**", "README.md", "Cargo.toml"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
dekopon-agent.workspace = true
dekopon-broker-protocol.workspace = true
dekopon-config.workspace = true
dekopon-core.workspace = true
dekopon-model.workspace = true
# The cancel handle a native Stop fires into the broker leg's in-flight command run.
dekopon-process.workspace = true
dekopon-shell.workspace = true
dekopon-telemetry.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
dekopon-test-support = { path = "../dekopon-test-support" }
dekopon-brokerd.workspace = true
dekopon-storage-host.workspace = true
tempfile.workspace = true
# The paused clock the progress-policy tests drive: keep-alive ticks, coalescing windows, and a
# wall-clock budget are all minutes long, and waiting them out is not a test suite.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
