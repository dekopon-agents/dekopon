[package]
name = "dekopon-core"
description = "Dependency-light domain types and validated identifiers for Dekopon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dekopon-core"
readme = "README.md"
keywords = ["agents", "capabilities", "security", "types"]
categories = ["data-structures"]
include = ["src/**", "README.md", "Cargo.toml"]

[features]
default = []
# `JsonSchema` derives for every public type. Opt-in: leaving it off keeps schemars,
# schemars_derive, and syn out of every consumer that never calls a `JsonSchema` impl.
schemars = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

# The `accept()` classification is a table of Unix `errno` values; no other platform has one, and a
# wasm guest never listens, so the dependency stays off every non-Unix build of this crate.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
