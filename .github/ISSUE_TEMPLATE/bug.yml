name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials or unpatched vulnerability details. Use private vulnerability reporting for security issues.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including concise error output?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal redacted config and exact commands when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dekopon and Rust versions
      placeholder: "dekopon 0.1.0; rustc 1.x"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and other relevant context.
