name: memory-lab

on:
  pull_request:
    paths:
      - 'crates/dekopon-gatewayd/**'
      - 'crates/dekopon-agent/**'
      - 'crates/dekopon-model/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/memory-lab.yml'
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate commit SHA
        required: true
        type: string
      scenarios:
        description: Comma or space separated scenario names
        default: 'baseline flood summarizer-hang summarizer-fail summarizer-refuse unloadable-journal restart-mid-summary summaries-off-vs-on'
        type: string
      profile:
        description: Model profile (real requires LAB_OPENROUTER_API_KEY)
        type: choice
        options: [fake, real]
        default: fake
      max_usd:
        description: Maximum spend per real-profile scenario (greater than zero, at most 2)
        default: '2'
        type: string

permissions:
  contents: read

concurrency:
  group: memory-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LAB_HARNESS_SHA: 63eee72f78797a2ea637a4cfdb69202487e13099
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  self-test:
    name: memory-lab self-test (no build)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pinned harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LAB_HARNESS_SHA }}
          persist-credentials: false
      - name: Exercise the exit contract without Docker or Rust
        working-directory: lab/memory
        run: python3 -m unittest -v

  scenarios:
    name: memory-lab scenarios
    needs: self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE: ${{ github.event.pull_request.head.sha || inputs.candidate }}
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'fake' }}
      SCENARIOS: ${{ inputs.scenarios || 'baseline flood summarizer-hang summarizer-fail summarizer-refuse unloadable-journal restart-mid-summary summaries-off-vs-on' }}
      LAB_COST_CAP_USD: ${{ inputs.max_usd || '2' }}
      OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'real' && secrets.LAB_OPENROUTER_API_KEY || '' }}
    steps:
      - name: Check out the pinned harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LAB_HARNESS_SHA }}
          persist-credentials: false
      - name: Validate inputs and fetch the exact candidate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINPUT'
          import json, math, os, re, sys
          sys.path.insert(0, 'lab/memory')
          import report
          def reject(reason):
              print('lab: infrastructure: ' + reason, file=sys.stderr)
              sys.exit(5)
          if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ['CANDIDATE']):
              reject('candidate must be a full commit SHA')
          names = list(dict.fromkeys(os.environ['SCENARIOS'].replace(',', ' ').split()))
          if not names or any(name not in report.LABELS for name in names):
              reject('unknown or empty scenarios')
          profile = os.environ['PROFILE']
          if profile not in ('fake', 'real'):
              reject('profile must be fake or real')
          if profile == 'real' and not os.environ['OPENROUTER_API_KEY']:
              reject('LAB_OPENROUTER_API_KEY is absent')
          try:
              cap = float(os.environ['LAB_COST_CAP_USD'])
          except ValueError:
              reject('max_usd must be greater than zero and at most 2')
          if not math.isfinite(cap) or not 0 < cap <= 2:
              reject('max_usd must be greater than zero and at most 2')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('selected=' + json.dumps(names) + '\n')
              out.write('short=' + os.environ['CANDIDATE'][:8] + '\n')
          PYINPUT
          git fetch --no-tags origin "$LAB_HARNESS_SHA"
          test "$(git rev-parse HEAD)" = "$LAB_HARNESS_SHA"
          git fetch --no-tags origin "$CANDIDATE"
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p lab/memory/runs "$RUNNER_TEMP/memory-lab-results"
          echo "BASH_ENV=$RUNNER_TEMP/memory-lab.bash" >> "$GITHUB_ENV"
          cat >> "$RUNNER_TEMP/memory-lab.bash" <<'BASH'
          run_scenario() {
            local scenario="$1" status=0
            sudo -E env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
              bash lab/memory/run.sh "$CANDIDATE" "$scenario" --profile "$PROFILE" \
              >"$RUNNER_TEMP/memory-lab-results/$scenario.log" 2>&1 || status=$?
            cat "$RUNNER_TEMP/memory-lab-results/$scenario.log"
            printf '%s\n' "$status" >"$RUNNER_TEMP/memory-lab-results/$scenario.code"
            return "$status"
          }
          BASH
      - name: baseline (required)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'baseline') }}
        shell: bash
        run: run_scenario baseline
      - name: flood (required)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'flood') }}
        shell: bash
        run: run_scenario flood
      - name: summarizer-hang (required)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'summarizer-hang') }}
        shell: bash
        run: run_scenario summarizer-hang
      - name: summarizer-fail (required)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'summarizer-fail') }}
        shell: bash
        run: run_scenario summarizer-fail
      - name: summarizer-refuse (required)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'summarizer-refuse') }}
        shell: bash
        run: run_scenario summarizer-refuse
      - name: unloadable-journal (required)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'unloadable-journal') }}
        shell: bash
        run: run_scenario unloadable-journal
      - name: restart-mid-summary (exploratory)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'restart-mid-summary') }}
        shell: bash
        run: run_scenario restart-mid-summary
      - name: summaries-off-vs-on (exploratory)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'summaries-off-vs-on') }}
        shell: bash
        run: run_scenario summaries-off-vs-on
      - name: config-check (exploratory)
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && contains(fromJSON(steps.prepare.outputs.selected || '[]'), 'config-check') }}
        shell: bash
        run: run_scenario config-check
      - name: Summarize every scenario and enforce required results
        if: ${{ always() }}
        shell: bash
        env:
          PREPARED: ${{ steps.prepare.outcome }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" lab/memory/runs lab/memory/.work 2>/dev/null || true
          python3 - <<'PYSUMMARY'
          import json, os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'lab/memory')
          import report
          results = Path(os.environ['RUNNER_TEMP']) / 'memory-lab-results'
          lines = ['| Scenario | Label | Exit code | Reason | Candidate SHA | UID separation |',
                   '|---|---|---|---|---|---|']
          failed = os.environ['PREPARED'] != 'success'
          if failed:
              lines.append('| setup | infrastructure | 5 | input, fetch or runner setup failed; see log | '
                           + os.environ['CANDIDATE'] + ' | unavailable |')
          else:
              names = dict.fromkeys(os.environ['SCENARIOS'].replace(',', ' ').split())
              for name in names:
                  codefile = results / (name + '.code')
                  code = int(codefile.read_text()) if codefile.exists() else 5
                  logfile = results / (name + '.log')
                  log = logfile.read_text(errors='replace') if logfile.exists() else ''
                  reasons = re.findall(r'^lab: ([^\n]+)', log, re.M)
                  reason = reasons[-1] if reasons else 'infrastructure: scenario did not finish'
                  separation = 'unavailable'
                  directories = re.findall(r'^run directory: (.+)$', log, re.M)
                  if directories:
                      meta = Path(directories[-1]) / 'meta.json'
                      try:
                          separation = json.loads(meta.read_text())['uids']['separation']
                      except (OSError, ValueError, KeyError):
                          pass
                  label = report.LABELS[name]
                  failed |= (label == 'required' and code != 0) or code in (2, 3, 4, 5)
                  reason = reason.replace('|', '/').replace('\r', ' ')
                  lines.append(f'| {name} | {label} | {code} | {reason} | '
                               f'{os.environ["CANDIDATE"]} | {separation} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(lines) + '\n')
          sys.exit(1 if failed else 0)
          PYSUMMARY
      - name: Upload all run evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-lab-${{ steps.prepare.outputs.short || 'setup-failed' }}
          path: |
            lab/memory/runs/
            ${{ runner.temp }}/memory-lab-results/
          if-no-files-found: warn
          retention-days: 14
