name: Regen provider components

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WKG_VERSION: 0.16.0
  WKG_SHA256: 8ab0f7138e1a84616cb0c87c2bd7b7d00a356b63d458be92bad3fbd463aa3e2a
  WASM_TOOLS_VERSION: 1.236.1
  WASM_TOOLS_SHA256: 2ea92231826976cb001c6c6d8708ff54e1ef1ea7229968a75a2119ff26c4cd6f
  PROVIDER_RUST_TOOLCHAIN: 1.97.0

jobs:
  regen:
    name: rebuild providers on the CI image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned component tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/component-tools"
          mkdir -p "$tools/bin" "$tools/wasm-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu" \
            --output "$tools/wkg"
          echo "${WKG_SHA256}  $tools/wkg" | sha256sum --check --strict
          install -m 0755 "$tools/wkg" "$tools/bin/wkg"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            --output "$tools/wasm-tools.tar.gz"
          echo "${WASM_TOOLS_SHA256}  $tools/wasm-tools.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools/wasm-tools.tar.gz" \
            --directory "$tools/wasm-tools" --strip-components 1
          install -m 0755 "$tools/wasm-tools/wasm-tools" "$tools/bin/wasm-tools"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Rebuild every provider component
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup override set "$PROVIDER_RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          providers=(
            echo gh http-probe jsonplaceholder skylight-private memory-chat
            memory-reservation-probe provider-v0-1-compat storage-probe
          )
          for provider in "${providers[@]}"; do
            "examples/providers/$provider/build.sh"
          done
          ls -la examples/providers/*-provider.wasm

      - name: Upload regenerated components
        uses: actions/upload-artifact@v4
        with:
          name: provider-components
          path: examples/providers/*-provider.wasm
          if-no-files-found: error
