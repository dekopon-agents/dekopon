name: Homebrew tap

# A published release ends by pointing dekopon-agents/homebrew-tap at it.
#
# `release.yml` calls this workflow with `needs: github-release` rather than this workflow
# triggering on `release: published`. That event cannot fire in this repository: the release is
# created by `softprops/action-gh-release` authenticated with `GITHUB_TOKEN`, and GitHub does not
# start workflow runs from events raised by its own token. At v0.4.0 the release was published,
# `release.yml` went green, and this workflow produced no run at all — not skipped, never created.
# A `needs` edge states the ordering instead of inferring it from event plumbing, and it still
# cannot race the release the formula has to describe: every asset is attached before this starts.
#
# It remains a separate workflow file rather than steps inside the release job because re-running
# only the tap update costs nothing, while re-running `release.yml` repeats the whole build matrix.
# The `needs` edge does change one thing: the release object already exists when this runs, so a
# failure here reddens a run whose release was published. That is the accurate report for a
# release deliverable, which is why an unfinished tap credential setup skips rather than fails.
#
# It reads the release's assets and derives the formula's platforms from them.
# Adding or dropping a target changes the release, and the next run follows it.

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag to describe (for example v0.4.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One tap update at a time, and never cancelled. Deliberately not `release.yml`'s
  # `release-<tag>` group: a called workflow queued behind its own caller would deadlock.
  group: homebrew-tap
  cancel-in-progress: false

env:
  # Both entry points declare the same required input, so there is no event payload to read.
  RELEASE_TAG: ${{ inputs.tag }}
  TAP_REPOSITORY: dekopon-agents/homebrew-tap

jobs:
  formula:
    name: update the dekopon formula
    runs-on: ubuntu-24.04
    steps:
      # The `secrets` context is not available to a job- or step-level `if`, so
      # the credential check has to be a step that publishes an output.
      - name: Decide whether to update the tap
        id: credential
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
          # Compared as a rendered boolean so the key itself never reaches the shell.
          TAP_APP_KEY_SET: ${{ secrets.TAP_APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Read from the API rather than a release event payload: neither entry point carries
          # one. This doubles as the assertion that the release exists — a tag with no release
          # fails here rather than three steps later with a confusing download error.
          prerelease=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq .isPrerelease)
          if [ "$prerelease" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$RELEASE_TAG is a prerelease; the tap tracks stable releases only."
          elif [ -z "$TAP_APP_ID" ] || [ "$TAP_APP_KEY_SET" != "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_APP_ID or TAP_APP_PRIVATE_KEY is unset; skipping the Homebrew tap update." \
              "See README.md#homebrew-tap-automation to install the tap GitHub App."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Minted before anything is downloaded so an unfinished App setup costs one step. It is
      # allowed to fail: holding both secrets says the App exists, not that it was installed on
      # the tap, and `create-github-app-token` answers that with a 404 the next step translates.
      - name: Mint a short-lived tap installation token
        id: tap-token
        if: steps.credential.outputs.present == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: dekopon-agents
          repositories: homebrew-tap

      - name: Confirm the App can act on the tap
        id: installed
        if: steps.credential.outputs.present == 'true'
        env:
          MINT: ${{ steps.tap-token.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          # A missing installation is the same operator situation as a missing secret: the
          # credential half of the setup is not finished. It gets the same skip-with-explanation
          # rather than an action stack trace, because nothing about the release is wrong.
          if [ "$MINT" = "success" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Could not mint an installation token for $TAP_REPOSITORY; skipping the Homebrew tap update." \
            "Both secrets are set, so the App exists but is probably not installed on $TAP_REPOSITORY." \
            "See README.md#the-cross-repository-credential, step 6."
          {
            echo "### Homebrew tap skipped"
            echo
            echo "\`$RELEASE_TAG\` published, but no installation token could be minted for"
            echo "\`$TAP_REPOSITORY\`. Install the tap GitHub App on that repository, then re-run"
            echo "this workflow from the Actions tab with tag \`$RELEASE_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the release tag
        if: steps.installed.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
          path: source

      - name: Collect the release's published checksums
        if: steps.installed.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checksums
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz.sha256' --dir checksums --clobber
          ls -1 checksums

      - name: Check out the tap
        if: steps.installed.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ steps.tap-token.outputs.token }}
          persist-credentials: true
          path: tap

      - name: Render and push the formula
        if: steps.installed.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          # Re-running an older release must not roll the tap backwards. The
          # formula carries no explicit `version` stanza (brew audit --strict
          # rejects restating what it scans), so read it back out of a URL.
          existing=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' \
            tap/Formula/dekopon.rb | head -n 1)
          if [ -n "$existing" ] && [ "$existing" != "$version" ]; then
            newest=$(printf '%s\n%s\n' "$existing" "$version" | sort -V | tail -n 1)
            if [ "$newest" = "$existing" ]; then
              echo "::notice::Tap already describes $existing, which is newer than $version; leaving it alone."
              exit 0
            fi
          fi

          python3 source/.github/scripts/render-homebrew-formula.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --checksums checksums \
            --assets assets.json \
            --output tap/Formula/dekopon.rb

          cd tap
          # Re-running the same release renders identical bytes and commits nothing.
          if git diff --quiet -- Formula/dekopon.rb; then
            echo "::notice::Formula already matches $RELEASE_TAG; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dekopon.rb
          git commit -m "chore: update dekopon to ${version}" \
            -m "Rendered from the archives ${RELEASE_TAG} published in ${GITHUB_REPOSITORY}."
          git push origin HEAD:main
