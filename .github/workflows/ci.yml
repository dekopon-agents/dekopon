name: CI

# Branch protection makes this the pre-merge gate. The resulting main commit only warms read-only
# PR caches; it does not repeat test execution or publication validation.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: classify CI changes
    runs-on: ubuntu-24.04
    outputs:
      run_expensive: ${{ steps.classify.outputs.run_expensive }}
      run_rust: ${{ steps.classify.outputs.run_rust }}
      run_otel: ${{ steps.classify.outputs.run_otel }}
      run_package: ${{ steps.classify.outputs.run_package }}
      run_cli_install: ${{ steps.classify.outputs.run_cli_install }}
      run_dependencies: ${{ steps.classify.outputs.run_dependencies }}
      run_release_metadata: ${{ steps.classify.outputs.run_release_metadata }}
      run_chart: ${{ steps.classify.outputs.run_chart }}
    steps:
      - name: Check out source and pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" \
            | python3 .github/scripts/classify_ci_changes.py \
                --github-output "$GITHUB_OUTPUT" \
                --summary "$GITHUB_STEP_SUMMARY"

  # Missing classifier output is not false, so classification failures fall back to full CI.
  quality_checks:
    name: quality checks (stable)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_rust != 'false' }}
    runs-on: ubuntu-24.04
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_GHA_VERSION: dekopon-v1
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start CI metrics
        run: .github/scripts/ci_metrics.sh start
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-
      - name: Install cargo-machete
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Detect unused dependencies
        run: cargo machete
      - name: Verify runner excludes privileged broker machinery
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p dekopon-run --edges normal --prefix none)
          if grep -Eq '^dekopon-(broker|broker-host|brokerd|http-host|storage-host|policy) v' <<<"$tree"; then
            printf '%s\n' "$tree" >&2
            exit 1
          fi
      - name: Verify the operator CLI excludes privileged broker machinery
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p dekopon --edges normal --prefix none)
          if grep -Eq '^dekopon-(broker|broker-host|brokerd|http-host|storage-host|policy) v' <<<"$tree"; then
            printf '%s\n' "$tree" >&2
            exit 1
          fi
      - name: Verify gateway excludes privileged broker machinery
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p dekopond --edges normal --prefix none)
          if grep -Eq '^dekopon-(broker|broker-host|brokerd|http-host|storage-host|policy) v' <<<"$tree"; then
            printf '%s\n' "$tree" >&2
            exit 1
          fi
      - name: Verify emitted audit events are documented
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/observability.md
          emitted=()
          while IFS= read -r event; do
            emitted+=("$event")
          done < <(
            grep -rhoE 'audit\.event[[:space:]]*=[[:space:]]*"[a-z0-9_.]+"' --include='*.rs' crates \
              | grep -oE '"[a-z0-9_.]+"' \
              | tr -d '"' \
              | sort -u
          )
          # An empty set means the emission shape changed and this gate stopped reading anything,
          # which is the silent failure worth failing on.
          if [ ${#emitted[@]} -eq 0 ]; then
            echo 'no audit.event names found in crates/; the extraction pattern is stale' >&2
            exit 1
          fi
          status=0
          for event in "${emitted[@]}"; do
            if ! grep -Fq -- "\`$event\`" "$doc"; then
              echo "undocumented audit event: $event (add \`$event\` to $doc)" >&2
              status=1
            fi
          done
          printf 'checked %d audit event names against %s\n' "${#emitted[@]}" "$doc"
          exit "$status"
      - name: Format, lint, and test Rust provider examples
        env:
          CARGO_TARGET_DIR: target/provider-example-native
        run: |
          shopt -s nullglob
          manifests=(examples/providers/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo 'no provider workspaces matched examples/providers/*/Cargo.toml' >&2
            exit 1
          fi
          printf 'checking %s\n' "${manifests[@]}"
          for manifest in "${manifests[@]}"
          do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest"
          done
      - name: Install Rust provider target
        run: rustup target add wasm32-unknown-unknown
      - name: Check Rust provider examples
        env:
          CARGO_TARGET_DIR: target/provider-example
        run: |
          shopt -s nullglob
          manifests=(examples/providers/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo 'no provider workspaces matched examples/providers/*/Cargo.toml' >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"
          do
            cargo check --locked --manifest-path "$manifest" --target wasm32-unknown-unknown
          done
      - name: Check guest host-interface bindings for Wasm
        run: |
          cargo check --locked -p dekopon-provider-http --target wasm32-unknown-unknown
          cargo check --locked -p dekopon-provider-storage --no-default-features --target wasm32-unknown-unknown
          cargo check --locked -p dekopon-provider-storage --no-default-features --features jsonl --target wasm32-unknown-unknown
          cargo check --locked -p dekopon-provider-storage --no-default-features --features durable-files --target wasm32-unknown-unknown
      - name: Check repository shell scripts
        run: |
          shellcheck \
            .github/scripts/ci_metrics.sh \
            ci/fetch-external-provider-components.sh \
            examples/otel-traces/smoke-test.sh \
            examples/providers/build-component.sh \
            examples/providers/*/build.sh
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Finish CI metrics
        if: ${{ always() }}
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CARGO_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          if [[ -x .github/scripts/ci_metrics.sh ]]; then
            .github/scripts/ci_metrics.sh finish
          fi

  stable_tests:
    name: workspace tests (stable)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_rust != 'false' }}
    runs-on: ubuntu-24.04
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_GHA_VERSION: dekopon-v1
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start CI metrics
        run: .github/scripts/ci_metrics.sh start
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Fetch exact standalone-provider test fixtures
        run: ci/fetch-external-provider-components.sh examples/providers
      - name: Test workspace concurrently
        run: cargo nextest run --workspace --all-features --locked
      - name: Test documentation
        run: cargo test --workspace --all-features --locked --doc
      - name: Finish CI metrics
        if: ${{ always() }}
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CARGO_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          if [[ -x .github/scripts/ci_metrics.sh ]]; then
            .github/scripts/ci_metrics.sh finish
          fi

  # Preserve the required branch-protection context while its two expensive halves run in parallel.
  quality:
    name: quality (stable)
    needs: [changes, quality_checks, stable_tests]
    if: ${{ always() && !cancelled() && needs.changes.outputs.run_rust != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require stable quality lanes
        env:
          CHECKS_RESULT: ${{ needs.quality_checks.result }}
          TESTS_RESULT: ${{ needs.stable_tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success

  otel-e2e:
    name: OTLP OpenObserve smoke test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_otel != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Reads the mirrored OpenObserve image from this organization's registry. Narrower than the
    # mirror workflow, which is the only thing allowed to write one.
    permissions:
      contents: read
      packages: read
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_GHA_VERSION: dekopon-v1
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start CI metrics
        run: .github/scripts/ci_metrics.sh start
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-
      - name: Fetch exact standalone echo fixture
        run: ci/fetch-external-provider-components.sh examples/providers echo
      - name: Sign in to the organization registry
        # The example pulls upstream by default; CI pulls the mirror instead, because an anonymous
        # pull from a public registry fails on other people's traffic rather than on this change.
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Export runner traces to OpenObserve
        env:
          OPENOBSERVE_PORT: "15080"
          OPENOBSERVE_IMAGE: ghcr.io/${{ github.repository_owner }}/openobserve:v0.92.0@sha256:a40c420d5d25f013243dbd7e025db1e39980385dcb9e5de924ce5a6a80957527
        run: examples/otel-traces/smoke-test.sh
      - name: Finish CI metrics
        if: ${{ always() }}
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CARGO_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          if [[ -x .github/scripts/ci_metrics.sh ]]; then
            .github/scripts/ci_metrics.sh finish
          fi

  msrv:
    name: test (Rust 1.89.0)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_rust != 'false' }}
    runs-on: ubuntu-24.04
    # rust-toolchain.toml pins `channel = "stable"`, which outranks the `rustup default`
    # the toolchain action sets, so this job silently built on stable until 2026-08.
    # RUSTUP_TOOLCHAIN outranks the toolchain file and is what actually holds the MSRV.
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_GHA_VERSION: dekopon-v1
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start CI metrics
        run: .github/scripts/ci_metrics.sh start
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: 1.89.0
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-
      - name: Verify the MSRV toolchain is in effect
        shell: bash
        run: |
          set -euo pipefail
          expected=1.89.0
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$actual" != "$expected" ]; then
            printf 'MSRV gate is not binding: expected rustc %s, got %s\n' "$expected" "$actual" >&2
            rustup show >&2
            exit 1
          fi
      - name: Verify the declared MSRV matches this job
        shell: bash
        run: |
          set -euo pipefail
          expected=1.89.0
          declared=$(sed -ne 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$declared" != "$expected" ]; then
            printf 'workspace rust-version is %s but this job pins %s; update both\n' "$declared" "$expected" >&2
            exit 1
          fi
      - name: Fetch exact standalone-provider test fixtures
        run: ci/fetch-external-provider-components.sh examples/providers
      # Stable CI executes the tests. This gate proves that the same test targets still compile
      # and link on the declared minimum toolchain without serially executing the suite twice.
      - name: Compile workspace tests on MSRV
        run: cargo test --workspace --all-features --locked --no-run
      # Cargo cannot compile doctests under --no-run, so execute this small set to retain the
      # compile-fail authority checks on the minimum toolchain.
      - name: Test documentation on MSRV
        run: cargo test --workspace --all-features --locked --doc
      - name: Finish CI metrics
        if: ${{ always() }}
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CARGO_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          if [[ -x .github/scripts/ci_metrics.sh ]]; then
            .github/scripts/ci_metrics.sh finish
          fi

  package:
    name: package crates
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.run_rust != 'false' || needs.changes.outputs.run_package != 'false' || needs.changes.outputs.run_release_metadata != 'false') }}
    runs-on: ubuntu-24.04
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_GHA_VERSION: dekopon-v1
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start CI metrics
        run: .github/scripts/ci_metrics.sh start
      - name: Test CI path classification
        run: python3 .github/scripts/test_classify_ci_changes.py
      - name: Test changelog validation
        run: python3 .github/scripts/test_verify_changelog.py
      - name: Test release metadata validation
        run: python3 .github/scripts/test_verify_release_metadata.py
      - name: Check package shell scripts
        if: ${{ needs.changes.outputs.run_package != 'false' }}
        run: shellcheck .github/scripts/prepare-package-cache.sh
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Configure compiler cache
        if: ${{ needs.changes.outputs.run_package != 'false' }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry
        if: ${{ needs.changes.outputs.run_package != 'false' }}
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          .github/scripts/verify-release-metadata.py \
            --metadata "$RUNNER_TEMP/metadata.json" \
            --plan .github/release-crates.txt \
            --changelog CHANGELOG.md
      # Source-only changes are already compiled and tested from the same explicit src/** package
      # include sets. Archive verification is reserved for inputs that can change package contents,
      # dependency rewriting, build scripts, or publication metadata.
      - name: Package every publishable crate
        if: ${{ needs.changes.outputs.run_package != 'false' }}
        run: cargo package --workspace --locked
      - name: Test package-cache cleanup
        if: ${{ needs.changes.outputs.run_package != 'false' }}
        run: .github/scripts/prepare-package-cache.sh
      - name: Finish CI metrics
        if: ${{ always() }}
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CARGO_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          if [[ -x .github/scripts/ci_metrics.sh ]]; then
            .github/scripts/ci_metrics.sh finish
          fi

  cli-smoke:
    name: CLI smoke tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_rust != 'false' }}
    runs-on: ubuntu-24.04
    env:
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      SCCACHE_GHA_VERSION: dekopon-v1
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start CI metrics
        env:
          CI_EXTRA_TARGETS: ${{ runner.temp }}/dekopon-install-target
        run: .github/scripts/ci_metrics.sh start
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Restore Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-${{ runner.os }}-
      - name: Build CLIs
        run: cargo build --locked -p dekopon -p dekopon-run -p dekopon-brokerd -p dekopond
      - name: Fetch exact standalone echo fixture
        run: ci/fetch-external-provider-components.sh examples/providers echo
      - name: Exercise generated help and example commands
        shell: bash
        run: |
          set -euo pipefail
          bin=target/debug/dekopon
          runner=target/debug/dekopon-run
          broker=target/debug/dekopon-brokerd
          gateway=target/debug/dekopond
          config=examples/local/dekopon.yaml
          provider=examples/providers/echo-provider.wasm
          "$bin" --help >/dev/null
          "$bin" get --help >/dev/null
          "$bin" --config "$config" get agents >/dev/null
          "$bin" --config "$config" get agents -o wide >/dev/null
          "$bin" --config "$config" get agent reviewer -o yaml >/dev/null
          "$bin" --config "$config" get capabilities -o name >/dev/null
          "$bin" --config "$config" get providers >/dev/null
          "$bin" --config "$config" describe agent reviewer >/dev/null
          "$bin" --config "$config" validate >/dev/null
          "$bin" --config "$config" config view -o json >/dev/null
          "$runner" --help >/dev/null
          "$runner" broker --help >/dev/null
          "$runner" broker invoke --help >/dev/null
          "$runner" chat --help >/dev/null
          "$broker" --help >/dev/null
          "$broker" --version >/dev/null
          "$gateway" --help >/dev/null
          "$gateway" --version >/dev/null
          "$bin" auth chatgpt export --help >/dev/null
          DEKOPON_CHATGPT_AUTH_FILE="$RUNNER_TEMP/dekopon-chatgpt-test-auth.json" \
            "$bin" auth chatgpt status >/dev/null
          "$runner" inspect --provider "$provider" >/dev/null
          "$runner" invoke --provider "$provider" echo.echo --input '{}' >/dev/null
          "$runner" invoke --provider "$provider" echo.ransom-case \
            --input '{"message":"Hello, World!"}' >/dev/null
      - name: Verify credential export emits an applicable Secret
        shell: bash
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/dekopon-chatgpt-export-auth.json"
          cat >"$auth" <<'JSON'
          {"version":1,"access":"access-token-fixture","refresh":"refresh-token-fixture","expiresAt":1700000000,"accountId":"acct-fixture"}
          JSON
          target/debug/dekopon auth chatgpt export --auth-file "$auth" \
            --expose-credential --namespace dekopon >"$RUNNER_TEMP/chatgpt-secret.yaml"
          grep -q '^apiVersion: v1$' "$RUNNER_TEMP/chatgpt-secret.yaml"
          grep -q '^kind: Secret$' "$RUNNER_TEMP/chatgpt-secret.yaml"
          grep -q '^  namespace: dekopon$' "$RUNNER_TEMP/chatgpt-secret.yaml"
          # The Secret must carry the credential document itself, not a rendering of it.
          sed -n 's/^  chatgpt-auth.json: //p' "$RUNNER_TEMP/chatgpt-secret.yaml" \
            | base64 -d | diff - "$auth"
          # An export with no credential must fail rather than emit a half-formed secret.
          set +e
          target/debug/dekopon auth chatgpt export --auth-file "$RUNNER_TEMP/absent-auth.json" \
            --expose-credential >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify invalid configuration exit behavior
        shell: bash
        run: |
          set -euo pipefail
          invalid="$RUNNER_TEMP/invalid-dekopon.yaml"
          cat >"$invalid" <<'YAML'
          apiVersion: dekopon.dev/v1alpha1
          kind: Agent
          metadata:
            name: invalid
          spec:
            description: Missing declared capability
            capabilities: [github.missing]
          YAML
          set +e
          target/debug/dekopon --config "$invalid" validate >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify path installation
        if: ${{ needs.changes.outputs.run_cli_install != 'false' }}
        shell: bash
        # cargo install otherwise creates four independent temporary release target directories.
        # One shared directory preserves release/install coverage while compiling common crates once.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dekopon-install-target
        run: |
          set -euo pipefail
          cargo install --locked --path crates/dekopon --root "$RUNNER_TEMP/dekopon-install"
          cargo install --locked --path crates/dekopon-run --root "$RUNNER_TEMP/dekopon-install"
          cargo install --locked --path crates/dekopon-brokerd --root "$RUNNER_TEMP/dekopon-install"
          cargo install --locked --path crates/dekopond --root "$RUNNER_TEMP/dekopon-install"
          "$RUNNER_TEMP/dekopon-install/bin/dekopon" version
          "$RUNNER_TEMP/dekopon-install/bin/dekopon-run" --version
          "$RUNNER_TEMP/dekopon-install/bin/dekopon-brokerd" --version
          "$RUNNER_TEMP/dekopon-install/bin/dekopond" --version
      - name: Finish CI metrics
        if: ${{ always() }}
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CARGO_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
          CI_EXTRA_TARGETS: ${{ runner.temp }}/dekopon-install-target
        run: |
          if [[ -x .github/scripts/ci_metrics.sh ]]; then
            .github/scripts/ci_metrics.sh finish
          fi

  deny:
    name: dependency policy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_dependencies != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  chart:
    name: helm chart
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_chart != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Helm version
        run: helm version
      - name: Check chart shell scripts
        run: shellcheck charts/dekopon/ci/verify-init-permissions.sh
      - name: Verify chart changelog
        shell: bash
        run: |
          set -euo pipefail
          version=$(helm show chart charts/dekopon | awk '$1 == "version:" { print $2; exit }')
          python3 .github/scripts/verify_changelog.py \
            --changelog CHANGELOG.md \
            --entry "dekopon-chart-$version"
      - name: Lint the chart
        run: helm lint charts/dekopon
      - name: Render with default and realistic values
        shell: bash
        run: |
          set -euo pipefail
          helm template dekopon charts/dekopon > "$RUNNER_TEMP/default.yaml"
          helm template dekopon charts/dekopon \
            -f charts/dekopon/values-pr-summarizer-linter.yaml > "$RUNNER_TEMP/realistic.yaml"
          # The seed-once path adds a Secret, a projected source, an init block, and a subPath
          # mount, none of which the two renders above reach.
          helm template dekopon charts/dekopon \
            -f charts/dekopon/values-pr-summarizer-linter.yaml \
            --set gateway.chatgpt.enabled=true \
            --set gateway.chatgpt.existingSecret=dekopon-chatgpt-auth > "$RUNNER_TEMP/chatgpt.yaml"
          helm template dekopon charts/dekopon \
            --set providerStorage.enabled=true \
            --set providerStorage.existingKeySecret=dekopon-storage-key > "$RUNNER_TEMP/provider-storage.yaml"
          helm template dekopon charts/dekopon \
            -f charts/dekopon/values-pr-summarizer-linter.yaml \
            --set gateway.service.enabled=true > "$RUNNER_TEMP/gateway-service.yaml"
      # The drains run in sequence, so the pod's grace has to cover their sum. A guard that never
      # fires is not a guard: render the two shapes that must be refused and prove the message
      # names the number, not just that something went wrong.
      - name: Prove the termination budget is refused when it is too short
        shell: bash
        run: |
          set -euo pipefail
          assert_refused() {
            local expected="$1"
            shift
            if helm template dekopon charts/dekopon "$@" > "$RUNNER_TEMP/short-grace.yaml" 2> "$RUNNER_TEMP/short-grace.err"; then
              echo "expected 'helm template $*' to be refused, but it rendered" >&2
              exit 1
            fi
            grep -q -- "$expected" "$RUNNER_TEMP/short-grace.err" || {
              echo "refusal did not mention: $expected" >&2
              cat "$RUNNER_TEMP/short-grace.err" >&2
              exit 1
            }
          }
          # 120 s of gateway drain then 120 s of broker drain do not fit in 180 s. This was the
          # chart's own default until the assertion existed.
          assert_refused "terminationGracePeriodSeconds is 180" \
            -f charts/dekopon/values-pr-summarizer-linter.yaml \
            --set terminationGracePeriodSeconds=180
          # An existingSecret is opaque to the chart, so the arithmetic runs on the declared
          # assumption instead of silently skipping.
          assert_refused "dekopon-brokerd drains for 300000 ms" \
            --set broker.config.inline= \
            --set broker.config.existingSecret=dekopon-config \
            --set drainBudget.assumedBrokerShutdownGraceMs=300000
      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/default.yaml"
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/realistic.yaml"
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/chatgpt.yaml"
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/provider-storage.yaml"
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/gateway-service.yaml"
      # chart-publish.yml ships a tarball, not the working tree, and .helmignore decides what
      # goes in it. Package the chart and prove the archive renders byte-identically to the
      # source directory, so a file dropped from the package is a CI failure rather than a
      # surprise for whoever pulls it from GHCR.
      - name: Package the chart and prove the archive renders identically
        shell: bash
        run: |
          set -euo pipefail
          version=$(helm show chart charts/dekopon | awk '$1 == "version:" { print $2; exit }')
          helm package charts/dekopon --destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/dekopon-$version.tgz"
          helm lint "$tarball"
          for args in "" \
            "-f charts/dekopon/values-pr-summarizer-linter.yaml" \
            "-f charts/dekopon/values-pr-summarizer-linter.yaml --set gateway.service.enabled=true"; do
            # shellcheck disable=SC2086
            helm template dekopon charts/dekopon $args > "$RUNNER_TEMP/from-source.yaml"
            # shellcheck disable=SC2086
            helm template dekopon "$tarball" $args > "$RUNNER_TEMP/from-package.yaml"
            diff -u "$RUNNER_TEMP/from-source.yaml" "$RUNNER_TEMP/from-package.yaml"
          done
          # The README and the example values are documentation a consumer only has if they are
          # inside the archive. Materialize the listing before grep: with pipefail, grep -q can
          # otherwise close a successful tar early and turn its SIGPIPE into a false CI failure.
          tar -tzf "$tarball" > "$RUNNER_TEMP/chart-contents.txt"
          grep -Fxq 'dekopon/README.md' "$RUNNER_TEMP/chart-contents.txt"
          grep -Fxq 'dekopon/values-pr-summarizer-linter.yaml' "$RUNNER_TEMP/chart-contents.txt"
      # A rendered manifest that looks right is not a file that survives O_NOFOLLOW plus an owner
      # and mode check. This runs the init container's real command in a real container and
      # asserts every permission tier dekopon-brokerd enforces, then seeds a ChatGPT credential,
      # rotates it the way save_credentials does, restarts twice, and asserts the rotated bytes
      # survived — which is the only assertion that actually tests seed-once.
      - name: Prove the init container's output
        run: PLATFORM=linux/amd64 charts/dekopon/ci/verify-init-permissions.sh
