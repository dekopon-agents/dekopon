name: CI

# Branch protection makes this the pre-merge gate. Running the same seven expensive jobs again on
# the resulting main commit adds no coverage; tag workflows perform only publication work.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (stable)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify runner excludes privileged broker machinery
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p dekopon-run --edges normal --prefix none)
          if grep -Eq '^dekopon-(broker|broker-host|brokerd|http-host|storage-host|policy) v' <<<"$tree"; then
            printf '%s\n' "$tree" >&2
            exit 1
          fi
      - name: Verify gateway excludes privileged broker machinery
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p dekopond --edges normal --prefix none)
          if grep -Eq '^dekopon-(broker|broker-host|brokerd|http-host|storage-host|policy) v' <<<"$tree"; then
            printf '%s\n' "$tree" >&2
            exit 1
          fi
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Format, lint, and test Rust provider examples
        env:
          CARGO_TARGET_DIR: target/provider-example-native
        run: |
          shopt -s nullglob
          manifests=(examples/providers/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo 'no provider workspaces matched examples/providers/*/Cargo.toml' >&2
            exit 1
          fi
          printf 'checking %s\n' "${manifests[@]}"
          for manifest in "${manifests[@]}"
          do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest"
          done
      - name: Install Rust provider target
        run: rustup target add wasm32-unknown-unknown
      - name: Check Rust provider examples
        env:
          CARGO_TARGET_DIR: target/provider-example
        run: |
          shopt -s nullglob
          manifests=(examples/providers/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo 'no provider workspaces matched examples/providers/*/Cargo.toml' >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"
          do
            cargo check --locked --manifest-path "$manifest" --target wasm32-unknown-unknown
          done
      - name: Check guest host-interface bindings for Wasm
        run: |
          cargo check --locked -p dekopon-provider-http --target wasm32-unknown-unknown
          cargo check --locked -p dekopon-provider-storage --no-default-features --target wasm32-unknown-unknown
          cargo check --locked -p dekopon-provider-storage --no-default-features --features jsonl --target wasm32-unknown-unknown
          cargo check --locked -p dekopon-provider-storage --no-default-features --features durable-files --target wasm32-unknown-unknown
      - name: Check observability smoke-test script
        run: shellcheck examples/otel-traces/smoke-test.sh
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  otel-e2e:
    name: OTLP OpenObserve smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Reads the mirrored OpenObserve image from this organization's registry. Narrower than the
    # mirror workflow, which is the only thing allowed to write one.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: otel-openobserve
      - name: Sign in to the organization registry
        # The example pulls upstream by default; CI pulls the mirror instead, because an anonymous
        # pull from a public registry fails on other people's traffic rather than on this change.
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Export runner traces to OpenObserve
        env:
          OPENOBSERVE_PORT: "15080"
          OPENOBSERVE_IMAGE: ghcr.io/${{ github.repository_owner }}/openobserve:v0.92.0@sha256:a40c420d5d25f013243dbd7e025db1e39980385dcb9e5de924ce5a6a80957527
        run: examples/otel-traces/smoke-test.sh

  msrv:
    name: test (Rust 1.89.0)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: 1.89.0
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: msrv-1.89.0
      - name: Test workspace on MSRV
        run: cargo test --workspace --all-features --locked

  package:
    name: package crates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test changelog validation
        run: python3 .github/scripts/test_verify_changelog.py
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: package
          cache-bin: false
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          .github/scripts/verify-release-metadata.py \
            --metadata "$RUNNER_TEMP/metadata.json" \
            --plan .github/release-crates.txt \
            --changelog CHANGELOG.md
      - name: Package every publishable crate
        run: cargo package --workspace --exclude dekopon-testkit --locked
      - name: Prepare package cache for saving
        run: .github/scripts/prepare-package-cache.sh

  cli-smoke:
    name: CLI smoke tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build CLIs
        run: cargo build --locked -p dekopon -p dekopon-run -p dekopon-brokerd -p dekopond
      - name: Exercise generated help and example commands
        shell: bash
        run: |
          set -euo pipefail
          bin=target/debug/dekopon
          runner=target/debug/dekopon-run
          broker=target/debug/dekopon-brokerd
          gateway=target/debug/dekopond
          config=examples/local/dekopon.yaml
          provider=examples/providers/echo-provider.wasm
          "$bin" --help >/dev/null
          "$bin" get --help >/dev/null
          "$bin" --config "$config" get agents >/dev/null
          "$bin" --config "$config" get agents -o wide >/dev/null
          "$bin" --config "$config" get agent reviewer -o yaml >/dev/null
          "$bin" --config "$config" get capabilities -o name >/dev/null
          "$bin" --config "$config" get providers >/dev/null
          "$bin" --config "$config" describe agent reviewer >/dev/null
          "$bin" --config "$config" validate >/dev/null
          "$bin" --config "$config" config view -o json >/dev/null
          "$runner" --help >/dev/null
          "$runner" broker --help >/dev/null
          "$runner" broker invoke --help >/dev/null
          "$runner" chat --help >/dev/null
          "$broker" --help >/dev/null
          "$broker" --version >/dev/null
          "$gateway" --help >/dev/null
          "$gateway" --version >/dev/null
          "$bin" auth chatgpt export --help >/dev/null
          DEKOPON_CHATGPT_AUTH_FILE="$RUNNER_TEMP/dekopon-chatgpt-test-auth.json" \
            "$bin" auth chatgpt status >/dev/null
          "$runner" inspect --provider "$provider" >/dev/null
          "$runner" invoke --provider "$provider" echo.echo --input '{}' >/dev/null
          "$runner" invoke --provider "$provider" echo.ransom-case \
            --input '{"message":"Hello, World!"}' >/dev/null
      - name: Verify credential export emits an applicable Secret
        shell: bash
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/dekopon-chatgpt-export-auth.json"
          cat >"$auth" <<'JSON'
          {"version":1,"access":"access-token-fixture","refresh":"refresh-token-fixture","expiresAt":1700000000,"accountId":"acct-fixture"}
          JSON
          target/debug/dekopon auth chatgpt export --auth-file "$auth" \
            --expose-credential --namespace dekopon >"$RUNNER_TEMP/chatgpt-secret.yaml"
          grep -q '^apiVersion: v1$' "$RUNNER_TEMP/chatgpt-secret.yaml"
          grep -q '^kind: Secret$' "$RUNNER_TEMP/chatgpt-secret.yaml"
          grep -q '^  namespace: dekopon$' "$RUNNER_TEMP/chatgpt-secret.yaml"
          # The Secret must carry the credential document itself, not a rendering of it.
          sed -n 's/^  chatgpt-auth.json: //p' "$RUNNER_TEMP/chatgpt-secret.yaml" \
            | base64 -d | diff - "$auth"
          # An export with no credential must fail rather than emit a half-formed secret.
          set +e
          target/debug/dekopon auth chatgpt export --auth-file "$RUNNER_TEMP/absent-auth.json" \
            --expose-credential >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify invalid configuration exit behavior
        shell: bash
        run: |
          set -euo pipefail
          invalid="$RUNNER_TEMP/invalid-dekopon.yaml"
          cat >"$invalid" <<'YAML'
          apiVersion: dekopon.dev/v1alpha1
          kind: Agent
          metadata:
            name: invalid
          spec:
            description: Missing declared capability
            capabilities: [github.missing]
          YAML
          set +e
          target/debug/dekopon --config "$invalid" validate >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify path installation
        shell: bash
        run: |
          cargo install --locked --path crates/dekopon --root "$RUNNER_TEMP/dekopon-install"
          cargo install --locked --path crates/dekopon-run --root "$RUNNER_TEMP/dekopon-install"
          cargo install --locked --path crates/dekopon-brokerd --root "$RUNNER_TEMP/dekopon-install"
          cargo install --locked --path crates/dekopond --root "$RUNNER_TEMP/dekopon-install"
          "$RUNNER_TEMP/dekopon-install/bin/dekopon" version
          "$RUNNER_TEMP/dekopon-install/bin/dekopon-run" --version
          "$RUNNER_TEMP/dekopon-install/bin/dekopon-brokerd" --version
          "$RUNNER_TEMP/dekopon-install/bin/dekopond" --version

  deny:
    name: dependency policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  chart:
    name: helm chart
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Helm version
        run: helm version
      - name: Verify chart changelog
        shell: bash
        run: |
          set -euo pipefail
          version=$(helm show chart charts/dekopon | awk '$1 == "version:" { print $2; exit }')
          python3 .github/scripts/verify_changelog.py \
            --changelog CHANGELOG.md \
            --entry "dekopon-chart-$version"
      - name: Lint the chart
        run: helm lint charts/dekopon
      - name: Render with default and realistic values
        shell: bash
        run: |
          set -euo pipefail
          helm template dekopon charts/dekopon > "$RUNNER_TEMP/default.yaml"
          helm template dekopon charts/dekopon \
            -f charts/dekopon/values-pr-summarizer-linter.yaml > "$RUNNER_TEMP/realistic.yaml"
          # The seed-once path adds a Secret, a projected source, an init block, and a subPath
          # mount, none of which the two renders above reach.
          helm template dekopon charts/dekopon \
            -f charts/dekopon/values-pr-summarizer-linter.yaml \
            --set gateway.chatgpt.enabled=true \
            --set gateway.chatgpt.existingSecret=dekopon-chatgpt-auth > "$RUNNER_TEMP/chatgpt.yaml"
          helm template dekopon charts/dekopon \
            --set providerStorage.enabled=true \
            --set providerStorage.existingKeySecret=dekopon-storage-key > "$RUNNER_TEMP/provider-storage.yaml"
      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/default.yaml"
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/realistic.yaml"
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/chatgpt.yaml"
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.33.0 \
            < "$RUNNER_TEMP/provider-storage.yaml"
      # chart-publish.yml ships a tarball, not the working tree, and .helmignore decides what
      # goes in it. Package the chart and prove the archive renders byte-identically to the
      # source directory, so a file dropped from the package is a CI failure rather than a
      # surprise for whoever pulls it from GHCR.
      - name: Package the chart and prove the archive renders identically
        shell: bash
        run: |
          set -euo pipefail
          version=$(helm show chart charts/dekopon | awk '$1 == "version:" { print $2; exit }')
          helm package charts/dekopon --destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/dekopon-$version.tgz"
          helm lint "$tarball"
          for args in "" "-f charts/dekopon/values-pr-summarizer-linter.yaml"; do
            # shellcheck disable=SC2086
            helm template dekopon charts/dekopon $args > "$RUNNER_TEMP/from-source.yaml"
            # shellcheck disable=SC2086
            helm template dekopon "$tarball" $args > "$RUNNER_TEMP/from-package.yaml"
            diff -u "$RUNNER_TEMP/from-source.yaml" "$RUNNER_TEMP/from-package.yaml"
          done
          # The README and the example values are documentation a consumer only has if they are
          # inside the archive.
          tar -tzf "$tarball" | grep -qx 'dekopon/README.md'
          tar -tzf "$tarball" | grep -qx 'dekopon/values-pr-summarizer-linter.yaml'
      # A rendered manifest that looks right is not a file that survives O_NOFOLLOW plus an owner
      # and mode check. This runs the init container's real command in a real container and
      # asserts every permission tier dekopon-brokerd enforces, then seeds a ChatGPT credential,
      # rotates it the way save_credentials does, restarts twice, and asserts the rotated bytes
      # survived — which is the only assertion that actually tests seed-once.
      - name: Prove the init container's output
        run: PLATFORM=linux/amd64 charts/dekopon/ci/verify-init-permissions.sh
