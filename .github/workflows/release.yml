name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
      publish_to_crates:
        description: Publish crates in dependency order (requires environment approval)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # One package-dependency-ordered source of truth for every public workspace crate.
  # The validation job rejects omissions, duplicates, and normal/build/dev ordering mistakes.
  PUBLISH_CRATES: >-
    dekopon-core
    dekopon-provider-http
    dekopon-telemetry
    dekopon-capability
    dekopon-model
    dekopon-shell
    dekopon-http-host
    dekopon-protocol
    dekopon-provider-sdk
    dekopon-broker-host
    dekopon-broker-protocol
    dekopon-agent
    dekopon-config
    dekopon-provider-host
    dekopon
    dekopon-policy
    dekopon-broker
    dekopon-brokerd
    dekopon-run
    dekopond

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Verify tag and workspace versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dekopon") | .version')
          test "$RELEASE_TAG" = "v$version"
          test "$(cargo metadata --no-deps --format-version 1 | jq '[.packages[].version] | unique | length')" -eq 1
      - name: Verify crates.io publication plan
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              metadata = json.load(source)

          configured = os.environ["PUBLISH_CRATES"].split()
          if len(configured) != len(set(configured)):
              raise SystemExit("PUBLISH_CRATES contains a duplicate package")

          members = set(metadata["workspace_members"])
          packages = {
              package["name"]: package
              for package in metadata["packages"]
              if package["id"] in members and package.get("publish") != []
          }
          missing = sorted(set(packages) - set(configured))
          extra = sorted(set(configured) - set(packages))
          if missing or extra:
              raise SystemExit(
                  f"PUBLISH_CRATES does not match publishable workspace packages; "
                  f"missing={missing}, extra={extra}"
              )

          position = {name: index for index, name in enumerate(configured)}
          for name, package in packages.items():
              for dependency in package["dependencies"]:
                  dependency_name = dependency["name"]
                  if (
                      dependency_name in packages
                      and position[dependency_name] > position[name]
                  ):
                      raise SystemExit(
                          f"{dependency_name} must be published before dependent package {name}"
                      )

          print("crates.io publication order:")
          for index, name in enumerate(configured, start=1):
              print(f"{index:>2}. {name}")
          PY
      - name: Run release validation
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Verify runner excludes privileged broker machinery
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p dekopon-run --edges normal --prefix none)
          if grep -Eq '^dekopon-(broker|broker-host|brokerd|http-host|policy) v' <<<"$tree"; then
            printf '%s\n' "$tree" >&2
            exit 1
          fi
      - name: Verify gateway excludes privileged broker machinery
        shell: bash
        run: |
          set -euo pipefail
          tree=$(cargo tree --locked -p dekopond --edges normal --prefix none)
          if grep -Eq '^dekopon-(broker|broker-host|brokerd|http-host|policy) v' <<<"$tree"; then
            printf '%s\n' "$tree" >&2
            exit 1
          fi
      - name: Package every publishable crate
        run: cargo package --workspace --exclude dekopon-testkit --locked
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  artifacts:
    name: build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install target toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build CLIs
        run: cargo build --release --locked -p dekopon -p dekopon-run -p dekopon-brokerd -p dekopond --target ${{ matrix.target }}
      - name: Create archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="dekopon-${version}-${{ matrix.target }}"
          mkdir -p "staging/$archive/providers"
          cp "target/${{ matrix.target }}/release/dekopon" "staging/$archive/"
          cp "target/${{ matrix.target }}/release/dekopon-run" "staging/$archive/"
          cp "target/${{ matrix.target }}/release/dekopon-brokerd" "staging/$archive/"
          cp "target/${{ matrix.target }}/release/dekopond" "staging/$archive/"
          cp README.md LICENSE-APACHE LICENSE-MIT "staging/$archive/"
          cp crates/dekopon-brokerd/README.md "staging/$archive/BROKER.md"
          cp crates/dekopond/README.md "staging/$archive/GATEWAY.md"
          cp examples/providers/jsonplaceholder-provider.wasm "staging/$archive/providers/"
          cp examples/providers/jsonplaceholder/README.md \
            "staging/$archive/providers/JSONPLACEHOLDER.md"
          tar -C staging -czf "$archive.tar.gz" "$archive"
          shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dekopon-${{ matrix.target }}
          path: |
            dekopon-*.tar.gz
            dekopon-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: publish GitHub release
    needs: [validate, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      # The tag this job actually published, handed to the jobs that package it. A reusable
      # workflow reads `github.*` from its caller, so it cannot re-derive the tag itself.
      tag: ${{ steps.published.outputs.tag }}
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dekopon-*
          path: dist
          merge-multiple: true
      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
      - name: Record the published tag
        id: published
        shell: bash
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  # `release: published` never reaches these two. GitHub does not create workflow runs from
  # events raised by `GITHUB_TOKEN`, and the job above publishes the release with exactly that
  # token, so its `release` event is dispatched to nothing: at v0.4.0 both workflows produced no
  # run at all. Calling them as jobs makes the ordering a declared dependency instead of an
  # emergent property of event plumbing. `needs: github-release` is what guarantees the archives
  # and their `.sha256` sidecars are attached — and their attestations recorded, one step
  # earlier in the same job — before either one downloads and verifies them.
  #
  # Both keep their own `workflow_dispatch` for recovery, and each is called only from the tag
  # push. A `workflow_dispatch` of this workflow exists to publish crates against an already
  # released tag; republishing the image there would overwrite an immutable release tag with a
  # freshly built digest, and the tap render would be a no-op.
  container-image:
    name: publish container image
    needs: github-release
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # No `secrets: inherit`: it authenticates to GHCR with `GITHUB_TOKEN`, which a called
    # workflow always has, and it needs no repository secret.
    uses: ./.github/workflows/container-image.yml
    with:
      tag: ${{ needs.github-release.outputs.tag }}

  homebrew-tap:
    name: update Homebrew tap
    needs: github-release
    if: github.event_name == 'push'
    permissions:
      contents: read
    # Inherited for TAP_APP_ID and TAP_APP_PRIVATE_KEY; the App token it mints from them is what
    # reaches the other repository, never this workflow's `GITHUB_TOKEN`.
    secrets: inherit
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.github-release.outputs.tag }}

  crates-io:
    name: publish crates.io packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_crates }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: stable
      - name: Package every publishable crate
        run: cargo package --workspace --exclude dekopon-testkit --locked
      - name: Request short-lived crates.io credential
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "dekopon") | .version')
          publish() {
            crate="$1"
            status=$(curl --silent --show-error --retry 3 \
              --output /dev/null --write-out '%{http_code}' \
              --user-agent "dekopon-release-workflow" \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200)
                printf 'Skipping %s %s; crates.io already has this immutable version.\n' \
                  "$crate" "$version"
                return
                ;;
              404) ;;
              *)
                printf 'crates.io returned HTTP %s while checking %s %s.\n' \
                  "$status" "$crate" "$version" >&2
                exit 1
                ;;
            esac
            publish_output=$(mktemp)
            while ! cargo publish --locked -p "$crate" 2>&1 | tee "$publish_output"; do
              if ! grep -q '429 Too Many Requests' "$publish_output"; then
                rm -f "$publish_output"
                return 1
              fi
              delay=$(python3 -c 'import datetime, email.utils, re, sys; output = open(sys.argv[1], encoding="utf-8").read(); match = re.search(r"after (.+? GMT)", output); now = datetime.datetime.now(datetime.timezone.utc); print(max(5, int((email.utils.parsedate_to_datetime(match.group(1)) - now).total_seconds()) + 5) if match else 610)' "$publish_output")
              printf 'crates.io new-package limit reached; retrying %s in %s seconds.\n' \
                "$crate" "$delay"
              sleep "$delay"
              : > "$publish_output"
            done
            rm -f "$publish_output"
            # Allow the sparse index to make this dependency visible to the next package.
            sleep 30
          }
          for crate in $PUBLISH_CRATES; do
            publish "$crate"
          done
