name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
      publish_to_crates:
        description: Publish crates in dependency order (requires environment approval)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable toolchain action
        with:
          toolchain: stable
          components: clippy,rustfmt
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Verify tag and workspace versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "dekopon") | .version')
          test "$RELEASE_TAG" = "v$version"
          test "$(cargo metadata --no-deps --format-version 1 | jq '[.packages[].version] | unique | length')" -eq 1
      - name: Run release validation
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Package every publishable crate
        run: cargo package --workspace --exclude dekopon-testkit --locked
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  artifacts:
    name: build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install target toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable toolchain action
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build CLIs
        run: cargo build --release --locked -p dekopon -p dekopon-run --target ${{ matrix.target }}
      - name: Create archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="dekopon-${version}-${{ matrix.target }}"
          mkdir -p "staging/$archive"
          cp "target/${{ matrix.target }}/release/dekopon" "staging/$archive/"
          cp "target/${{ matrix.target }}/release/dekopon-run" "staging/$archive/"
          cp README.md LICENSE-APACHE LICENSE-MIT "staging/$archive/"
          tar -C staging -czf "$archive.tar.gz" "$archive"
          shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - name: Upload CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dekopon-${{ matrix.target }}
          path: |
            dekopon-*.tar.gz
            dekopon-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: publish GitHub release
    needs: [validate, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dekopon-*
          path: dist
          merge-multiple: true
      - name: Attest release binaries
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  crates-io:
    name: publish crates.io packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_crates }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable toolchain action
        with:
          toolchain: stable
      - name: Package every publishable crate
        run: cargo package --workspace --exclude dekopon-testkit --locked
      - name: Request short-lived crates.io credential
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            cargo publish --locked -p "$1"
            # Allow the sparse index to make this dependency visible to the next package.
            sleep 30
          }
          publish dekopon-core
          publish dekopon-capability
          publish dekopon-model
          publish dekopon-provider-sdk
          publish dekopon-provider-host
          publish dekopon-protocol
          publish dekopon-config
          publish dekopon-run
          cargo publish --locked -p dekopon
