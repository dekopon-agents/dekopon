name: WIT package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wit-package.yml"
      - "crates/dekopon-provider-host/wit/**"
      - "crates/dekopon-provider-http/src/**"
      - "crates/dekopon-provider-http/wit/**"
      - "crates/dekopon-provider-sdk/src/**"
      - "crates/dekopon-provider-sdk/wit/**"
      - "crates/dekopon-provider-storage/**"
      - "crates/dekopon-broker-host/wit/**"
      - "examples/providers/echo/**"
      - "examples/providers/echo-provider.wasm"
      - "examples/providers/memory-chat/**"
      - "examples/providers/memory-chat-provider.wasm"
      - "examples/providers/memory-reservation-probe/**"
      - "examples/providers/memory-reservation-probe-provider.wasm"
      - "examples/providers/provider-v0-1-compat/**"
      - "examples/providers/provider-v0-1-compat-provider.wasm"
      - "examples/providers/storage-probe/**"
      - "examples/providers/storage-probe-provider.wasm"
      - "examples/providers/http-probe/**"
      - "examples/providers/http-probe-provider.wasm"
      - "examples/providers/jsonplaceholder/**"
      - "examples/providers/jsonplaceholder-provider.wasm"
      - "examples/providers/skylight-private/**"
      - "examples/providers/skylight-private-provider.wasm"
      - "wit/**"
      - "wkg.toml"
      - "wkg.lock"
      - "wkg/**"
  pull_request:
    paths:
      - ".github/workflows/wit-package.yml"
      - "crates/dekopon-provider-host/wit/**"
      - "crates/dekopon-provider-http/src/**"
      - "crates/dekopon-provider-http/wit/**"
      - "crates/dekopon-provider-sdk/src/**"
      - "crates/dekopon-provider-sdk/wit/**"
      - "crates/dekopon-provider-storage/**"
      - "crates/dekopon-broker-host/wit/**"
      - "examples/providers/echo/**"
      - "examples/providers/echo-provider.wasm"
      - "examples/providers/memory-chat/**"
      - "examples/providers/memory-chat-provider.wasm"
      - "examples/providers/memory-reservation-probe/**"
      - "examples/providers/memory-reservation-probe-provider.wasm"
      - "examples/providers/provider-v0-1-compat/**"
      - "examples/providers/provider-v0-1-compat-provider.wasm"
      - "examples/providers/storage-probe/**"
      - "examples/providers/storage-probe-provider.wasm"
      - "examples/providers/http-probe/**"
      - "examples/providers/http-probe-provider.wasm"
      - "examples/providers/jsonplaceholder/**"
      - "examples/providers/jsonplaceholder-provider.wasm"
      - "examples/providers/skylight-private/**"
      - "examples/providers/skylight-private-provider.wasm"
      - "wit/**"
      - "wkg.toml"
      - "wkg.lock"
      - "wkg/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wit-package-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.89.0
  WKG_VERSION: 0.16.0
  WKG_SHA256: 8ab0f7138e1a84616cb0c87c2bd7b7d00a356b63d458be92bad3fbd463aa3e2a
  WASM_TOOLS_VERSION: 1.236.1
  WASM_TOOLS_SHA256: 2ea92231826976cb001c6c6d8708ff54e1ef1ea7229968a75a2119ff26c4cd6f
  PROVIDER_RUST_TOOLCHAIN: 1.97.0
  PROVIDER_WIT_PACKAGE: dekopon:provider@0.2.0
  HTTP_WIT_PACKAGE: dekopon:http@1.0.0
  STORAGE_WIT_PACKAGE: dekopon:storage@0.1.0

jobs:
  validate:
    name: build and verify
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust for provider regeneration
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Install pinned component tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/component-tools"
          mkdir -p "$tools/bin" "$tools/wasm-tools"

          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu" \
            --output "$tools/wkg"
          echo "${WKG_SHA256}  $tools/wkg" | sha256sum --check --strict
          install -m 0755 "$tools/wkg" "$tools/bin/wkg"

          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            --output "$tools/wasm-tools.tar.gz"
          echo "${WASM_TOOLS_SHA256}  $tools/wasm-tools.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools/wasm-tools.tar.gz" \
            --directory "$tools/wasm-tools" --strip-components 1
          install -m 0755 "$tools/wasm-tools/wasm-tools" "$tools/bin/wasm-tools"

          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Deterministically rebuild and inspect every generated provider component
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup override set "$PROVIDER_RUST_TOOLCHAIN"
          mkdir -p "$RUNNER_TEMP/checked-components" target/wit-package/provider-inspection
          # Derived from the tree, never a list: a provider added without touching this workflow
          # still has its checked-in component rebuilt and compared.
          shopt -s nullglob
          providers=()
          for script in examples/providers/*/build.sh; do
            providers+=("$(basename "$(dirname "$script")")")
          done
          if [ ${#providers[@]} -eq 0 ]; then
            echo 'no provider workspaces matched examples/providers/*/build.sh' >&2
            exit 1
          fi
          # Every checked-in component must come from one of those workspaces, so a component whose
          # source was deleted cannot survive as an unrebuilt binary.
          expected=$(printf 'examples/providers/%s-provider.wasm\n' "${providers[@]}" | sort)
          present=$(printf '%s\n' examples/providers/*-provider.wasm | sort)
          diff <(printf '%s\n' "$expected") <(printf '%s\n' "$present")
          for provider in "${providers[@]}"; do
            artifact="examples/providers/$provider-provider.wasm"
            cp "$artifact" "$RUNNER_TEMP/checked-components/$provider.wasm"
            "examples/providers/$provider/build.sh"
            cmp "$RUNNER_TEMP/checked-components/$provider.wasm" "$artifact"

            manifest="examples/providers/$provider/Cargo.toml"
            cargo tree --locked --manifest-path "$manifest" \
              --target wasm32-unknown-unknown --edges normal,build \
              > "target/wit-package/provider-inspection/$provider.tree"
            if grep -Eqi '(^|[[:space:]])(wasm-bindgen|js-sys|wasi)([[:space:]]|$)' \
              "target/wit-package/provider-inspection/$provider.tree"; then
              echo "forbidden ambient dependency in $provider" >&2
              exit 1
            fi

            core=$(find "examples/providers/$provider/target/wasm32-unknown-unknown/release" \
              -maxdepth 1 -type f -name '*.wasm' -print -quit)
            test -n "$core"
            wasm-tools metadata show "$core" \
              > "target/wit-package/provider-inspection/$provider.core-producers.txt"
            wasm-tools metadata show "$artifact" \
              > "target/wit-package/provider-inspection/$provider.component-producers.txt"
            grep -q 'Rust' "target/wit-package/provider-inspection/$provider.core-producers.txt"
            grep -q 'wit-bindgen-rust' \
              "target/wit-package/provider-inspection/$provider.component-producers.txt"
            wasm-tools print "$core" | grep '(import ' \
              > "target/wit-package/provider-inspection/$provider.core-imports.txt" || true

            expected=''
            case "$provider" in
              http-probe|jsonplaceholder|skylight-private) expected='dekopon:http/client@1.0.0' ;;
              memory-chat) expected='dekopon:storage/jsonl@0.1.0' ;;
              storage-probe) expected='dekopon:storage/durable-files@0.1.0' ;;
            esac
            imports="target/wit-package/provider-inspection/$provider.core-imports.txt"
            if [ -z "$expected" ]; then
              test ! -s "$imports"
            else
              test -s "$imports"
              if grep -Fv "$expected" "$imports"; then
                echo "unexpected core import in $provider" >&2
                exit 1
              fi
            fi
          done

      - name: Build the WIT packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wit-package "$RUNNER_TEMP/wkg-build-cache"
          cmp \
            crates/dekopon-provider-sdk/wit/provider.wit \
            crates/dekopon-provider-host/wit/provider.wit
          for mirror in \
            crates/dekopon-broker-host/wit/deps/provider.wit \
            examples/providers/http-probe/wit/deps/provider.wit \
            examples/providers/jsonplaceholder/wit/deps/provider.wit \
            examples/providers/skylight-private/wit/deps/provider.wit \
            examples/providers/memory-chat/wit/deps/provider.wit \
            examples/providers/memory-reservation-probe/wit/deps/provider.wit \
            examples/providers/storage-probe/wit/deps/provider.wit
          do
            cmp crates/dekopon-provider-sdk/wit/provider.wit "$mirror"
          done
          cmp \
            wit/http/http.wit \
            crates/dekopon-provider-http/wit/deps/http.wit
          for mirror in \
            crates/dekopon-broker-host/wit/deps/http.wit \
            examples/providers/http-probe/wit/deps/http.wit \
            examples/providers/jsonplaceholder/wit/deps/http.wit \
            examples/providers/skylight-private/wit/deps/http.wit
          do
            cmp wit/http/http.wit "$mirror"
          done
          for mirror in \
            crates/dekopon-provider-storage/wit/deps/storage.wit \
            crates/dekopon-broker-host/wit/deps/storage.wit \
            examples/providers/memory-chat/wit/deps/storage.wit \
            examples/providers/storage-probe/wit/deps/storage.wit
          do
            cmp wit/storage/storage.wit "$mirror"
          done
          wkg build \
            --wit-dir crates/dekopon-provider-sdk/wit \
            --output target/wit-package/dekopon-provider.wasm \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-build-cache"
          (
            cd wit/http
            wkg build \
              --wit-dir . \
              --output ../../target/wit-package/dekopon-http.wasm \
              --config ../../wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-build-cache"
          )
          (
            cd wit/storage
            wkg build \
              --wit-dir . \
              --output ../../target/wit-package/dekopon-storage.wasm \
              --config ../../wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-build-cache"
          )
          git diff --exit-code -- wkg.lock wit/http/wkg.lock wit/storage/wkg.lock

      - name: Verify provider exports and import-free boundary
        shell: bash
        run: |
          set -euo pipefail
          package=target/wit-package/dekopon-provider.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-provider.json
          jq --exit-status --arg package "$PROVIDER_WIT_PACKAGE" '
            (.packages | length == 1) and
            (.packages[0].name == $package) and
            (.packages[0].worlds == {"provider": 0, "provider-commands": 1}) and
            (.worlds | length == 2) and
            (.worlds[0].name == "provider") and
            ((.worlds[0].imports | keys) == []) and
            ((.worlds[0].exports | keys) == ["describe", "invoke"]) and
            (.worlds[0].exports.describe.function.params == []) and
            (.worlds[0].exports.describe.function.result == "string") and
            (.worlds[0].exports.invoke.function.params == [
              {"name": "capability", "type": "string"},
              {"name": "input-json", "type": "string"}
            ]) and
            (.worlds[0].exports.invoke.function.result == "string") and
            (.worlds[1].name == "provider-commands") and
            ((.worlds[1].imports | keys) == []) and
            ((.worlds[1].exports | keys) == ["describe", "invoke", "resolve-command"]) and
            (.worlds[1].exports."resolve-command".function.params == [
              {"name": "argv", "type": 0}
            ]) and
            (.types[0].kind == {"list": "string"}) and
            (.worlds[1].exports."resolve-command".function.result == "string")
          ' target/wit-package/dekopon-provider.json

      - name: Verify buffered HTTP interface
        shell: bash
        run: |
          set -euo pipefail
          package=target/wit-package/dekopon-http.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-http.json
          jq --exit-status --arg package "$HTTP_WIT_PACKAGE" '
            (.packages | length == 1) and
            (.packages[0].name == $package) and
            (.packages[0].interfaces == {"client": 0}) and
            (.packages[0].worlds == {}) and
            (.interfaces | length == 1) and
            (.interfaces[0].name == "client") and
            ((.interfaces[0].functions | keys) == ["send"]) and
            (.interfaces[0].functions.send.params == [
              {"name": "request", "type": 3}
            ]) and
            (.interfaces[0].functions.send.result == 7) and
            (.types[0].kind == {"list": "u8"}) and
            (.types[1].kind.record.fields == [
              {"name": "name", "type": "string"},
              {"name": "value", "type": 0}
            ]) and
            (.types[3].kind.record.fields | map({name, type}) == [
              {"name": "method", "type": "string"},
              {"name": "uri", "type": "string"},
              {"name": "headers", "type": 2},
              {"name": "body", "type": 0}
            ]) and
            (.types[4].kind.record.fields | map({name, type}) == [
              {"name": "status", "type": "u16"},
              {"name": "headers", "type": 2},
              {"name": "body", "type": 0}
            ]) and
            (.types[5].kind.enum.cases | map(.name) == [
              "invalid-method", "invalid-uri", "invalid-header", "request-too-large",
              "denied", "host-call-limit", "dns", "connect", "tls", "timeout",
              "protocol", "response-too-large", "internal"
            ]) and
            (.types[6].kind.record.fields == [
              {"name": "code", "type": 5},
              {"name": "message", "type": "string"}
            ]) and
            (.types[7].kind == {"result": {"ok": 4, "err": 6}}) and
            (.worlds == [])
          ' target/wit-package/dekopon-http.json

      - name: Verify namespace-bound storage interfaces
        shell: bash
        run: |
          set -euo pipefail
          package=target/wit-package/dekopon-storage.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-storage.json
          jq --exit-status --arg package "$STORAGE_WIT_PACKAGE" '
            def sigs: with_entries(.value |= {kind, params, result});
            def errors: [
              {"name":"not-found"}, {"name":"already-exists"},
              {"name":"invalid-name"}, {"name":"invalid-argument"},
              {"name":"permission-denied"}, {"name":"quota-exceeded"},
              {"name":"busy"}, {"name":"timeout"}, {"name":"unsupported"},
              {"name":"corrupt"}, {"name":"io"}
            ];
            (.packages == [{
              "name": $package,
              "interfaces": {"jsonl": 0, "durable-files": 1},
              "worlds": {}
            }]) and
            (.worlds == []) and
            (.interfaces | map({name, types, functions: (.functions | sigs), package}) == [
              {
                "name":"jsonl", "types":{"storage-error":0,"chunk":2}, "package":0,
                "functions": {
                  "size":{"kind":"freestanding","params":[{"name":"name","type":"string"}],"result":3},
                  "read-chunk":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"offset","type":"u64"},{"name":"max-bytes","type":"u32"}],"result":4},
                  "append":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"expected-size","type":"u64"},{"name":"record","type":1}],"result":3},
                  "replace":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"expected-size","type":"u64"},{"name":"contents","type":1}],"result":5}
                }
              },
              {
                "name":"durable-files",
                "types":{"open-flags":6,"durability":7,"lock-level":8,"storage-error":9,"file-stat":10,"file":11},
                "package":0,
                "functions": {
                  "[method]file.read-at":{"kind":{"method":11},"params":[{"name":"self","type":12},{"name":"offset","type":"u64"},{"name":"max-bytes","type":"u32"}],"result":14},
                  "[method]file.write-at":{"kind":{"method":11},"params":[{"name":"self","type":12},{"name":"offset","type":"u64"},{"name":"bytes","type":13}],"result":15},
                  "[method]file.size":{"kind":{"method":11},"params":[{"name":"self","type":12}],"result":16},
                  "[method]file.truncate":{"kind":{"method":11},"params":[{"name":"self","type":12},{"name":"size","type":"u64"}],"result":15},
                  "[method]file.sync":{"kind":{"method":11},"params":[{"name":"self","type":12},{"name":"mode","type":7}],"result":15},
                  "[method]file.lock":{"kind":{"method":11},"params":[{"name":"self","type":12},{"name":"level","type":8}],"result":15},
                  "[method]file.unlock":{"kind":{"method":11},"params":[{"name":"self","type":12},{"name":"to","type":8}],"result":15},
                  "[method]file.check-reserved-lock":{"kind":{"method":11},"params":[{"name":"self","type":12}],"result":17},
                  "open":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"flags","type":6}],"result":19},
                  "stat":{"kind":"freestanding","params":[{"name":"name","type":"string"}],"result":21},
                  "remove":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"mode","type":7}],"result":15},
                  "rename-atomic":{"kind":"freestanding","params":[{"name":"from","type":"string"},{"name":"to","type":"string"},{"name":"replace","type":"bool"},{"name":"mode","type":7}],"result":15},
                  "random-bytes":{"kind":"freestanding","params":[{"name":"length","type":"u32"}],"result":14},
                  "monotonic-time-ns":{"kind":"freestanding","params":[],"result":16},
                  "wall-time-ms":{"kind":"freestanding","params":[],"result":16}
                }
              }
            ]) and
            (.types | map({name, kind, owner}) == [
              {"name":"storage-error","kind":{"enum":{"cases":errors}},"owner":{"interface":0}},
              {"name":null,"kind":{"list":"u8"},"owner":null},
              {"name":"chunk","kind":{"record":{"fields":[{"name":"bytes","type":1},{"name":"next-offset","type":"u64"},{"name":"eof","type":"bool"}]}},"owner":{"interface":0}},
              {"name":null,"kind":{"result":{"ok":"u64","err":0}},"owner":null},
              {"name":null,"kind":{"result":{"ok":2,"err":0}},"owner":null},
              {"name":null,"kind":{"result":{"ok":null,"err":0}},"owner":null},
              {"name":"open-flags","kind":{"flags":{"flags":[{"name":"read"},{"name":"write"},{"name":"create"},{"name":"create-new"},{"name":"delete-on-close"}]}},"owner":{"interface":1}},
              {"name":"durability","kind":{"enum":{"cases":[{"name":"data"},{"name":"data-and-metadata"},{"name":"full"}]}},"owner":{"interface":1}},
              {"name":"lock-level","kind":{"enum":{"cases":[{"name":"none"},{"name":"shared"},{"name":"reserved"},{"name":"pending"},{"name":"exclusive"}]}},"owner":{"interface":1}},
              {"name":"storage-error","kind":{"enum":{"cases":errors}},"owner":{"interface":1}},
              {"name":"file-stat","kind":{"record":{"fields":[{"name":"size","type":"u64"},{"name":"identity","type":"u64"}]}},"owner":{"interface":1}},
              {"name":"file","kind":"resource","owner":{"interface":1}},
              {"name":null,"kind":{"handle":{"borrow":11}},"owner":null},
              {"name":null,"kind":{"list":"u8"},"owner":null},
              {"name":null,"kind":{"result":{"ok":13,"err":9}},"owner":null},
              {"name":null,"kind":{"result":{"ok":null,"err":9}},"owner":null},
              {"name":null,"kind":{"result":{"ok":"u64","err":9}},"owner":null},
              {"name":null,"kind":{"result":{"ok":"bool","err":9}},"owner":null},
              {"name":null,"kind":{"handle":{"own":11}},"owner":null},
              {"name":null,"kind":{"result":{"ok":18,"err":9}},"owner":null},
              {"name":null,"kind":{"option":10},"owner":null},
              {"name":null,"kind":{"result":{"ok":20,"err":9}},"owner":null}
            ])
          ' target/wit-package/dekopon-storage.json

      - name: Verify the storage facade default feature set imports nothing
        shell: bash
        run: |
          set -euo pipefail
          component=examples/providers/echo-provider.wasm
          description=target/wit-package/echo-default-storage.json
          grep -q 'name = "dekopon-provider-storage"' examples/providers/echo/Cargo.lock
          wasm-tools validate "$component"
          wasm-tools component wit --json "$component" > "$description"
          jq --exit-status '
            (.packages | map(.name) == ["root:component"]) and
            (.worlds | length == 1) and
            (.worlds[0].name == "root") and
            (.worlds[0].imports == {}) and
            ((.worlds[0].exports | keys) == ["describe", "invoke"])
          ' "$description"

      - name: Verify the historical provider 0.1 compatibility component
        shell: bash
        run: |
          set -euo pipefail
          component=examples/providers/provider-v0-1-compat-provider.wasm
          description=target/wit-package/provider-v0-1-compat.json
          grep -Fxq 'package dekopon:provider@0.1.0;' \
            examples/providers/provider-v0-1-compat/wit/deps/provider.wit
          grep -Fq 'include dekopon:provider/provider@0.1.0;' \
            examples/providers/provider-v0-1-compat/wit/provider.wit
          if grep -Rq 'dekopon:provider@0.2.0' \
            examples/providers/provider-v0-1-compat/wit; then
            echo "historical fixture was regenerated against the current provider package" >&2
            exit 1
          fi
          wasm-tools validate "$component"
          wasm-tools component wit --json "$component" > "$description"
          jq --exit-status '
            (.packages | map(.name) == ["root:component"]) and
            (.worlds | length == 1) and
            (.worlds[0].imports == {}) and
            ((.worlds[0].exports | keys) == ["describe", "invoke"])
          ' "$description"

      - name: Verify the malicious memory reservation fixture is import-free
        shell: bash
        run: |
          set -euo pipefail
          component=examples/providers/memory-reservation-probe-provider.wasm
          description=target/wit-package/memory-reservation-probe.json
          wasm-tools validate "$component"
          wasm-tools component wit --json "$component" > "$description"
          jq --exit-status '
            (.packages | map(.name) == ["root:component"]) and
            (.worlds | length == 1) and
            (.worlds[0].imports == {}) and
            ((.worlds[0].exports | keys) == ["describe", "invoke", "resolve-command"])
          ' "$description"

      - name: Verify storage-importing provider fixtures
        shell: bash
        run: |
          set -euo pipefail
          for name in memory-chat storage-probe; do
            component="examples/providers/$name-provider.wasm"
            description="target/wit-package/$name.json"
            wasm-tools validate "$component"
            wasm-tools component wit --json "$component" > "$description"
            expected=jsonl
            expected_exports='["describe", "invoke", "resolve-command"]'
            if [ "$name" = storage-probe ]; then
              expected=durable-files
            fi
            jq --exit-status --arg interface "$expected" --argjson exports "$expected_exports" '
              (.packages | map(.name) == ["dekopon:storage@0.1.0", "root:component"]) and
              (.worlds | length == 1) and
              (.worlds[0].name == "root") and
              (.worlds[0].imports == {"interface-0": {"interface": {"id": 0}}}) and
              ((.worlds[0].exports | keys) == $exports) and
              (.interfaces | length == 1) and
              (.interfaces[0].name == $interface)
            ' "$description"
            if grep -Eqi 'wasi:|wasm-bindgen|js-sys' "$description"; then
              echo "forbidden ambient import in $component" >&2
              exit 1
            fi
          done

      - name: Verify HTTP-importing provider fixtures
        shell: bash
        run: |
          set -euo pipefail
          for name in http-probe jsonplaceholder skylight-private; do
            component="examples/providers/$name-provider.wasm"
            description="target/wit-package/$name.json"
            wasm-tools validate "$component"
            wasm-tools component wit --json "$component" > "$description"
            jq --exit-status '
              (.packages | map(.name) == ["dekopon:http@1.0.0", "root:component"]) and
              (.worlds | length == 1) and
              (.worlds[0].name == "root") and
              (.worlds[0].imports == {"interface-0": {"interface": {"id": 0}}}) and
              ((.worlds[0].exports | keys) == ["describe", "invoke"]) and
              (.interfaces | length == 1) and
              (.interfaces[0].name == "client") and
              ((.interfaces[0].functions | keys) == ["send"])
            ' "$description"
          done

      - name: Exercise local wkg publish and fetch
        shell: bash
        run: |
          set -euo pipefail
          registry="$RUNNER_TEMP/wkg-local-registry"
          mkdir -p "$registry/packages"
          cat > "$registry/config.toml" <<EOF
          [namespace_registries]
          dekopon = "local.test"

          [registry."local.test".local]
          root = "$registry/packages"
          EOF
          for artifact in dekopon-provider dekopon-http dekopon-storage; do
            wkg publish \
              --config "$registry/config.toml" \
              --cache "$registry/publish-cache" \
              "target/wit-package/$artifact.wasm"
          done
          wkg get \
            --config "$registry/config.toml" \
            --cache "$registry/fetch-cache" \
            --output "$registry/fetched-provider.wasm" \
            "$PROVIDER_WIT_PACKAGE"
          wkg get \
            --config "$registry/config.toml" \
            --cache "$registry/fetch-cache" \
            --output "$registry/fetched-http.wasm" \
            "$HTTP_WIT_PACKAGE"
          wkg get \
            --config "$registry/config.toml" \
            --cache "$registry/fetch-cache" \
            --output "$registry/fetched-storage.wasm" \
            "$STORAGE_WIT_PACKAGE"
          cmp target/wit-package/dekopon-provider.wasm "$registry/fetched-provider.wasm"
          cmp target/wit-package/dekopon-http.wasm "$registry/fetched-http.wasm"
          cmp target/wit-package/dekopon-storage.wasm "$registry/fetched-storage.wasm"

      - name: Upload the verified packages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dekopon-wit-packages
          path: |
            target/wit-package/dekopon-provider.wasm
            target/wit-package/dekopon-http.wasm
            target/wit-package/dekopon-storage.wasm
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out registry configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dekopon-wit-packages
          path: target/wit-package

      - name: Install pinned wkg
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/component-tools"
          mkdir -p "$tools/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu" \
            --output "$tools/wkg"
          echo "${WKG_SHA256}  $tools/wkg" | sha256sum --check --strict
          install -m 0755 "$tools/wkg" "$tools/bin/wkg"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish the WIT packages
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dekopon-provider dekopon-http dekopon-storage; do
            wkg publish \
              --skip-dupes \
              --config wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-publish-cache" \
              "target/wit-package/$artifact.wasm"
          done

      - name: Verify the published packages
        shell: bash
        run: |
          set -euo pipefail
          wkg get \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-verify-cache" \
            --output "$RUNNER_TEMP/published-provider.wasm" \
            "$PROVIDER_WIT_PACKAGE"
          wkg get \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-verify-cache" \
            --output "$RUNNER_TEMP/published-http.wasm" \
            "$HTTP_WIT_PACKAGE"
          wkg get \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-verify-cache" \
            --output "$RUNNER_TEMP/published-storage.wasm" \
            "$STORAGE_WIT_PACKAGE"
          cmp target/wit-package/dekopon-provider.wasm "$RUNNER_TEMP/published-provider.wasm"
          cmp target/wit-package/dekopon-http.wasm "$RUNNER_TEMP/published-http.wasm"
          cmp target/wit-package/dekopon-storage.wasm "$RUNNER_TEMP/published-storage.wasm"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
