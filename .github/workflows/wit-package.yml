name: WIT package

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/wit-package.yml"
      - "ci/fetch-external-provider-components.sh"
      - "ci/toolchain.env"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**"
      - "examples/providers/**"
      - "wit/**"
      - "wkg.toml"
      - "wkg.lock"
      - "wkg/**"
  pull_request:
    paths:
      - ".github/workflows/wit-package.yml"
      - "ci/fetch-external-provider-components.sh"
      - "ci/toolchain.env"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "crates/**"
      - "examples/providers/**"
      - "wit/**"
      - "wkg.toml"
      - "wkg.lock"
      - "wkg/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wit-package-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVIDER_WIT_PACKAGE: dekopon:provider@0.4.0
  STDIO_WIT_PACKAGE: dekopon:stdio@0.1.0
  HTTP_WIT_PACKAGE: dekopon:http@1.2.0
  STORAGE_WIT_PACKAGE: dekopon:storage@0.1.1
  CLOCK_WIT_PACKAGE: dekopon:clock@1.1.0
  RANDOM_WIT_PACKAGE: dekopon:random@0.1.0

jobs:
  validate:
    name: build and verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned component tools
        shell: bash
        run: |
          set -euo pipefail
          source ci/toolchain.env
          tools="$RUNNER_TEMP/component-tools"
          mkdir -p "$tools/bin" "$tools/wasm-tools"

          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu" \
            --output "$tools/wkg"
          echo "${WKG_SHA256}  $tools/wkg" | sha256sum --check --strict
          install -m 0755 "$tools/wkg" "$tools/bin/wkg"

          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            --output "$tools/wasm-tools.tar.gz"
          echo "${WASM_TOOLS_SHA256}  $tools/wasm-tools.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools/wasm-tools.tar.gz" \
            --directory "$tools/wasm-tools" --strip-components 1
          install -m 0755 "$tools/wasm-tools/wasm-tools" "$tools/bin/wasm-tools"

          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Deterministically rebuild and inspect every generated provider component
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          mkdir -p "$RUNNER_TEMP/checked-components" target/wit-package/provider-inspection
          # Derived from the tree, never a list: a provider added without touching this workflow
          # still has its repository-owned checked component rebuilt and compared.
          shopt -s nullglob
          providers=()
          for script in examples/providers/*/build.sh; do
            providers+=("$(basename "$(dirname "$script")")")
          done
          if [ ${#providers[@]} -eq 0 ]; then
            echo 'no provider workspaces matched examples/providers/*/build.sh' >&2
            exit 1
          fi
          # Every repository-owned checked component must come from one of those workspaces, so a component whose
          # source was deleted cannot survive as an unrebuilt binary.
          expected=$(printf 'examples/providers/%s-provider.wasm\n' "${providers[@]}" | sort)
          present=$(git ls-files 'examples/providers/*-provider.wasm' | sort)
          diff <(printf '%s\n' "$expected") <(printf '%s\n' "$present")
          for provider in "${providers[@]}"; do
            artifact="examples/providers/$provider-provider.wasm"
            cp "$artifact" "$RUNNER_TEMP/checked-components/$provider.wasm"
            "examples/providers/$provider/build.sh"
            cmp "$RUNNER_TEMP/checked-components/$provider.wasm" "$artifact"
            wasm-tools validate "$artifact"
            wasm-tools component wit --json "$artifact" > "target/wit-package/provider-inspection/$provider.json"
            jq --exit-status '
              ([.packages[].name] | index("dekopon:stdio@0.1.0") != null) and
              ([.interfaces[].name] | index("streams") != null) and
              (.worlds | length == 1) and
              ((.worlds[0].exports | keys) == ["describe", "invoke", "run-command"]) and
              (.worlds[0].exports."run-command".function.params[1] == {"name":"stdin-piped","type":"bool"}) and
              (.types[.worlds[0].exports.invoke.function.result].kind.result == {"ok":null,"err":"u8"})
            ' "target/wit-package/provider-inspection/$provider.json"

            manifest="examples/providers/$provider/Cargo.toml"
            cargo tree --locked --manifest-path "$manifest" \
              --target wasm32-unknown-unknown --edges normal,build \
              > "target/wit-package/provider-inspection/$provider.tree"
            if grep -Eqi '(^|[[:space:]])(wasm-bindgen|js-sys|wasi)([[:space:]]|$)' \
              "target/wit-package/provider-inspection/$provider.tree"; then
              echo "forbidden ambient dependency in $provider" >&2
              exit 1
            fi

            core=$(find "examples/providers/$provider/target/wasm32-unknown-unknown/release" \
              -maxdepth 1 -type f -name '*.wasm' -print -quit)
            test -n "$core"
            wasm-tools metadata show "$core" \
              > "target/wit-package/provider-inspection/$provider.core-producers.txt"
            wasm-tools metadata show "$artifact" \
              > "target/wit-package/provider-inspection/$provider.component-producers.txt"
            grep -q 'Rust' "target/wit-package/provider-inspection/$provider.core-producers.txt"
            grep -q 'wit-bindgen-rust' \
              "target/wit-package/provider-inspection/$provider.component-producers.txt"
            wasm-tools print "$core" | grep '(import ' \
              > "target/wit-package/provider-inspection/$provider.core-imports.txt" || true

            expected='dekopon:stdio/streams@0.1.0'
            case "$provider" in
              clock-probe|clock-raw-probe) expected+=$'\ndekopon:clock/wall@1.1.0' ;;
              http-probe|http-raw-probe) expected+=$'\ndekopon:asset/asset@0.1.0\ndekopon:http/client@1.2.0' ;;
              storage-probe) expected+=$'\ndekopon:storage/durable-files@0.1.1' ;;
            esac
            imports="target/wit-package/provider-inspection/$provider.core-imports.txt"
            test -s "$imports"
            while IFS= read -r line; do
              name=${line#*\"}
              name=${name%%\"*}
              if ! grep -Fxq "$name" <<< "$expected"; then
                echo "unexpected core import in $provider: $name" >&2
                exit 1
              fi
            done < "$imports"
            while IFS= read -r name; do
              grep -Fq "\"$name\"" "$imports"
            done <<< "$expected"
          done

      - name: Fetch exact attested standalone provider fixtures
        env:
          DEKOPON_VERIFY_PROVIDER_ATTESTATIONS: "1"
          GH_TOKEN: ${{ github.token }}
        run: ci/fetch-external-provider-components.sh examples/providers

      - name: Build the WIT packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wit-package "$RUNNER_TEMP/wkg-build-cache"
          for mirror in \
            crates/dekopon-broker-host/wit/deps/provider.wit \
            examples/providers/cli-probe/wit/deps/provider.wit \
            examples/providers/clock-probe/wit/deps/provider.wit \
            examples/providers/clock-raw-probe/wit/deps/provider.wit \
            examples/providers/http-probe/wit/deps/provider.wit \
            examples/providers/http-raw-probe/wit/deps/provider.wit \
            examples/providers/memory-reservation-probe/wit/deps/provider.wit \
            examples/providers/storage-probe/wit/deps/provider.wit
          do
            cmp crates/dekopon-provider-sdk/wit/provider.wit "$mirror"
          done
          for mirror in \
            wit/http/deps/asset.wit \
            crates/dekopon-provider-sdk/wit/deps/asset.wit \
            crates/dekopon-broker-host/wit/deps/asset.wit \
            examples/providers/http-probe/wit/deps/asset.wit \
            examples/providers/http-raw-probe/wit/deps/asset.wit
          do
            cmp wit/asset/asset.wit "$mirror"
          done
          for mirror in \
            crates/dekopon-broker-host/wit/deps/http.wit \
            examples/providers/http-probe/wit/deps/http.wit \
            examples/providers/http-raw-probe/wit/deps/http.wit
          do
            cmp wit/http/http.wit "$mirror"
          done
          for mirror in \
            crates/dekopon-broker-host/wit/deps/clock.wit \
            crates/dekopon-provider-sdk/wit/deps/clock.wit \
            examples/providers/clock-probe/wit/deps/clock.wit \
            examples/providers/clock-raw-probe/wit/deps/clock.wit
          do
            cmp wit/clock/clock.wit "$mirror"
          done
          for mirror in \
            crates/dekopon-broker-host/wit/deps/random.wit \
            crates/dekopon-provider-sdk/wit/deps/random.wit
          do
            cmp wit/random/random.wit "$mirror"
          done
          for mirror in \
            crates/dekopon-broker-host/wit/deps/storage.wit \
            examples/providers/storage-probe/wit/deps/storage.wit
          do
            cmp wit/storage/storage.wit "$mirror"
          done
          for mirror in \
            crates/dekopon-provider-sdk/wit/deps/stdio.wit \
            crates/dekopon-broker-host/wit/deps/stdio.wit \
            examples/providers/cli-probe/wit/deps/stdio.wit \
            examples/providers/clock-probe/wit/deps/stdio.wit \
            examples/providers/clock-raw-probe/wit/deps/stdio.wit \
            examples/providers/http-probe/wit/deps/stdio.wit \
            examples/providers/http-raw-probe/wit/deps/stdio.wit \
            examples/providers/memory-reservation-probe/wit/deps/stdio.wit \
            examples/providers/storage-probe/wit/deps/stdio.wit
          do
            cmp wit/stdio/stdio.wit "$mirror"
          done
          # The SDK-local client worlds are not part of provider@0.4.0; wkg.toml resolves stdio locally.
          mkdir -p "$RUNNER_TEMP/provider-publication"
          cp crates/dekopon-provider-sdk/wit/provider.wit "$RUNNER_TEMP/provider-publication/provider.wit"
          wkg build \
            --wit-dir "$RUNNER_TEMP/provider-publication" \
            --output target/wit-package/dekopon-provider.wasm \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-build-cache"
          (
            cd wit/http
            wkg build \
              --wit-dir . \
              --output ../../target/wit-package/dekopon-http.wasm \
              --config ../../wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-build-cache"
          )
          (
            cd wit/storage
            wkg build \
              --wit-dir . \
              --output ../../target/wit-package/dekopon-storage.wasm \
              --config ../../wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-build-cache"
          )
          (
            cd wit/clock
            wkg build \
              --wit-dir . \
              --output ../../target/wit-package/dekopon-clock.wasm \
              --config ../../wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-build-cache"
          )
          (
            cd wit/random
            wkg build \
              --wit-dir . \
              --output ../../target/wit-package/dekopon-random.wasm \
              --config ../../wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-build-cache"
          )
          git diff --exit-code -- wkg.lock wit/http/wkg.lock wit/storage/wkg.lock wit/clock/wkg.lock wit/random/wkg.lock

      - name: Verify provider exports and the stdio import
        shell: bash
        run: |
          set -euo pipefail
          package=target/wit-package/dekopon-provider.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-provider.json
          jq --exit-status --arg package "$PROVIDER_WIT_PACKAGE" --arg stdio "$STDIO_WIT_PACKAGE" '
          . as $doc |
          def kind($t): if ($t | type) == "number" then $doc.types[$t].kind else $t end;
          (.packages == [
            {"name": $stdio, "interfaces": {"streams": 0}, "worlds": {}},
            {"name": $package, "interfaces": {}, "worlds": {"provider": 0, "provider-cli": 1}}
          ]) and
          (.interfaces | length == 1) and
          (.interfaces[0].name == "streams") and
          ((.interfaces[0].functions | keys) == [
            "[method]reader.read", "[method]writer.write", "stdin", "stdout", "write-stderr"
          ]) and
          (.worlds | length == 2) and
          all(.worlds[];
            (.imports == {"interface-0": {"interface": {"id": 0}}}) and
            (.exports.describe.function.params == []) and
            (.exports.describe.function.result == "string") and
            (.exports.invoke.function.params == [
              {"name": "capability", "type": "string"},
              {"name": "input-json", "type": "string"}
            ]) and
            (kind(.exports.invoke.function.result) == {"result": {"ok": null, "err": "u8"}})) and
          (.worlds[0].name == "provider") and
          ((.worlds[0].exports | keys) == ["describe", "invoke"]) and
          (.worlds[1].name == "provider-cli") and
          ((.worlds[1].exports | keys) == ["describe", "invoke", "run-command"]) and
          (.worlds[1].exports."run-command".function.params | length == 2) and
          (.worlds[1].exports."run-command".function.params[0].name == "argv") and
          (kind(.worlds[1].exports."run-command".function.params[0].type) == {"list": "string"}) and
          (.worlds[1].exports."run-command".function.params[1] == {"name": "stdin-piped", "type": "bool"}) and
          (.worlds[1].exports."run-command".function.result == "string")
          ' target/wit-package/dekopon-provider.json

      - name: Verify buffered and streamed HTTP interfaces
        shell: bash
        run: |
          set -euo pipefail
          package=target/wit-package/dekopon-http.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-http.json
          jq --exit-status --arg package "$HTTP_WIT_PACKAGE" '
            (.packages == [
              {"name": "dekopon:asset@0.1.0", "interfaces": {"asset": 0}, "worlds": {}},
              {"name": "dekopon:stdio@0.1.0", "interfaces": {"streams": 1}, "worlds": {}},
              {"name": $package, "interfaces": {"client": 2}, "worlds": {}}
            ]) and
            (.interfaces | length == 3) and
            (.interfaces[0].name == "asset") and
            (.interfaces[1].name == "streams") and
            (.interfaces[2].name == "client") and
            ((.interfaces[2].functions | keys) == ["open", "send", "splice", "stream"]) and
            (.interfaces[2].functions.send.params == [{"name": "request", "type": 17}]) and
            (.interfaces[2].functions.send.result == 31) and
            (.types[14].kind == {"list": "u8"}) and
            (.types[15].kind.record.fields | map({name, type}) == [
              {"name": "name", "type": "string"}, {"name": "value", "type": 14}
            ]) and
            (.types[16].kind == {"list": 15}) and
            (.types[17].kind.record.fields | map({name, type}) == [
              {"name": "method", "type": "string"}, {"name": "uri", "type": "string"},
              {"name": "headers", "type": 16}, {"name": "body", "type": 14}
            ]) and
            (.types[18].kind.record.fields | map({name, type}) == [
              {"name": "status", "type": "u16"},
              {"name": "headers", "type": 16}, {"name": "body", "type": 14}
            ]) and
            (.types[19].kind.enum.cases | map(.name) == [
              "invalid-method", "invalid-uri", "invalid-header", "request-too-large",
              "denied", "host-call-limit", "dns", "connect", "tls", "timeout",
              "protocol", "response-too-large", "internal"
            ]) and
            (.types[20].kind.record.fields == [
              {"name": "code", "type": 19}, {"name": "message", "type": "string"}
            ]) and
            (.types[31].kind == {"result": {"ok": 18, "err": 20}}) and
            (.types[10].kind == {"type": 5}) and
            (.types[5].kind == "resource") and
            (.types[11].kind == {"type": 0}) and
            (.types[0].kind.enum.cases | map(.name) == ["identity", "base64"]) and
            (.types[21].kind == {"handle": {"borrow": 10}}) and
            (.types[22].kind.record.fields | map({name, type}) == [
              {"name": "handle", "type": 21}, {"name": "encoding", "type": 11}
            ]) and
            (.types[23].kind.variant.cases | map({name, type}) == [
              {"name": "literal", "type": 14}, {"name": "asset", "type": 22}
            ]) and
            (.types[24].kind == {"list": 23}) and
            (.types[25].kind.record.fields | map({name, type}) == [
              {"name": "method", "type": "string"}, {"name": "uri", "type": "string"},
              {"name": "headers", "type": 16}, {"name": "body", "type": 24}
            ]) and
            (.types[26].kind == {"handle": {"own": 10}}) and
            (.types[27].kind.record.fields | map({name, type}) == [
              {"name": "status", "type": "u16"},
              {"name": "headers", "type": 16}, {"name": "body", "type": 26}
            ]) and
            (.interfaces[2].functions.stream.params == [{"name": "request", "type": 25}]) and
            (.interfaces[2].functions.stream.result == 32) and
            (.types[32].kind == {"result": {"ok": 27, "err": 20}}) and
            (.interfaces[2].functions.open.params == [{"name": "request", "type": 17}]) and
            (.interfaces[2].functions.open.result == 33) and
            (.types[28].kind == {"handle": {"own": 12}}) and
            (.types[29].kind.record.fields | map({name, type}) == [
              {"name": "status", "type": "u16"},
              {"name": "headers", "type": 16}, {"name": "body", "type": 28}
            ]) and
            (.types[33].kind == {"result": {"ok": 29, "err": 20}}) and
            (.interfaces[2].functions.splice.params == [
              {"name": "source", "type": 28}, {"name": "sink", "type": 34}
            ]) and
            (.interfaces[2].functions.splice.result == 35) and
            (.types[34].kind == {"handle": {"borrow": 13}}) and
            (.types[30].kind.variant.cases | map({name, type}) == [
              {"name": "closed", "type": null}, {"name": "failed", "type": 20}
            ]) and
            (.types[35].kind == {"result": {"ok": "u64", "err": 30}}) and
            (.types | length == 36) and
            (.worlds == [])
          ' target/wit-package/dekopon-http.json

      - name: Verify namespace-bound storage interfaces
        shell: bash
        run: |
          set -euo pipefail
          package=target/wit-package/dekopon-storage.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-storage.json
          jq --exit-status --arg package "$STORAGE_WIT_PACKAGE" '
            def sigs: with_entries(.value |= {kind, params, result});
            def errors: [
              {"name":"not-found"}, {"name":"already-exists"},
              {"name":"invalid-name"}, {"name":"invalid-argument"},
              {"name":"permission-denied"}, {"name":"quota-exceeded"},
              {"name":"busy"}, {"name":"timeout"}, {"name":"unsupported"},
              {"name":"corrupt"}, {"name":"io"}
            ];
            (.packages == [{
              "name": $package,
              "interfaces": {"jsonl": 0, "durable-files": 1},
              "worlds": {}
            }]) and
            (.worlds == []) and
            (.interfaces | map({name, types, functions: (.functions | sigs), package}) == [
              {
                "name":"jsonl", "types":{"storage-error":0,"chunk":2}, "package":0,
                "functions": {
                  "size":{"kind":"freestanding","params":[{"name":"name","type":"string"}],"result":3},
                  "read-chunk":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"offset","type":"u64"},{"name":"max-bytes","type":"u32"}],"result":4},
                  "append":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"expected-size","type":"u64"},{"name":"record","type":1}],"result":3},
                  "replace":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"expected-size","type":"u64"},{"name":"contents","type":1}],"result":5}
                }
              },
              {
                "name":"durable-files",
                "types":{"open-flags":6,"durability":7,"storage-error":8,"file-stat":9,"file":10},
                "package":0,
                "functions": {
                  "[method]file.read-at":{"kind":{"method":10},"params":[{"name":"self","type":11},{"name":"offset","type":"u64"},{"name":"max-bytes","type":"u32"}],"result":13},
                  "[method]file.write-at":{"kind":{"method":10},"params":[{"name":"self","type":11},{"name":"offset","type":"u64"},{"name":"bytes","type":12}],"result":14},
                  "[method]file.size":{"kind":{"method":10},"params":[{"name":"self","type":11}],"result":15},
                  "[method]file.truncate":{"kind":{"method":10},"params":[{"name":"self","type":11},{"name":"size","type":"u64"}],"result":14},
                  "[method]file.sync":{"kind":{"method":10},"params":[{"name":"self","type":11},{"name":"mode","type":7}],"result":14},
                  "open":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"flags","type":6}],"result":17},
                  "stat":{"kind":"freestanding","params":[{"name":"name","type":"string"}],"result":19},
                  "remove":{"kind":"freestanding","params":[{"name":"name","type":"string"},{"name":"mode","type":7}],"result":14},
                  "rename-atomic":{"kind":"freestanding","params":[{"name":"from","type":"string"},{"name":"to","type":"string"},{"name":"replace","type":"bool"},{"name":"mode","type":7}],"result":14},
                  "random-bytes":{"kind":"freestanding","params":[{"name":"length","type":"u32"}],"result":13},
                  "monotonic-time-ns":{"kind":"freestanding","params":[],"result":15},
                  "wall-time-ms":{"kind":"freestanding","params":[],"result":15}
                }
              }
            ]) and
            (.types | map({name, kind, owner}) == [
              {"name":"storage-error","kind":{"enum":{"cases":errors}},"owner":{"interface":0}},
              {"name":null,"kind":{"list":"u8"},"owner":null},
              {"name":"chunk","kind":{"record":{"fields":[{"name":"bytes","type":1},{"name":"next-offset","type":"u64"},{"name":"eof","type":"bool"}]}},"owner":{"interface":0}},
              {"name":null,"kind":{"result":{"ok":"u64","err":0}},"owner":null},
              {"name":null,"kind":{"result":{"ok":2,"err":0}},"owner":null},
              {"name":null,"kind":{"result":{"ok":null,"err":0}},"owner":null},
              {"name":"open-flags","kind":{"flags":{"flags":[{"name":"read"},{"name":"write"},{"name":"create"},{"name":"create-new"},{"name":"delete-on-close"}]}},"owner":{"interface":1}},
              {"name":"durability","kind":{"enum":{"cases":[{"name":"data"},{"name":"data-and-metadata"},{"name":"full"}]}},"owner":{"interface":1}},
              {"name":"storage-error","kind":{"enum":{"cases":errors}},"owner":{"interface":1}},
              {"name":"file-stat","kind":{"record":{"fields":[{"name":"size","type":"u64"},{"name":"identity","type":"u64"}]}},"owner":{"interface":1}},
              {"name":"file","kind":"resource","owner":{"interface":1}},
              {"name":null,"kind":{"handle":{"borrow":10}},"owner":null},
              {"name":null,"kind":{"list":"u8"},"owner":null},
              {"name":null,"kind":{"result":{"ok":12,"err":8}},"owner":null},
              {"name":null,"kind":{"result":{"ok":null,"err":8}},"owner":null},
              {"name":null,"kind":{"result":{"ok":"u64","err":8}},"owner":null},
              {"name":null,"kind":{"handle":{"own":10}},"owner":null},
              {"name":null,"kind":{"result":{"ok":16,"err":8}},"owner":null},
              {"name":null,"kind":{"option":9},"owner":null},
              {"name":null,"kind":{"result":{"ok":18,"err":8}},"owner":null}
            ])
          ' target/wit-package/dekopon-storage.json

      - name: Verify the host clock and random interfaces
        shell: bash
        run: |
          set -euo pipefail
          package=target/wit-package/dekopon-clock.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-clock.json
          jq --exit-status --arg package "$CLOCK_WIT_PACKAGE" '
            (.packages == [{"name": $package, "interfaces": {"wall": 0, "monotonic": 1}, "worlds": {}}]) and
            (.worlds == []) and
            (.types == []) and
            ((.interfaces | map({name, functions: (.functions | with_entries(.value |= {kind, params, result}))})) == [
              {"name": "wall", "functions": {"now-unix-millis": {"kind": "freestanding", "params": [], "result": "u64"}}},
              {"name": "monotonic", "functions": {"now-nanos": {"kind": "freestanding", "params": [], "result": "u64"}}}
            ])
          ' target/wit-package/dekopon-clock.json
          package=target/wit-package/dekopon-random.wasm
          wasm-tools validate "$package"
          wasm-tools component wit --json "$package" > target/wit-package/dekopon-random.json
          jq --exit-status --arg package "$RANDOM_WIT_PACKAGE" '
            (.packages == [{"name": $package, "interfaces": {"source": 0}, "worlds": {}}]) and
            (.worlds == []) and
            (.types == [{"name": null, "kind": {"list": "u8"}, "owner": null}]) and
            ((.interfaces[0].functions | with_entries(.value |= {kind, params, result})) == {
              "get-random-bytes": {"kind": "freestanding", "params": [{"name": "length", "type": "u32"}], "result": 0}
            })
          ' target/wit-package/dekopon-random.json

      - name: Verify the command-line provider fixture imports only stdio
        shell: bash
        run: |
          set -euo pipefail
          component=examples/providers/cli-probe-provider.wasm
          description=target/wit-package/cli-probe.json
          grep -Fq 'include dekopon:provider/provider-cli@0.4.0;' \
            examples/providers/cli-probe/wit/provider.wit
          wasm-tools validate "$component"
          wasm-tools component wit --json "$component" > "$description"
          jq --exit-status '
            (.worlds | length == 1) and
            (.packages | map(.name) == ["dekopon:stdio@0.1.0", "root:component"]) and
            (.worlds[0].imports == {"interface-0":{"interface":{"id":0}}}) and
            ([.interfaces[].name] == ["streams"]) and
            ((.worlds[0].exports | keys) == ["describe", "invoke", "run-command"]) and
            (.worlds[0].exports."run-command".function.params | map(.name) == ["argv", "stdin-piped"]) and
            (.worlds[0].exports."run-command".function.params[1].type == "bool") and
            (.worlds[0].exports."run-command".function.result == "string") and
            (.types[.worlds[0].exports.invoke.function.result].kind.result == {"ok":null,"err":"u8"})
          ' "$description"

      - name: Verify the malicious memory reservation fixture imports only stdio
        shell: bash
        run: |
          set -euo pipefail
          component=examples/providers/memory-reservation-probe-provider.wasm
          description=target/wit-package/memory-reservation-probe.json
          grep -Fq 'include dekopon:provider/provider-cli@0.4.0;' \
            examples/providers/memory-reservation-probe/wit/provider.wit
          wasm-tools validate "$component"
          wasm-tools component wit --json "$component" > "$description"
          jq --exit-status '
            (.packages | map(.name) == ["dekopon:stdio@0.1.0", "root:component"]) and
            (.worlds | length == 1) and
            (.worlds[0].imports == {"interface-0":{"interface":{"id":0}}}) and
            ([.interfaces[].name] == ["streams"]) and
            ((.worlds[0].exports | keys) == ["describe", "invoke", "run-command"]) and
            (.worlds[0].exports."run-command".function.params[1].type == "bool") and
            (.types[.worlds[0].exports.invoke.function.result].kind.result == {"ok":null,"err":"u8"})
          ' "$description"

      - name: Verify storage-importing provider fixtures
        shell: bash
        run: |
          set -euo pipefail
          for name in memory-chat storage-probe; do
            component="examples/providers/$name-provider.wasm"
            description="target/wit-package/$name.json"
            wasm-tools validate "$component"
            wasm-tools component wit --json "$component" > "$description"
            expected=jsonl
            package=dekopon:storage@0.1.0
            if [ "$name" = storage-probe ]; then
              expected=durable-files
              package="$STORAGE_WIT_PACKAGE"
              jq --exit-status --arg interface "$expected" --arg package "$package" '
                (.packages | map(.name) == ["dekopon:stdio@0.1.0", $package, "root:component"]) and
                (.worlds | length == 1) and
                (.worlds[0].name == "root") and
                (.worlds[0].imports == {"interface-0":{"interface":{"id":0}}, "interface-1":{"interface":{"id":1}}}) and
                ([.interfaces[].name] == ["streams", $interface]) and
                ((.worlds[0].exports | keys) == ["describe", "invoke", "run-command"]) and
                (.worlds[0].exports."run-command".function.params[1].type == "bool") and
                (.types[.worlds[0].exports.invoke.function.result].kind.result == {"ok":null,"err":"u8"})
              ' "$description"
            else
              jq --exit-status --arg interface "$expected" --arg package "$package" '
                (.packages | map(.name) == [$package, "root:component"]) and
                (.worlds | length == 1) and
                (.worlds[0].name == "root") and
                (.worlds[0].imports == {"interface-0": {"interface": {"id": 0}}}) and
                ((.worlds[0].exports | keys) == ["describe", "invoke", "run-command"]) and
                (.interfaces | length == 1) and
                (.interfaces[0].name == $interface)
              ' "$description"
            fi
            if grep -Eqi 'wasi:|wasm-bindgen|js-sys' "$description"; then
              echo "forbidden ambient import in $component" >&2
              exit 1
            fi
          done

      - name: Verify HTTP-importing provider fixtures
        shell: bash
        run: |
          set -euo pipefail
          for name in http-probe jsonplaceholder; do
            component="examples/providers/$name-provider.wasm"
            description="target/wit-package/$name.json"
            wasm-tools validate "$component"
            wasm-tools component wit --json "$component" > "$description"
            # Both answer a command word (`httpprobe`, `placeholder`) through `run-command`.
            exports='["describe", "invoke", "run-command"]'
            if [ "$name" = http-probe ]; then
              jq --exit-status --argjson exports "$exports" '
                (.packages == [
                  {"name": "dekopon:stdio@0.1.0", "interfaces": {"streams": 0}, "worlds": {}},
                  {"name": "dekopon:asset@0.1.0", "interfaces": {"asset": 1}, "worlds": {}},
                  {"name": "dekopon:http@1.2.0", "interfaces": {"client": 2}, "worlds": {}},
                  {"name": "root:component", "interfaces": {}, "worlds": {"root": 0}}
                ]) and
                (.worlds | length == 1) and
                (.worlds[0].name == "root") and
                (.worlds[0].imports == {
                  "interface-0": {"interface": {"id": 0}},
                  "interface-1": {"interface": {"id": 1}},
                  "interface-2": {"interface": {"id": 2}}
                }) and
                ((.worlds[0].exports | keys) == $exports) and
                ([.interfaces[].name] == ["streams", "asset", "client"]) and
                ((.interfaces[1].functions | keys) == [
                  "[method]handle.read", "[method]writer.write", "allocate", "attach", "open", "send"
                ]) and
                ((.interfaces[2].functions | keys) == ["open", "send", "splice", "stream"]) and
                (.worlds[0].exports."run-command".function.params[1].type == "bool") and
                (.types[.worlds[0].exports.invoke.function.result].kind.result == {"ok":null,"err":"u8"})
              ' "$description"
            else
              # The unchanged standalone JSONPlaceholder release remains HTTP@1.0.0 coverage.
              jq --exit-status --argjson exports "$exports" '
              (.packages | map(.name) == ["dekopon:http@1.0.0", "root:component"]) and
              (.worlds | length == 1) and
              (.worlds[0].name == "root") and
              (.worlds[0].imports == {"interface-0": {"interface": {"id": 0}}}) and
              ((.worlds[0].exports | keys) == $exports) and
              (.interfaces | length == 1) and
              (.interfaces[0].name == "client") and
              ((.interfaces[0].functions | keys) == ["send"])
              ' "$description"
            fi
          done

      - name: Verify the clock-importing provider fixture
        shell: bash
        run: |
          set -euo pipefail
          component=examples/providers/clock-probe-provider.wasm
          description=target/wit-package/clock-probe.json
          grep -Fq 'include dekopon:provider/provider-cli@0.4.0;' \
            examples/providers/clock-probe/wit/provider.wit
          wasm-tools validate "$component"
          wasm-tools component wit --json "$component" > "$description"
          jq --exit-status '
            (.packages | map(.name) == ["dekopon:stdio@0.1.0", "dekopon:clock@1.1.0", "root:component"]) and
            (.worlds | length == 1) and
            (.worlds[0].name == "root") and
            (.worlds[0].imports == {"interface-0":{"interface":{"id":0}},"interface-1":{"interface":{"id":1}}}) and
            ((.worlds[0].exports | keys) == ["describe", "invoke", "run-command"]) and
            ([.interfaces[].name] == ["streams", "wall"]) and
            ((.interfaces[1].functions | keys) == ["now-unix-millis"]) and
            (.worlds[0].exports."run-command".function.params[1].type == "bool") and
            (.types[.worlds[0].exports.invoke.function.result].kind.result == {"ok":null,"err":"u8"})
          ' "$description"
          if grep -Eqi 'wasi:|wasm-bindgen|js-sys' "$description"; then
            echo "forbidden ambient import in $component" >&2
            exit 1
          fi

      - name: Exercise local wkg publish and fetch
        shell: bash
        run: |
          set -euo pipefail
          registry="$RUNNER_TEMP/wkg-local-registry"
          mkdir -p "$registry/packages"
          cat > "$registry/config.toml" <<EOF
          [namespace_registries]
          dekopon = "local.test"

          [registry."local.test".local]
          root = "$registry/packages"
          EOF
          for artifact in dekopon-provider dekopon-http dekopon-storage dekopon-clock dekopon-random; do
            wkg publish \
              --config "$registry/config.toml" \
              --cache "$registry/publish-cache" \
              "target/wit-package/$artifact.wasm"
          done
          wkg get \
            --config "$registry/config.toml" \
            --cache "$registry/fetch-cache" \
            --output "$registry/fetched-provider.wasm" \
            "$PROVIDER_WIT_PACKAGE"
          wkg get \
            --config "$registry/config.toml" \
            --cache "$registry/fetch-cache" \
            --output "$registry/fetched-http.wasm" \
            "$HTTP_WIT_PACKAGE"
          wkg get \
            --config "$registry/config.toml" \
            --cache "$registry/fetch-cache" \
            --output "$registry/fetched-storage.wasm" \
            "$STORAGE_WIT_PACKAGE"
          wkg get \
            --config "$registry/config.toml" \
            --cache "$registry/fetch-cache" \
            --output "$registry/fetched-clock.wasm" \
            "$CLOCK_WIT_PACKAGE"
          wkg get --config "$registry/config.toml" --cache "$registry/fetch-cache" --output "$registry/fetched-random.wasm" "$RANDOM_WIT_PACKAGE"
          cmp target/wit-package/dekopon-provider.wasm "$registry/fetched-provider.wasm"
          cmp target/wit-package/dekopon-http.wasm "$registry/fetched-http.wasm"
          cmp target/wit-package/dekopon-storage.wasm "$registry/fetched-storage.wasm"
          cmp target/wit-package/dekopon-clock.wasm "$registry/fetched-clock.wasm"
          cmp target/wit-package/dekopon-random.wasm "$registry/fetched-random.wasm"

      - name: Upload the verified packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dekopon-wit-packages
          path: |
            target/wit-package/dekopon-provider.wasm
            target/wit-package/dekopon-http.wasm
            target/wit-package/dekopon-storage.wasm
            target/wit-package/dekopon-clock.wasm
            target/wit-package/dekopon-random.wasm
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to GHCR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out registry configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dekopon-wit-packages
          path: target/wit-package

      - name: Install pinned wkg
        shell: bash
        run: |
          set -euo pipefail
          source ci/toolchain.env
          tools="$RUNNER_TEMP/component-tools"
          mkdir -p "$tools/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu" \
            --output "$tools/wkg"
          echo "${WKG_SHA256}  $tools/wkg" | sha256sum --check --strict
          install -m 0755 "$tools/wkg" "$tools/bin/wkg"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish the WIT packages
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dekopon-provider dekopon-http dekopon-storage dekopon-clock dekopon-random; do
            wkg publish \
              --skip-dupes \
              --config wkg/config.toml \
              --cache "$RUNNER_TEMP/wkg-publish-cache" \
              "target/wit-package/$artifact.wasm"
          done

      - name: Verify the published packages
        shell: bash
        run: |
          set -euo pipefail
          wkg get \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-verify-cache" \
            --output "$RUNNER_TEMP/published-provider.wasm" \
            "$PROVIDER_WIT_PACKAGE"
          wkg get \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-verify-cache" \
            --output "$RUNNER_TEMP/published-http.wasm" \
            "$HTTP_WIT_PACKAGE"
          wkg get \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-verify-cache" \
            --output "$RUNNER_TEMP/published-storage.wasm" \
            "$STORAGE_WIT_PACKAGE"
          wkg get \
            --config wkg/config.toml \
            --cache "$RUNNER_TEMP/wkg-verify-cache" \
            --output "$RUNNER_TEMP/published-clock.wasm" \
            "$CLOCK_WIT_PACKAGE"
          wkg get --config wkg/config.toml --cache "$RUNNER_TEMP/wkg-verify-cache" --output "$RUNNER_TEMP/published-random.wasm" "$RANDOM_WIT_PACKAGE"
          cmp target/wit-package/dekopon-provider.wasm "$RUNNER_TEMP/published-provider.wasm"
          cmp target/wit-package/dekopon-http.wasm "$RUNNER_TEMP/published-http.wasm"
          cmp target/wit-package/dekopon-storage.wasm "$RUNNER_TEMP/published-storage.wasm"
          cmp target/wit-package/dekopon-clock.wasm "$RUNNER_TEMP/published-clock.wasm"
          cmp target/wit-package/dekopon-random.wasm "$RUNNER_TEMP/published-random.wasm"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
