version: 2
updates:
  - package-ecosystem: cargo
    # Root only. The examples/providers/* workspaces build checked-in wasm fixtures that
    # wit-package.yml rebuilds and compares byte for byte, so a lockfile-only bump there can
    # never pass; they are bumped by hand alongside a fixture regen.
    directory: /
    groups:
      component-stack:
        patterns:
          - "wasmtime*"
          - "wit-bindgen*"
          - "wasm*"
          - "wit-parser"
          - "cranelift*"
      cargo:
        update-types:
          - minor
          - patch
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto

  # The Dockerfile's runtime base, pinned by tag and digest. It is the only image the container
  # build depends on; the binaries come from a published release. A bump to a different Debian
  # changes the glibc the release binaries must fit inside; see docs/container-image.md.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
