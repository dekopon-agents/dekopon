version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /examples/providers/cli-probe
      - /examples/providers/clock-probe
      - /examples/providers/http-probe
      - /examples/providers/memory-reservation-probe
      - /examples/providers/provider-v0-1-compat
      - /examples/providers/provider-v0-2-compat
      - /examples/providers/storage-probe
    groups:
      component-stack:
        patterns:
          - "wasmtime*"
          - "wit-bindgen*"
          - "wasm*"
          - "wit-parser"
          - "cranelift*"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto

  # The Dockerfile's runtime base, pinned by tag and digest. It is the only image the container
  # build depends on; the binaries come from a published release. A bump to a different Debian
  # changes the glibc the release binaries must fit inside; see docs/container-image.md.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
