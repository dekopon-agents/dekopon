[workspace]
members = [
    "crates/dekopon",
    "crates/dekopon-capability",
    "crates/dekopon-config",
    "crates/dekopon-core",
    "crates/dekopon-protocol",
    "crates/dekopon-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/dekopon"
homepage = "https://github.com/dekopon-agents/dekopon"
authors = ["Dekopon contributors"]

[workspace.dependencies]
clap = { version = "4.6.4", features = ["derive"] }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
tempfile = "3.27.0"
thiserror = "2.0.19"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

dekopon-capability = { version = "0.1.0", path = "crates/dekopon-capability" }
dekopon-config = { version = "0.1.0", path = "crates/dekopon-config" }
dekopon-core = { version = "0.1.0", path = "crates/dekopon-core" }
dekopon-protocol = { version = "0.1.0", path = "crates/dekopon-protocol" }
dekopon-testkit = { version = "0.1.0", path = "crates/dekopon-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
