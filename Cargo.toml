[workspace]
members = [
    "crates/dekopon",
    "crates/dekopon-agent",
    "crates/dekopon-broker",
    "crates/dekopon-broker-host",
    "crates/dekopon-broker-protocol",
    "crates/dekopon-brokerd",
    "crates/dekopon-capability",
    "crates/dekopon-config",
    "crates/dekopon-core",
    "crates/dekopon-model",
    "crates/dekopon-http-host",
    "crates/dekopon-policy",
    "crates/dekopon-provider-host",
    "crates/dekopon-provider-http",
    "crates/dekopon-provider-sdk",
    "crates/dekopon-provider-storage",
    "crates/dekopon-protocol",
    "crates/dekopon-run",
    "crates/dekopon-shell",
    "crates/dekopon-storage-host",
    "crates/dekopon-telemetry",
    "crates/dekopon-testkit",
    "crates/dekopon-webui",
    "crates/dekopond",
]
exclude = ["examples/providers/echo"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/dekopon"
homepage = "https://github.com/dekopon-agents/dekopon"
authors = ["Dekopon contributors"]

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
cedar-policy = { version = "4.12.0", default-features = false }
clap = { version = "4.6.4", features = ["derive", "env"] }
fs2 = "0.4.3"
getrandom = "0.4.3"
futures-util = "0.3.31"
hmac = "0.13.0"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["service", "tokio"] }
jaq-core = "3.1.0"
jaq-json = "2.0.1"
jaq-std = { version = "3.0.1", default-features = false, features = ["format", "log", "math", "regex", "std", "time"] }
libc = "0.2.189"
opentelemetry = { version = "0.32.0", default-features = false, features = ["logs", "trace"] }
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "http-proto", "logs", "trace"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["logs", "trace"] }
reqwest ={ version = "0.12.28", default-features = false, features = ["blocking", "http2", "rustls-tls-webpki-roots", "stream"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = "0.5.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-chrome = "0.7.2"
tonic = { version = "0.14.1", default-features = false }
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber ={ version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
wasmtime = { version = "36.0.13", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-bindgen = { version = "0.44.0", default-features = false, features = ["macros", "realloc"] }

dekopon-agent = { version = "0.9.0", path = "crates/dekopon-agent" }
dekopon-broker = { version = "0.9.0", path = "crates/dekopon-broker" }
dekopon-broker-host = { version = "0.9.0", path = "crates/dekopon-broker-host" }
dekopon-broker-protocol = { version = "0.9.0", path = "crates/dekopon-broker-protocol" }
dekopon-brokerd = { version = "0.9.0", path = "crates/dekopon-brokerd" }
dekopon-capability = { version = "0.9.0", path = "crates/dekopon-capability" }
dekopon-config = { version = "0.9.0", path = "crates/dekopon-config" }
dekopon-core = { version = "0.9.0", path = "crates/dekopon-core" }
dekopon-http-host = { version = "0.9.0", path = "crates/dekopon-http-host" }
dekopon-model = { version = "0.9.0", path = "crates/dekopon-model" }
dekopon-policy = { version = "0.9.0", path = "crates/dekopon-policy" }
dekopon-provider-host = { version = "0.9.0", path = "crates/dekopon-provider-host" }
dekopon-provider-http = { version = "0.9.0", path = "crates/dekopon-provider-http" }
dekopon-provider-sdk = { version = "0.9.0", path = "crates/dekopon-provider-sdk" }
dekopon-provider-storage = { version = "0.9.0", path = "crates/dekopon-provider-storage" }
dekopon-protocol = { version = "0.9.0", path = "crates/dekopon-protocol" }
dekopon-shell = { version = "0.9.0", path = "crates/dekopon-shell" }
dekopon-storage-host = { version = "0.9.0", path = "crates/dekopon-storage-host" }
dekopon-telemetry = { version = "0.9.0", path = "crates/dekopon-telemetry" }
dekopon-testkit = { version = "0.9.0", path = "crates/dekopon-testkit" }
dekopon-webui = { version = "0.9.0", path = "crates/dekopon-webui" }
dekopond = { version = "0.9.0", path = "crates/dekopond" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
# Preserve cross-crate optimization while letting release runners codegen in parallel.
codegen-units = 4
