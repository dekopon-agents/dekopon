[workspace]
members = [
    "crates/dekopon-agent",
    "crates/dekopon-broker",
    "crates/dekopon-broker-host",
    "crates/dekopon-broker-protocol",
    "crates/dekopon-brokerd",
    "crates/dekopon-capability",
    "crates/dekopon-config",
    "crates/dekopon-core",
    "crates/dekopon-model",
    "crates/dekopon-http-host",
    "crates/dekopon-policy",
    "crates/dekopon-provider-clock",
    "crates/dekopon-provider-http",
    "crates/dekopon-provider-sdk",
    "crates/dekopon-provider-sdk-testkit",
    "crates/dekopon-provider-storage",
    "crates/dekopon-process",
    "crates/dekopon-protocol",
    "crates/dekopon-shell",
    "crates/dekopon-storage-host",
    "crates/dekopon-telemetry",
    "crates/dekopon-test-support",
    "crates/dekopond",
]
resolver = "3"

[workspace.package]
version = "0.22.0"
edition = "2024"
# The one deliberate copy of rust-toolchain.toml's channel, kept for crates.io metadata. It moves
# with the component toolchain pin; see the comment above `wasmtime` below.
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/dekopon"
homepage = "https://github.com/dekopon-agents/dekopon"
authors = ["Dekopon contributors"]

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
http = "1.4.2"
http-body = "1.1.0"
cedar-policy = { version = "4.12.0", default-features = false }
clap = { version = "4.6.4", features = ["derive", "env"] }
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
futures-util = "0.3.31"
hmac = "0.13.0"
http-auth = { version = "0.1.10", default-features = false }
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["service", "tokio"] }
jaq-core = "3.1.0"
jaq-json = { version = "2.0.1", features = ["serde"] }
jaq-std = { version = "3.0.1", default-features = false, features = ["format", "log", "math", "regex", "std", "time"] }
libc = "0.2.189"
# `internal-logs` is the SDK's only runtime failure channel since the global error handler was
# removed: without it every export failure — expired token, missing header, receiver down — is
# discarded in silence. Each exporting binary filters the `opentelemetry` target off its own OTLP
# layer, so these records reach stdout/stderr only and cannot feed export failures back into export.
opentelemetry = { version = "0.33.0", default-features = false, features = ["internal-logs", "logs", "trace"] }
opentelemetry-appender-tracing = "0.33.0"
opentelemetry-http = { version = "0.33.0", default-features = false }
# `tls-webpki-roots` gives the tonic channel a TLS connector, matching the webpki-only stance the
# rest of the workspace takes; without it an `https://` endpoint under `grpc` fails at export time.
# `tls-ring` is what exposes `with_tls_config`, used to add OTEL_EXPORTER_OTLP_CERTIFICATE's root.
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["grpc-tonic", "http-proto", "internal-logs", "logs", "tls-ring", "tls-webpki-roots", "trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["internal-logs", "logs", "trace"] }
# The engine `jaq-std`'s `regex` feature already links into `dekopon-shell`. `grep -E`/`sed -E` use
# that one directly rather than adding a second regex engine to the graph.
regex-bites = "0.1.6"
reqwest ={ version = "0.12.28", default-features = false, features = ["http2", "rustls-tls-webpki-roots", "stream"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber ={ version = "0.3.23", features = ["env-filter", "fmt", "json"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
url = "2.5.8"
# Component toolchain pin. Do not touch this unless you are moving all of these in lockstep:
#   rust-toolchain.toml            one Rust for the workspace, the fixtures and every CI job
#   Cargo.toml rust-version        the same number, kept for crates.io metadata
#   Cargo.toml wasmtime, wit-bindgen, and the seven examples/providers/*/Cargo.toml wit-bindgen pins
#   ci/toolchain.env               wasm-tools and wkg, with their sha256
#   deny.toml [[skip]]             wasm-encoder / wasmparser / wit-parser versions
# then rebuild every examples/providers/*.wasm on the pinned CI image.
# wit-bindgen's generated code must agree with the wasm-tools CLI and with Wasmtime's component
# model crates. History: #206; #191 is the lone wit-bindgen bump that could not build.
wasmtime ={ version = "48.0.2", default-features = false, features = ["component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wit-bindgen = { version = "0.62.0", default-features = false, features = ["bitflags", "macros", "realloc"] }

dekopon-agent = { version = "0.22.0", path = "crates/dekopon-agent" }
dekopon-broker = { version = "0.22.0", path = "crates/dekopon-broker" }
dekopon-broker-host = { version = "0.22.0", path = "crates/dekopon-broker-host" }
dekopon-broker-protocol = { version = "0.22.0", path = "crates/dekopon-broker-protocol" }
dekopon-brokerd = { version = "0.22.0", path = "crates/dekopon-brokerd" }
dekopon-capability = { version = "0.22.0", path = "crates/dekopon-capability", default-features = false }
dekopon-config = { version = "0.22.0", path = "crates/dekopon-config" }
dekopon-core = { version = "0.22.0", path = "crates/dekopon-core", default-features = false }
dekopon-http-host = { version = "0.22.0", path = "crates/dekopon-http-host" }
dekopon-model = { version = "0.22.0", path = "crates/dekopon-model" }
dekopon-policy = { version = "0.22.0", path = "crates/dekopon-policy" }
dekopon-provider-clock = { version = "0.22.0", path = "crates/dekopon-provider-clock" }
dekopon-provider-http = { version = "0.22.0", path = "crates/dekopon-provider-http" }
dekopon-provider-sdk = { version = "0.22.0", path = "crates/dekopon-provider-sdk" }
dekopon-provider-sdk-testkit = { version = "0.22.0", path = "crates/dekopon-provider-sdk-testkit" }
dekopon-provider-storage = { version = "0.22.0", path = "crates/dekopon-provider-storage" }
dekopon-process = { version = "0.22.0", path = "crates/dekopon-process" }
dekopon-protocol = { version = "0.22.0", path = "crates/dekopon-protocol", default-features = false }
dekopon-shell = { version = "0.22.0", path = "crates/dekopon-shell" }
dekopon-storage-host = { version = "0.22.0", path = "crates/dekopon-storage-host" }
dekopon-telemetry = { version = "0.22.0", path = "crates/dekopon-telemetry" }
dekopond = { version = "0.22.0", path = "crates/dekopond" }

# Temporary upstream fix for scoped-dispatch cold-callsite loss:
# https://github.com/tokio-rs/tracing/pull/3614
# Patch the shared core so direct and transitive tracing consumers use the same dispatcher.
# Remove once a crates.io release includes this fix (see docs/development.md).
[patch.crates-io]
tracing-core = { git = "https://github.com/dekopon-agents/tracing", rev = "2b696a18454a04df9c9a60569b6fb73a22415296" }

[workspace.lints.rust]
# Keep unsafe denied workspace-wide (and existing crate-local forbids intact), permitting
# only broker-host's site-scoped, verified trusted-file cwasm deserialization call.
unsafe_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Span guards, mutexes, and RefCell borrows held across `.await` corrupt trace parenting or
# deadlock. `clippy.toml` names the tracing guard types for `await_holding_invalid_type`.
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Discarding a failure's cause at the site that discards it is the most common defect class in
# this repository. A site that legitimately drops one takes a scoped `#[allow]` with a reason.
map_err_ignore = "deny"
let_underscore_must_use = "deny"
# A panic in `dekopond` drops a live chat session and one in `dekopon-brokerd` takes the only
# authorization path down with it. `expect_used` follows once the poisoned-mutex policy is settled.
unwrap_used = "deny"
# `Arc::clone(&x)`/`Rc::clone(&x)` at the callsite distinguishes a refcount bump from a deep copy
# of the pointee, which matters where the pointee is a session, a policy set, or a component.
clone_on_ref_ptr = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
# Preserve cross-crate optimization while letting release runners codegen in parallel.
codegen-units = 4

# Test executables are what a warm CI build still links, and full DWARF for Wasmtime dominates
# that link. Line tables keep panic backtraces in workspace code.
[profile.dev]
debug = "line-tables-only"

# Every broker boot compiles provider components with Cranelift. Unoptimized, that compile is
# ~90% of `cargo test` CPU; optimizing just the compiler crates cuts suite CPU 8x.
[profile.dev.package]
cranelift-codegen = { opt-level = 3 }
cranelift-bforest = { opt-level = 3 }
cranelift-entity = { opt-level = 3 }
cranelift-frontend = { opt-level = 3 }
cranelift-control = { opt-level = 3 }
cranelift-bitset = { opt-level = 3 }
cranelift-assembler-x64 = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
wasmparser = { opt-level = 3 }
wasmtime-environ = { opt-level = 3 }
wasmtime-internal-cranelift = { opt-level = 3 }
gimli = { opt-level = 3 }
"*" = { debug = false }
