apiVersion: v1
kind: Namespace
metadata:
  name: dekopon-observability
  labels:
    app.kubernetes.io/part-of: dekopon
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickwit-config
  namespace: dekopon-observability
data:
  quickwit.yaml: |
    version: 0.8
    cluster_id: dekopon-observability-kind
    node_id: quickwit-kind-0
    listen_address: 0.0.0.0
    data_dir: /quickwit/qwdata
    metastore_uri: postgres://quickwit@postgres:5432/quickwit
    default_index_root_uri: file:///quickwit/splits

    metastore:
      postgres:
        min_connections: 1
        max_connections: 4

    indexer:
      enable_otlp_endpoint: true
      split_store_max_num_bytes: 1G
      split_store_max_num_splits: 100

    ingest_api:
      max_queue_memory_usage: 256MiB
      max_queue_disk_usage: 512MiB
      content_length_limit: 4MiB

    searcher:
      fast_field_cache_capacity: 128M
      split_footer_cache_capacity: 64M
      partial_request_cache_capacity: 16M
      aggregation_memory_limit: 128M

    jaeger:
      enable_endpoint: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dekopon-observability
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dekopon-observability
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dekopon-observability
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dekopon-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: dekopon-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: quickwit
            - name: POSTGRES_USER
              value: quickwit
            # This is an isolated, ephemeral kind fixture. Do not copy trust auth to a
            # shared or production cluster.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, quickwit, -d, quickwit]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: metadata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: metadata
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quickwit
  namespace: dekopon-observability
  labels:
    app.kubernetes.io/name: quickwit
    app.kubernetes.io/part-of: dekopon-observability
spec:
  selector:
    app.kubernetes.io/name: quickwit
  ports:
    - name: rest
      port: 7280
      targetPort: rest
    - name: grpc
      port: 7281
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickwit
  namespace: dekopon-observability
  labels:
    app.kubernetes.io/name: quickwit
    app.kubernetes.io/part-of: dekopon-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quickwit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quickwit
        app.kubernetes.io/part-of: dekopon-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - until pg_isready -h postgres -U quickwit -d quickwit; do sleep 1; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: quickwit
          image: quickwit/quickwit:0.9.0@sha256:1e6169bf4e98a489fca397105f1698c1d80a0f9779f3cf652973bac8a0c3b2bd
          imagePullPolicy: IfNotPresent
          args: [run]
          env:
            - name: NO_COLOR
              value: "1"
            - name: QW_ENABLE_OTLP_ENDPOINT
              value: "true"
          ports:
            - name: rest
              containerPort: 7280
            - name: grpc
              containerPort: 7281
          startupProbe:
            httpGet:
              path: /health/livez
              port: rest
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/readyz
              port: rest
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /quickwit/config/quickwit.yaml
              subPath: quickwit.yaml
              readOnly: true
            - name: data
              mountPath: /quickwit/qwdata
            - name: splits
              mountPath: /quickwit/splits
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: quickwit-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: splits
          emptyDir:
            sizeLimit: 2Gi
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
