apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-openai
  namespace: dekopon-observability
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("content-length", "0"))
            if length > 1024 * 1024:
                self.send_error(413)
                return
            request = json.loads(self.rfile.read(length))
            messages = request.get("messages", [])
            completed_tool = any(message.get("role") == "tool" for message in messages)
            if completed_tool:
                message = {
                    "role": "assistant",
                    "content": "Dekopon OTLP end-to-end run completed.",
                    "tool_calls": [],
                }
            else:
                message = {
                    "role": "assistant",
                    "content": None,
                    # A session offers exactly one tool, `bash`, whose single argument is a
                    # script. The sentinel travels inside that script, so the redaction check
                    # below proves model-authored script text stays out of telemetry.
                    "tool_calls": [{
                        "id": "call-e2e-1",
                        "type": "function",
                        "function": {
                            "name": "bash",
                            "arguments": json.dumps({
                                "script": "echo.echo --message "
                                          "DEKOPON_E2E_TOOL_SECRET_DO_NOT_EXPORT | jq -r .message"
                            }),
                        },
                    }],
                }
            body = json.dumps({"choices": [{"message": message}]}).encode()
            self.send_response(200)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, _format, *_args):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: mock-openai
  namespace: dekopon-observability
spec:
  selector:
    app.kubernetes.io/name: mock-openai
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-openai
  namespace: dekopon-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-openai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-openai
        app.kubernetes.io/part-of: dekopon-otel-e2e
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          imagePullPolicy: IfNotPresent
          command: [python, /app/server.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /app/server.py
              subPath: server.py
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: mock-openai
