apiVersion: batch/v1
kind: Job
metadata:
  name: dekopon-run-otel-e2e
  namespace: dekopon-observability
  labels:
    app.kubernetes.io/name: dekopon-run
    app.kubernetes.io/part-of: dekopon-otel-e2e
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dekopon-run
        app.kubernetes.io/part-of: dekopon-otel-e2e
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: dekopon-run-otel:e2e
          imagePullPolicy: Never
          args:
            - --no-color
            - --otlp-endpoint=http://quickwit:7281
            - --otel-service-name=dekopon-run-e2e
            - --otel-logs-index=otel-logs-v0_9
            - --otel-traces-index=otel-traces-v0_9
            - --otel-export-timeout-ms=15000
            - prompt
            - --provider=/opt/dekopon/providers/echo-provider.wasm
            - --model=e2e-model
            - --endpoint=http://mock-openai:8080/v1
            - --api-key-env=DEKOPON_E2E_UNSET_API_KEY
            - --max-steps=4
            - DEKOPON_E2E_PROMPT_SECRET_DO_NOT_EXPORT
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=kind,e2e.test.id=quickwit-0.9
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
