broker:
  config:
    inline: ""
  configDirectory:
    configMap: dekopon-broker-d
  credentials:
    existingSecret: dekopon-broker-credentials

gateway:
  enabled: true
  configDirectory:
    configMap: dekopon-gatewayd-d
  catalog:
    existingConfigMap: dekopon-agents
    existingConfigMapKey: dekopon.yaml
  skills:
    configMap: dekopon-skills
    items:
      - key: review-skill
        path: pull-request-review/SKILL.md
      - key: review-reference
        path: pull-request-review/references/review.cjs

drainBudget:
  assumedBrokerShutdownGraceMs: 120000
  assumedGatewayShutdownGraceMs: 120000

console:
  enabled: true
  image:
    tag: v0.1.0
  subject: discord.1
