# Dekopon — one pod, two private UIDs, one IPC group.
#
# Read charts/dekopon/README.md before changing anything here. Most of the values below are
# constrained by what the daemons check at startup, not by taste: dekopon-brokerd validates the
# owner, mode, link count and every path ancestor of every file it touches, and refuses to serve
# when one is wrong. A pod that "looks configured" and never becomes ready is the normal symptom.

image:
  repository: ghcr.io/dekopon-agents/dekopon
  # Empty means "v" + .Chart.AppVersion, which names the application release this chart deploys.
  # The published tag is the Git tag, so it carries the v. There is no `latest`, and there is no
  # image for v0.3.0 or earlier — the image workflow landed after that release.
  tag: ""
  # Prefer a digest once one exists; it pins across the arm64/amd64 index.
  digest: ""
  pullPolicy: IfNotPresent
  # No pull secret hook on purpose. Both GHCR packages this chart touches — the image and the
  # chart itself — are public, so every pull on this path is anonymous. A dangling
  # imagePullSecrets field would only suggest a credential is required.

# The init container. Distroless has no shell, so a second image with one does the copy that turns
# projected-volume symlinks into real owner-only files. Pinned by index digest so both
# architectures resolve.
initImage:
  repository: busybox
  tag: 1.37.0-musl
  digest: sha256:fc6dddc4c44b1bfe37f41cae8e67d1693828e8f42a91862816d7953e2c9d3f23
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------------------------
# 65532 is not a preference. The image bakes /opt/dekopon/providers/*.wasm owned by 65532:65532,
# and dekopon-brokerd compares a provider file's owner against its own euid before loading it. Any
# other broker UID makes every provider fail to load. The chart pins broker UID/GID even for a
# custom image. The gateway container overrides these defaults with UID/GID 65533:65533;
# supplementary group 65534 reaches only IPC, never private credential files.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  supplementalGroups: [65534]
  seccompProfile:
    # wasmtime JITs through Cranelift and needs mmap with PROT_EXEC, mprotect, memfd_create, and
    # SIGSEGV/SIGBUS handlers for guard-page traps. RuntimeDefault permits all of that. Do not
    # narrow this to a hand-written profile without proving a provider still loads.
    type: RuntimeDefault
  # fsGroup is deliberately absent, and setting it breaks the broker. It makes mounted files
  # group-readable, and 0o040 trips the credentials file's `mode & 0o077 != 0` refusal.

securityContext:
  allowPrivilegeEscalation: false
  # Neither daemon writes outside its mounted volumes. A tmpfs /tmp is mounted anyway so an
  # incidental temporary file cannot turn into a crash.
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The init container is the one thing in this chart that runs as root, because chowning an
# emptyDir or a local-path volume root to 65532 requires CAP_CHOWN, and re-chmodding an already
# 65532-owned directory on a restart requires CAP_FOWNER. Everything else is dropped.
initSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [CHOWN, FOWNER]
  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------------------------
# Paths the chart owns
# ---------------------------------------------------------------------------------------------
# These are the directories the chart creates and hands to the daemons. Your broker.yaml and
# dekopond.yaml must name files inside them — the chart places files, it does not rewrite configs.
#
#   <configDir>/broker.yaml               0600 65532  (Tier B: mode & 0o022, uid, nlink, O_NOFOLLOW)
#   <configDir>/policies.cedar            0600 65532  (Tier B)
#   <configDir>/broker-credentials.yaml   0600 65532  (Tier A: mode & 0o077, uid, nlink)
#   <configDir>/dekopond.yaml             0600 65533  (gateway-only volume)
#   <runtimeDir>/broker.sock              0710 dir, 65532:65534; broker binds the 0660 socket
#   <stateDir>/<chatgpt.subdir>/          0700 dir owned by its daemon; seed-once ChatGPT credential
#   <catalogDir>/<catalog key>            no checks at all; a plain ConfigMap mount
paths:
  configDir: /etc/dekopon
  gatewayConfigDir: /etc/dekopon-gateway
  runtimeDir: /run/dekopon
  stateDir: /var/lib/dekopon
  catalogDir: /etc/dekopon-catalog

# ---------------------------------------------------------------------------------------------
# Broker
# ---------------------------------------------------------------------------------------------
broker:
  # Every file below is supplied either inline (the chart writes a Secret) or by naming an object
  # that already exists. Inline and existing are mutually exclusive; setting both is an error.
  #
  # The chart never parses or generates these files. Their formats are documented in
  # crates/dekopon-brokerd/README.md, and examples/conditional-write/ is a working set.
  config:
    # Chart default: the echo example from crates/dekopon-brokerd/README.md, repointed at the
    # chart's paths. It is a real, deny-by-default configuration that starts and authorizes
    # exactly one read-only capability for this pod's own UID — a broker you can install and
    # watch become ready before you give it anything that matters. Replace it.
    inline: |
      apiVersion: dekopon.dev/brokerd/v1alpha1
      socketPath: /run/dekopon/broker.sock
      brokerPrincipal: local-broker
      policyRevision: chart-default
      policiesPath: /etc/dekopon/policies.cedar
      providers:
        - /opt/dekopon/providers/echo-provider.wasm
      identities:
        # Broker-owned probes use this identity; gateway deployments map UID 65533 separately.
        - uid: 65532
          principal: dekopon-pod
          actor:
            type: service
            principal: dekopon-pod
      constraintSets:
        echo.echo:
          provider: echo
          effect: read-only
          risk: Low
          constraints:
            timeoutMs: 30000
            maxOutputBytes: 1048576
      serverLimits:
        # A present section requires every field. These are the daemon's own defaults.
        maxFrameBytes: 2097152
        ioTimeoutMs: 30000
        maxConnections: 64
        shutdownGraceMs: 120000
      hostLimits:
        # Unlike serverLimits, hostLimits defaults field by field: everything omitted here keeps
        # the daemon's own value.
        # maxMemoryBytes bounds one invocation (64 MiB by default); nothing bounds all of them at
        # once, so the worst case is maxConnections x maxMemoryBytes = 64 x 64 MiB = 4 GiB, four
        # times the memory limit below. 256 MiB lets four invocations hold their full ceiling and
        # refuses the fifth, which is a failed invocation instead of an OOM-killed pod, and it
        # leaves the rest of the limit to the broker process and Cranelift.
        maxTotalMemoryBytes: 268435456
    existingSecret: ""
    existingSecretKey: broker.yaml

  # Cedar policy set. Required whenever broker.yaml declares any constraintSets, because a broker
  # that declares executable capabilities and no policy refuses every request while looking
  # configured. An @id("…") annotation is what audit records carry as policy_ids.
  policies:
    inline: |
      @id("pod-echo")
      permit(principal == Dekopon::Principal::"dekopon-pod",
             action == Dekopon::Action::"echo.echo",
             resource == Dekopon::Provider::"echo")
      unless { context has via };
    existingSecret: ""
    existingSecretKey: policies.cedar

  # Provider secrets. The only file in this chart that is a secret at rest, and the one the
  # permission rules are strictest about. Leave both empty when broker.yaml names no
  # credentialsPath. Prefer existingSecret: putting a token in a values file puts it in the
  # release, in `helm get values`, and probably in Git.
  credentials:
    inline: ""
    existingSecret: ""
    existingSecretKey: broker-credentials.yaml

  # Seed a ChatGPT subscription credential for the BROKER once, and never again.
  #
  # This is the `kind: chatgptSubscription` entry in broker-credentials.yaml: the broker presents a
  # ChatGPT access token to an allowed destination and renews it itself, 60 s before expiry, through
  # the same refresh protocol and the same file format the gateway's model credential uses.
  #
  # It is a SEPARATE token family from gateway.chatgpt below, and the two must never point at one
  # file. The refresh token rotates on every renewal and the authorization server retires its
  # predecessor, so two independent holders of one file would eventually present a retired token and
  # revoke the family for both. Run `dekopond auth chatgpt login --auth-file <path>` a second time and
  # export that file instead. Same ChatGPT account, independent refresh token, independent
  # revocation. The chart refuses a shared subdir.
  #
  # Everything the gateway's block says about seed-once applies here identically: the copy in the
  # volume is the live one, the copy in your vault is a retired token the moment the broker refreshes,
  # and restoring it over a live credential breaks a working broker. The difference is who reads it —
  # so the file lands under the broker's own state directory and the gateway never receives a mount
  # for it.
  chatgpt:
    enabled: false
    # Prefer existingSecret. `dekopond auth chatgpt export --expose-credential --auth-file <path>`
    # produces the document; an External Secrets Operator ExternalSecret against a 1Password item
    # projects the same shape. An inline value is stored in the release and returned by
    # `helm get values`.
    inline: ""
    existingSecret: ""
    existingSecretKey: chatgpt-auth.json
    # File name inside the credential directory, and therefore the leaf your broker-credentials.yaml
    # authFile must name. `save_credentials` derives its temporary sibling by REPLACING this
    # extension — chatgpt-auth.json becomes chatgpt-auth.tmp-<pid> — and renames over the target, so
    # the broker needs write access to the directory, not just the file. dekopon-brokerd refuses to
    # start when that directory is not owner-only and writable.
    fileName: chatgpt-auth.json
    # Single path segment, joined onto paths.stateDir. It is not a free path on purpose: the
    # credential must live on the claim, and a full path could be pointed at an emptyDir. It must
    # differ from gateway.chatgpt.subdir, and it must not be "broker" — that segment is the broker's
    # own state subPath.
    subdir: broker-chatgpt
    # Deliberate, destructive re-seed. Overwrites the credential in the volume with the one from the
    # Secret, DISCARDING a refresh token that is almost certainly fresher. Use it only after a
    # deliberate local re-login and re-export of THIS family.
    #
    # It is not self-clearing: while this is true, every restart re-seeds. Set it back to false once
    # the pod has rolled. Changing it rolls the pod on its own, because it changes the init
    # container's arguments.
    reseed: false

  # A managed provider set on the state claim, for a `broker.yaml` that names `providerSet` instead
  # of `providers`. The two are mutually exclusive in the daemon: either the components baked into
  # the image, or a generated lock plus a content-addressed blob store that
  # `dekopon-brokerd provider sync` resolved from digest-pinned OCI artifacts.
  #
  # The chart neither runs that sync nor writes anything into this directory. It does the two things
  # only the pod can do: the claim's `subdir` is mounted into the BROKER container at `mountPath`,
  # and the init container creates that subdirectory and hands it to 65532 as `0700`. Both are
  # load-bearing. The broker refuses a lock or a store it does not own, and refuses any ancestor
  # that is group- or world-writable without the sticky bit; a fresh `local-path` volume arrives
  # root-owned and `0777`, so a first start without the chown refuses.
  #
  # Writing the lock and the store is an operator-owned step outside this chart, and it has to have
  # run before the pod rolls — on a Raspberry Pi deployment, an Argo `Sync` hook Job in an earlier
  # wave that runs `dekopon-brokerd provider sync`. The gateway never receives this mount.
  providerSet:
    enabled: false
    # Single path segment, joined onto paths.stateDir. It is not a free path for the same reason the
    # ChatGPT subdirs are not: the set has to live on the claim, and the init container must chown
    # its own subtree and nothing else on it.
    subdir: providers
    # Where the broker container sees that subdirectory. Separate from `subdir` because the broker
    # never mounts the claim root, so the path it reads is not the path on the claim. Your
    # broker.yaml's `providerSet.lockPath` and `providerSet.storePath` must be under this prefix;
    # the chart places the directory, it does not rewrite configuration.
    mountPath: /var/lib/dekopon/providers

  # Optional owner-only public-DRN/private-source map. The map contains no values but does contain
  # sensitive physical inventory. Prefer an existing Secret. The init container copies it into the
  # broker-only 0600 config directory; it is never mounted into the gateway.
  secretMap:
    inline: ""
    existingSecret: ""
    existingSecretKey: secret-map.yaml

  # Optional broker-only read-only mounts for secret-map sources and bootstrap files. Each entry is
  # a Kubernetes volume plus its mount path; the gateway never receives these mounts. A Secret or
  # ConfigMap volume retains its AtomicWriter symlink layout and is consumed with
  # source.kind=kubernetesProjection. Bootstrap tokens needing the ordinary 0600 loader use
  # broker.secretBootstrapFiles below.
  # - name: api-secret
  #   mountPath: /var/run/dekopon-secrets/api
  #   volume:
  #     secret:
  #       secretName: api-secret
  secretSourceVolumes: []

  # Owner-managed bootstrap/session files copied by the existing root init boundary into the
  # broker-only 0700 config tmpfs as UID 65532, mode 0600. Secret-map adapters reference
  # <paths.configDir>/<file>. Values never enter Helm values or the gateway.
  # - file: vault-token
  #   existingSecret: dekopon-vault-bootstrap
  #   existingSecretKey: token
  secretBootstrapFiles: []

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # Headroom for Cranelift: every pod start recompiles every .wasm component from scratch,
      # there is no compilation cache, and that work is what the startup probe waits on.
      cpu: "2"
      memory: 1Gi

  # Plain env entries. Chat-service and model tokens are NOT here — they belong to the gateway. What the
  # broker wants is RUST_LOG and, if broker.yaml has a telemetry section, OTEL_EXPORTER_OTLP_HEADERS
  # (the OpenTelemetry SDK reads ingest auth from there so a token never enters the config file).
  #
  env:
    - name: RUST_LOG
      value: info
  envFrom: []

  # There is no HTTP health endpoint and the image has no shell, so both probes run a real broker
  # client: `dekopon-brokerd probe` connects over the socket, passes SO_PEERCRED both
  # ways, and gets an authorized capability list back. It appends no audit record.
  #
  # The startup probe is also the ordering primitive: Kubernetes does not start dekopond until the
  # broker sidecar's startup probe succeeds.
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 10
    # 5 minutes. Component compilation on a Raspberry Pi 5 is seconds, not minutes; the margin is
    # there because a startup probe that gives up restarts the container, and a restart loop
    # can interrupt work mid-invocation.
    failureThreshold: 60
  readinessProbe:
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  # No liveness probe, on purpose. Nothing routes traffic to this pod, so a restart fixes nothing
  # a human would not fix better, and it would kill a broker mid-invocation.

# ---------------------------------------------------------------------------------------------
# Gateway
# ---------------------------------------------------------------------------------------------
gateway:
  # Off by default. Unlike the broker, dekopond cannot have a working default: it needs a chat
  # transport, a model endpoint, and an agent catalog, and the chart can invent none of them.
  enabled: false

  config:
    inline: ""
    existingSecret: ""
    existingSecretKey: dekopond.yaml

  # catalogPath is the one file with no hygiene rules at all — dekopond reads it with a plain
  # read_to_string. A ConfigMap mount is fine and nothing is copied.
  catalog:
    inline: ""
    existingConfigMap: ""
    existingConfigMapKey: dekopon.yaml
    # Filename the catalog is mounted as, and therefore the leaf your catalogPath must name.
    fileName: dekopon.yaml

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Seed a ChatGPT subscription credential once, and never again.
  #
  # `dekopond auth chatgpt login` is a device-authorization flow: it prints a URL and waits for a
  # human with a browser. Nothing in a pod can do that, so a `kind: chatgptSubscription` model has
  # to be handed a credential exported from a local login — `dekopond auth chatgpt export`, which
  # lands with the auth-export change.
  #
  # This is the one file the chart writes that the daemon then OWNS. The refresh token rotates on
  # every refresh and the rotated record is written back atomically, so the copy in your vault is a
  # dead token the moment the pod refreshes. That is expected, not broken: the exported copy exists
  # to seed a NEW deployment, it is not a backup, and restoring it over a live credential breaks a
  # working pod. A write-back that fails logs `chatgpt_credential_save_failed` and keeps going on
  # the in-memory token, because by then the predecessor on disk is already retired.
  #
  # So it is seeded once, into the persistent claim, and the init container refuses to overwrite
  # it afterwards. It lives on the claim rather than an emptyDir precisely because an emptyDir
  # dies with the pod, which would quietly turn "seed once" into "seed on every reschedule".
  chatgpt:
    enabled: false
    # Prefer existingSecret. `dekopond auth chatgpt export --expose-credential --namespace <ns>`
    # emits exactly this Secret, named dekopon-chatgpt-auth with the key chatgpt-auth.json; an
    # External Secrets Operator ExternalSecret against a 1Password item projects the same shape.
    # An inline value is stored in the release and returned by `helm get values`.
    inline: ""
    existingSecret: ""
    existingSecretKey: chatgpt-auth.json
    # File name inside the credential directory. `save_credentials` derives its temporary sibling
    # by REPLACING this extension — chatgpt-auth.json becomes chatgpt-auth.tmp-<pid> — and renames
    # over the target, so the daemon needs write access to the directory, not just the file.
    fileName: chatgpt-auth.json
    # Single path segment, joined onto paths.stateDir. It is not a free path on purpose: the
    # credential must land on the claim, and a full path could be pointed at an emptyDir.
    subdir: chatgpt
    # Deliberate, destructive re-seed. Overwrites the credential in the volume with the one from
    # the Secret, DISCARDING a refresh token that is almost certainly fresher than the exported
    # copy — the pod's credential is the live one. Use it only after a deliberate local re-login
    # and re-export.
    #
    # It is not self-clearing: while this is true, every restart re-seeds. Set it back to false
    # once the pod has rolled. Changing it rolls the pod on its own, because it changes the init
    # container's arguments.
    reseed: false

  # dekopond.yaml names environment variable NAMES, never values, so every chat and model
  # credential is an ordinary secretKeyRef with no file hygiene involved. Example:
  #
  #   env:
  #     - name: DEKOPOND_SLACK_APP_TOKEN
  #       valueFrom: { secretKeyRef: { name: dekopon-slack, key: appToken } }
  #     - name: DEKOPOND_SLACK_BOT_TOKEN
  #       valueFrom: { secretKeyRef: { name: dekopon-slack, key: botToken } }
  #     - name: DEKOPOND_DISCORD_BOT_TOKEN
  #       valueFrom: { secretKeyRef: { name: dekopon-discord, key: botToken } }
  #     - name: OPENAI_API_KEY
  #       valueFrom: { secretKeyRef: { name: dekopon-model, key: apiKey } }
  env:
    - name: RUST_LOG
      value: info
  envFrom: []

  # Optional ClusterIP target for an inbound webhook listener such as WhatsApp Cloud API. This
  # exposes only a pod port inside the cluster; put an exact-path Traefik route and public TLS
  # boundary in a separate operator-owned manifest. dekopond.yaml must bind 0.0.0.0 at this same
  # port—a loopback bind is unreachable from a Kubernetes Service. No Ingress is chart-created.
  service:
    enabled: false
    port: 9080
    annotations: {}

# ---------------------------------------------------------------------------------------------
# Model-credential state
# ---------------------------------------------------------------------------------------------
# The seed-once ChatGPT credentials are retained across releases. Audit is not here: it is the
# broker's log record, on stdout and on the OTLP receiver its telemetry block names.
state:
  # local-path is the target cluster's only StorageClass. It is RWO and — this is the part that
  # matters — ALLOWVOLUMEEXPANSION is false. This claim CANNOT BE GROWN LATER. Replacing it means
  # deliberately moving the live model credentials to the new volume.
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  size: 2Gi
  # Named annotation, not a comment: helm uninstall must not delete the live model credentials.
  keepOnUninstall: true
  # Bring your own claim instead. Init keeps its root 0:0/0700; each daemon mounts only
  # its own private subdirectory. See the offline layout migration in the chart README.
  existingClaim: ""

# Optional provider storage is physically and lifecycle-separate from the state claim. The generated
# claim is always retained.
providerStorage:
  enabled: false
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  size: 2Gi
  existingClaim: ""
  rootPath: /var/lib/dekopon-provider-storage

# tmpfs sizes. Both are memory-backed so the credentials file and the socket never touch the
# node's disk; both count against the pod's memory limit, which is why they are small.
volumeSizes:
  config: 8Mi
  runtime: 1Mi
  tmp: 16Mi

# ---------------------------------------------------------------------------------------------
# Termination
# ---------------------------------------------------------------------------------------------
# The containers stop in SEQUENCE — the gateway's container first, then the broker sidecar — so
# this is the SUM of both drains, not the larger of the two. dekopond drains in-flight sessions
# for its own shutdownGraceMs and dekopon-brokerd only then drains connections for its
# serverLimits.shutdownGraceMs; both default to 120000, so the default here is 120 + 120 +
# drainBudget.bufferSeconds. Whichever daemon is still draining when this expires is SIGKILLed,
# which for the broker is mid-invocation.
#
# The chart asserts this at template time, so lowering it without lowering a shutdownGraceMs is a
# refused render rather than a kill nobody sees until an invocation is cut off.
terminationGracePeriodSeconds: 270

drainBudget:
  # Seconds on top of the two drains: the kubelet's SIGTERM delivery and per-container bookkeeping,
  # each daemon's telemetry flush (an OTLP exporter can burn its whole exportTimeoutMs against a
  # restarting collector), and the sidecar stop that only begins once the gateway's container is
  # gone.
  bufferSeconds: 30
  # What the assertion assumes when it cannot read the real value: an existingSecret is opaque to
  # the chart, and an inline config may leave shutdownGraceMs out, in which case the daemon's own
  # default applies. Both daemons default to 120000. These configure nothing — they are what the
  # arithmetic believes, so correct them when your Secret says something else.
  assumedBrokerShutdownGraceMs: 120000
  assumedGatewayShutdownGraceMs: 120000

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
priorityClassName: ""

# No Ingress is chart-owned. gateway.service optionally creates only a cluster-local webhook
# Service; the broker remains reachable solely through the Unix socket inside the pod.
