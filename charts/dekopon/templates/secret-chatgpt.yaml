{{- if and (include "dekopon.chatgptEnabled" .) .Values.gateway.chatgpt.inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dekopon.chatgptSecretName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
type: Opaque
# The seed, and only the seed. Once the pod has refreshed once, this object holds a refresh token
# the provider has already retired; that is expected. It exists to start a new deployment, not to
# restore a running one.
#
# `dekopon auth chatgpt export --expose-credential --namespace <ns>` emits this object directly,
# which is a better route than an inline value: an inline value is stored in the release and
# returned by `helm get values`.
stringData:
  {{ .Values.gateway.chatgpt.fileName }}: |
    {{- .Values.gateway.chatgpt.inline | nindent 4 }}
{{- end }}
