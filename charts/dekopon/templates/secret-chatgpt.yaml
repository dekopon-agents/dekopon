{{- if and (include "dekopon.chatgptEnabled" .) .Values.gateway.chatgpt.inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dekopon.chatgptSecretName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
type: Opaque
# The seed, and only the seed. Once the pod has refreshed once, this object holds a refresh token
# the provider has already retired; that is expected. It exists to start a new deployment, not to
# restore a running one.
#
# `dekopond auth chatgpt export --expose-credential --namespace <ns>` emits this object directly,
# which is a better route than an inline value: an inline value is stored in the release and
# returned by `helm get values`.
stringData:
  {{ .Values.gateway.chatgpt.fileName }}: |
    {{- .Values.gateway.chatgpt.inline | nindent 4 }}
{{- end }}
{{- if and (include "dekopon.brokerChatgptEnabled" .) .Values.broker.chatgpt.inline }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dekopon.brokerChatgptSecretName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
type: Opaque
# The broker's own seed, and only the seed. It is a SEPARATE refresh-token family from the gateway's
# above: the refresh token rotates and the authorization server retires its predecessor, so one file
# shared by two holders eventually revokes the family for both.
#
# `dekopond auth chatgpt login --auth-file <path>` then `dekopond auth chatgpt export
# --expose-credential --auth-file <path>` produces this document. An inline value is stored in the
# release and returned by `helm get values`, so prefer existingSecret.
stringData:
  {{ .Values.broker.chatgpt.fileName }}: |
    {{- .Values.broker.chatgpt.inline | nindent 4 }}
{{- end }}
