{{- if not .Values.state.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dekopon.stateClaimName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.state.keepOnUninstall }}
    # The audit chain outlives the release. A non-empty audit whose checkpoint is missing or is
    # not a prefix of the chain makes dekopon-brokerd fail closed and demand operator recovery, so
    # `helm uninstall` deleting this volume would either destroy evidence or wedge the next
    # install. Delete it deliberately or not at all.
    helm.sh/resource-policy: keep
    # That annotation is a Helm-uninstall protection and a GitOps controller does not read it. Argo
    # CD syncing with prune deletes any live object the rendered desired state stops containing —
    # set state.existingClaim, or leave the chart source briefly unresolvable, and the audit chain,
    # the checkpoint and the live ChatGPT credential go with it, which by this chart's own recovery
    # rules is an undetectable rollback. Prune=false covers the sync, Delete=false covers the
    # Application itself being deleted. Argo reads both off the live object.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.state.accessModes | nindent 4 }}
  {{- with .Values.state.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      # local-path has ALLOWVOLUMEEXPANSION false. This size is final for the life of the volume.
      storage: {{ .Values.state.size | quote }}
{{- end }}
