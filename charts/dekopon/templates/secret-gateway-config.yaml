{{- if and .Values.gateway.enabled .Values.gateway.config.inline (not .Values.gateway.configDirectory.configMap) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dekopon.gatewayConfigSecretName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
type: Opaque
stringData:
  gatewayd.yaml: |
    {{- .Values.gateway.config.inline | nindent 4 }}
{{- end }}
