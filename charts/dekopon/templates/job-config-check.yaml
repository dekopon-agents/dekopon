{{- if .Values.configCheck.enabled }}
{{- $check := .Values.configCheck -}}
{{- if not (or $check.broker.configMap $check.gateway.configMap) }}
{{- fail "configCheck.enabled requires configCheck.broker.configMap, configCheck.gateway.configMap or both" }}
{{- end }}
{{- if and $check.gateway.configMap (not $check.gateway.catalogConfigMap) }}
{{- fail "configCheck.gateway.configMap requires configCheck.gateway.catalogConfigMap; check binds every route against the candidate catalog" }}
{{- end }}
{{- $store := and $check.broker.configMap $check.broker.providerSetConfigMap -}}
{{- if and $store (not $check.annotations) (not .Values.state.existingClaim) }}
{{- fail "configCheck.broker.providerSetConfigMap with Helm's default pre-install hook requires state.existingClaim; the chart-created claim does not exist yet when the hook runs" }}
{{- end }}
{{- $workflows := and $store $check.broker.workflowsConfigMap -}}
{{- if and $check.broker.workflowsConfigMap (not $store) }}
{{- fail "configCheck.broker.workflowsConfigMap requires configCheck.broker.providerSetConfigMap; the workflow check runs against the resolved provider set" }}
{{- end }}
{{- $peers := include "dekopon.configCheckPeers" . -}}
{{- $skills := and $check.gateway.configMap $check.gateway.skillsConfigMap -}}
{{- $uid := .Values.podSecurityContext.runAsUser | int -}}
{{- $gid := .Values.podSecurityContext.runAsGroup | int -}}
{{- $storeDir := printf "%s/config-check" .Values.paths.stateDir -}}
{{- $brokerSecurityContext := mergeOverwrite (deepCopy .Values.securityContext) (dict "runAsUser" $uid "runAsGroup" $gid) -}}
{{- $gatewaySecurityContext := mergeOverwrite (deepCopy .Values.securityContext) (dict "runAsUser" 65533 "runAsGroup" 65533) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dekopon.fullname" . }}-config-check
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-check
  annotations:
    {{- with $check.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      # Not the Deployment's selector labels: a running check pod would otherwise join the gateway
      # Service's endpoints.
      labels:
        app.kubernetes.io/name: {{ include "dekopon.name" . }}
        app.kubernetes.io/component: config-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # dekopon-brokerd check refuses symlinks and files it does not own, and a ConfigMap mount is
        # a root-owned symlink farm, so every broker candidate file is copied into a 0700 directory
        # the broker owns. Gateway candidates are mounted directly: a copy would hide a mode the
        # Deployment refuses.
        - name: prepare-candidate
          image: {{ include "dekopon.initImage" . }}
          imagePullPolicy: {{ .Values.initImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.initSecurityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              umask 077
              copy() {
                owner=$1 source=$2 dest=$3
                shift 3
                mkdir -m 0700 "$dest"
                found=0
                for f in "$@"; do
                  [ -f "$f" ] || continue
                  install -m 0600 -o "$owner" -g "$owner" "$f" "$dest/${f##*/}"
                  found=1
                done
                if [ "$found" -eq 0 ]; then
                  echo "$source: nothing to copy into $dest" >&2
                  exit 1
                fi
                chown "$owner:$owner" "$dest"
              }
              chmod 0755 /check
              chmod 1777 /tmp
{{- if $peers }}
              if [ -f /source/broker.d/peers.yaml ]; then
                echo "{{ $check.broker.configMap }}: key peers.yaml collides with the chart-rendered peers.yaml; rename it or set broker.configDirectory.peers=false" >&2
                exit 1
              fi
              copy {{ $uid }} {{ $check.broker.configMap }} /check/broker.d /source/broker.d/*.yaml /source/broker.d/*.cedar /source/peers/peers.yaml
{{- else if $check.broker.configMap }}
              copy {{ $uid }} {{ $check.broker.configMap }} /check/broker.d /source/broker.d/*.yaml /source/broker.d/*.cedar
{{- end }}
{{- if $workflows }}
              copy {{ $uid }} {{ $check.broker.workflowsConfigMap }} /check/workflows.d /source/workflows.d/*.yaml
{{- end }}
{{- if $store }}
              copy {{ $uid }} {{ $check.broker.providerSetConfigMap }} /check/provider-set /source/provider-set/providers.yaml
              chown 0:0 "{{ .Values.paths.stateDir }}"
              chmod 0700 "{{ .Values.paths.stateDir }}"
              [ -d "{{ $storeDir }}" ] || mkdir -p "{{ $storeDir }}"
              chown {{ $uid }}:{{ $gid }} "{{ $storeDir }}"
              chmod 0700 "{{ $storeDir }}"
{{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: check
              mountPath: /check
            - name: tmp
              mountPath: /tmp
{{- if $check.broker.configMap }}
            - name: broker-source
              mountPath: /source/broker.d
              readOnly: true
{{- end }}
{{- if $store }}
            - name: provider-set-source
              mountPath: /source/provider-set
              readOnly: true
            - name: state
              mountPath: {{ .Values.paths.stateDir }}
{{- end }}
{{- if $workflows }}
            - name: workflows-source
              mountPath: /source/workflows.d
              readOnly: true
{{- end }}
{{- if $peers }}
            - name: peers-source
              mountPath: /source/peers
              readOnly: true
{{- end }}
      containers:
{{- if $check.broker.configMap }}
        - name: check-broker
          image: {{ include "dekopon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dekopon-brokerd"]
          args:
{{- range include "dekopon.runtimeArgs" (dict "ctx" . "daemon" "broker") | fromJsonArray }}
            - {{ . | quote }}
{{- end }}
            - check
            - /check/broker.d
{{- if $store }}
            - --provider-set=/check/provider-set/providers.yaml
            - --store={{ $storeDir }}
{{- if $workflows }}
            - --workflows=/check/workflows.d
{{- end }}
{{- end }}
            - --output=json
          securityContext:
            {{- toYaml $brokerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
          volumeMounts:
            - name: check
              mountPath: /check
              readOnly: true
            - name: tmp
              mountPath: /tmp
{{- if $store }}
            - name: state
              mountPath: {{ $storeDir }}
              subPath: config-check
{{- end }}
{{- end }}
{{- if $check.gateway.configMap }}
        - name: check-gateway
          image: {{ include "dekopon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dekopon-gatewayd"]
          args:
{{- range include "dekopon.runtimeArgs" (dict "ctx" . "daemon" "gateway") | fromJsonArray }}
            - {{ . | quote }}
{{- end }}
            - check
            - /check/gatewayd.d
            - --catalog=/check/agents.d
            - --probe
{{- if $check.gateway.againstConfigMap }}
            - --against=/check/live.d
{{- end }}
            - --output=json
          {{- with $check.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $gatewaySecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: gateway-source
              mountPath: /check/gatewayd.d
              readOnly: true
            - name: catalog-source
              mountPath: /check/agents.d
              readOnly: true
{{- if $check.gateway.againstConfigMap }}
            - name: against-source
              mountPath: /check/live.d
              readOnly: true
            - name: catalog
              mountPath: {{ .Values.paths.catalogDir }}
              readOnly: true
{{- end }}
            - name: tmp
              mountPath: /tmp
{{- if .Values.gateway.proxy.enabled }}
            - name: proxy-tls
              mountPath: /etc/dekopon-proxy-tls
              readOnly: true
{{- end }}
{{- if $skills }}
            - name: skills
              mountPath: {{ .Values.paths.skillsDir }}
              readOnly: true
{{- end }}
{{- end }}
      volumes:
{{- if and $check.gateway.configMap .Values.gateway.proxy.enabled }}
        - name: proxy-tls
          secret:
            secretName: {{ .Values.gateway.proxy.tlsSecret }}
{{- end }}
        - name: check
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.volumeSizes.config }}
        - name: tmp
          emptyDir: {}
{{- if $check.broker.configMap }}
        - name: broker-source
          configMap:
            name: {{ $check.broker.configMap }}
{{- end }}
{{- if $store }}
        - name: provider-set-source
          configMap:
            name: {{ $check.broker.providerSetConfigMap }}
            items:
              - key: providers.yaml
                path: providers.yaml
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "dekopon.stateClaimName" . }}
{{- end }}
{{- if $workflows }}
        - name: workflows-source
          configMap:
            name: {{ $check.broker.workflowsConfigMap }}
{{- end }}
{{- if $peers }}
        - name: peers-source
          configMap:
            name: {{ include "dekopon.fullname" . }}-check-peers
{{- end }}
{{- if $check.gateway.configMap }}
        - name: gateway-source
          configMap:
            name: {{ $check.gateway.configMap }}
            defaultMode: 292
        - name: catalog-source
          configMap:
            name: {{ $check.gateway.catalogConfigMap }}
{{- if $check.gateway.againstConfigMap }}
        - name: against-source
          configMap:
            name: {{ $check.gateway.againstConfigMap }}
        - name: catalog
          configMap:
{{- if .Values.gateway.catalog.existingConfigMap }}
            name: {{ .Values.gateway.catalog.existingConfigMap }}
{{- with .Values.gateway.catalog.existingConfigMapKey }}
            items:
              - key: {{ . }}
                path: {{ $.Values.gateway.catalog.fileName }}
{{- end }}
{{- else }}
            name: {{ include "dekopon.catalogConfigMapName" . }}
{{- end }}
{{- end }}
{{- end }}
{{- if $skills }}
        - name: skills
          configMap:
            name: {{ $check.gateway.skillsConfigMap }}
            defaultMode: 292
            items:
              {{- toYaml .Values.gateway.skills.items | nindent 14 }}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
