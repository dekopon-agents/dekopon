{{- if .Values.broker.credentials.inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dekopon.credentialsSecretName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
type: Opaque
# Separate from the configuration Secret so it can be rotated, RBAC-scoped, and reviewed on its
# own. Prefer broker.credentials.existingSecret over inline: an inline value is stored in the
# release, returned by `helm get values`, and usually committed.
stringData:
  broker-credentials.yaml: |
    {{- .Values.broker.credentials.inline | nindent 4 }}
{{- end }}
