{{- include "dekopon.validate" . -}}
{{- if or .Values.gateway.service.enabled .Values.gateway.proxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dekopon.fullname" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "dekopon.selectorLabels" . | nindent 4 }}
  ports:
{{- if .Values.gateway.service.enabled }}
    - name: webhook
      port: {{ .Values.gateway.service.port }}
      targetPort: webhook
      protocol: TCP
      appProtocol: http
{{- end }}
{{- if .Values.gateway.proxy.enabled }}
    - name: vm-proxy
      port: {{ .Values.gateway.proxy.port }}
      targetPort: vm-proxy
      protocol: TCP
      appProtocol: https
{{- end }}
{{- end }}
