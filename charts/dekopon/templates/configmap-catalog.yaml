{{- if and .Values.gateway.enabled .Values.gateway.catalog.inline }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dekopon.catalogConfigMapName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
# Gateway source trust accepts the read-only root-owned ConfigMap projection; mounting the
# directory directly preserves AtomicWriter updates for reconciliation.
data:
  {{ .Values.gateway.catalog.fileName }}: |
    {{- .Values.gateway.catalog.inline | nindent 4 }}
{{- end }}
