{{- include "dekopon.validate" . -}}
{{- if include "dekopon.hasInlineConfig" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dekopon.configSecretName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
type: Opaque
# The broker's files are copied into its private directory; it never mounts this source.
stringData:
  {{- if .Values.broker.config.inline }}
  broker.yaml: |
    {{- .Values.broker.config.inline | nindent 4 }}
  {{- end }}
  {{- if .Values.broker.policies.inline }}
  policies.cedar: |
    {{- .Values.broker.policies.inline | nindent 4 }}
  {{- end }}
  {{- if .Values.broker.secretMap.inline }}
  secret-map.yaml: |
    {{- .Values.broker.secretMap.inline | nindent 4 }}
  {{- end }}
{{- end }}
