{{- include "dekopon.validate" . -}}
{{- if include "dekopon.hasInlineConfig" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dekopon.configSecretName" . }}
  labels:
    {{- include "dekopon.labels" . | nindent 4 }}
type: Opaque
# A Secret rather than a ConfigMap even for policies.cedar and dekopond.yaml, which hold no
# secrets: the init container reads every one of these through the same projected volume, and one
# source kind is one fewer thing to get wrong. Nothing is mounted from here directly — a Secret
# volume is a symlink farm, and dekopon-brokerd opens with O_NOFOLLOW.
stringData:
  {{- if .Values.broker.config.inline }}
  broker.yaml: |
    {{- .Values.broker.config.inline | nindent 4 }}
  {{- end }}
  {{- if .Values.broker.policies.inline }}
  policies.cedar: |
    {{- .Values.broker.policies.inline | nindent 4 }}
  {{- end }}
  {{- if and .Values.gateway.enabled .Values.gateway.config.inline }}
  dekopond.yaml: |
    {{- .Values.gateway.config.inline | nindent 4 }}
  {{- end }}
{{- end }}
